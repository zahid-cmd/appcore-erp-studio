<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <title>AppCore Console</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        // theme before the first paint (no flash)
        try
        {
            var t = localStorage.getItem('appcore.console.theme');

            if (t === 'dark' || t === 'light')
            {
                document.documentElement.setAttribute('data-theme', t);
            }
        }
        catch (e)
        {
        }
    </script>
</head>
<body>
    <ac-root></ac-root>
</body>
</html>

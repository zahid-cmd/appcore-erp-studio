<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Receipt Voucher"
        subtitle="Money received : Draft → Approved → Posted"
        icon="fas fa-file-invoice-dollar">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search receipt vouchers..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <!-- =================================================
             LEDGER TYPE FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Ledger Types"
            [items]="partyTypeFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedPartyType"
            (valueChange)="onPartyTypeFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="receiptVouchers"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (ledger type and search applied; not the tab)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="rv-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="rv-summary-item">
                    <span class="rv-summary-label">{{ item.label }}</span>
                    <b
                        class="rv-summary-value"
                        [class.rv-ok]="item.tone === 'ok'"
                        [class.rv-bad]="item.tone === 'bad'"
                        [class.rv-muted]="item.tone === 'muted'">{{ item.value }}</b>
                </span>
            }

            <span class="rv-summary-note">
                Matching the ledger type and search
            </span>

        </div>
    }

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-calendar-days"

        [title]="pageTitle"

        subtitle="Manage financial years">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : FINANCIAL YEAR INFORMATION
            ================================================== -->

            <app-form-section

                title="Financial Year Information"

                icon="fas fa-calendar-days">


                <!-- Financial Year Code -->

                <app-textbox

                    label="Financial Year Code"

                    placeholder="Auto generated"

                    [(value)]="entity.FinancialYearCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Financial Year Name (auto generated) -->

                <app-textbox

                    label="Financial Year Name"

                    placeholder="FY YYYY-YYYY"

                    [(value)]="entity.FinancialYearName"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 02 : PERIOD
            ================================================== -->

            <app-form-section

                title="Period"

                icon="fas fa-calendar-week">


                <!-- Start Date -->

                <div class="fy-date-field">

                    <label class="fy-date-label">

                        Start Date <span class="fy-required">*</span>

                    </label>

                    <app-datepicker

                        placeholder="Select start date"

                        [value]="$any(startDateValue)"

                        (valueChange)="onStartDateChange($event)"

                        [disabled]="isViewMode || isSaving">

                    </app-datepicker>

                </div>


                <!-- End Date -->

                <div class="fy-date-field">

                    <label class="fy-date-label">

                        End Date <span class="fy-required">*</span>

                    </label>

                    <app-datepicker

                        placeholder="Select end date"

                        [value]="$any(endDateValue)"

                        (valueChange)="onEndDateChange($event)"

                        [disabled]="isViewMode || isSaving">

                    </app-datepicker>

                </div>


                <!-- Duration -->

                @if (durationText)
                {
                    <div

                        class="fy-duration"

                        [class.fy-duration-invalid]="!durationIsValid">

                        <i class="fas fa-hourglass-half"></i>

                        <span>{{ durationText }}</span>

                        @if (!isViewMode)
                        {
                            <button

                                type="button"

                                class="fy-reset-link"

                                (click)="resetEndDate()"

                                [disabled]="isSaving">

                                Set 12 months

                            </button>
                        }

                    </div>
                }

            </app-form-section>



            <!-- =================================================
                 SECTION 03 : CONFIGURATION
            ================================================== -->

            <app-form-section

                title="Configuration"

                icon="fas fa-toggle-on">


                <!-- Current Year -->

                <app-dropdown

                    label="Current Year"

                    [items]="yesNoItems"

                    [(value)]="entity.IsCurrent"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving || entity.YearStatus !== 'Open'"

                    [required]="true">

                </app-dropdown>


                <!-- Year Status -->

                <app-dropdown

                    label="Year Status"

                    [items]="yearStatusItems"

                    [(value)]="entity.YearStatus"

                    (valueChange)="onYearStatusChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : STATUS & DESCRIPTION
            ================================================== -->

            <app-form-section

                title="Status & Description"

                icon="fas fa-align-left">


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

<!-- PAGE-CLONED : Company -> Color Management (cleaned) -->
<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-palette"

        [title]="pageTitle"

        subtitle="Manage product colors">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =============================================
                 COLOR INFORMATION
            ============================================== -->

            <app-form-section

                title="Color Information"

                icon="fas fa-palette">


                <!-- Color Code (generated by the server) -->

                <app-textbox

                    label="Color Code"

                    placeholder="Auto generated"

                    [(value)]="entity.ColorCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =============================================
                 CONFIGURATION
            ============================================== -->

            <app-form-section

                title="Name"

                icon="fas fa-sliders">

                <!-- Color Name -->

                <app-textbox

                    label="Color Name"

                    placeholder="Enter color name"

                    [(value)]="entity.ColorName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>

            </app-form-section>

            <!-- =============================================
                 Status
            ============================================== -->

            <app-form-section

                title="Status"

                icon="fas fa-sliders">


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>

            </app-form-section>

            <!-- =============================================
                 DESCRIPTION
            ============================================== -->

            <app-form-section

                title="Description"

                icon="fas fa-align-left">


                <!-- Remarks (optional) -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

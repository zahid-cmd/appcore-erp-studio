<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        title="Accessories"

        subtitle="Manage accessories"

        icon="fas fa-puzzle-piece">

        <div pageHeaderCenter>

            <app-search-box

                [(value)]="searchText"

                placeholder="Search accessories..."

                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>


        <div pageHeaderRight>

            <app-command-center

                command1Text="Add"

                command1Icon="fas fa-plus"

                (command1Click)="add()"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                (command2Click)="refresh()"

                command3Text="Restore"

                command3Icon="fas fa-trash-arrow-up"

                (command3Click)="restore()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

        <!-- =================================================
             FILTERS : Category → Sub Category
        ================================================== -->

        <app-search-dropdown

            pageToolbarRight

            placeholder="All Categories"

            [items]="categoryFilterItems"

            minWidth="230px"

            [value]="selectedCategoryId"

            (valueChange)="onCategoryFilterChange($event)">

        </app-search-dropdown>


        <app-search-dropdown

            pageToolbarRight

            placeholder="All Sub Categories"

            [items]="subCategoryFilterItems"

            minWidth="300px"

            [value]="selectedSubCategoryId"

            (valueChange)="onSubCategoryFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="canvasConfig">


        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table

                [columns]="columns"

                [rows]="accessories"

                [serialOffset]="(currentPage - 1) * pageSize"

                [loading]="loading"

                [error]="loadFailed"

                (view)="view($event)"

                (edit)="edit($event)"

                (delete)="delete($event)"

                (sortChange)="onSort($event)">

            </app-list-table>

        </div>



        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination

            canvasFooter

            [totalRecords]="totalRecords"

            [currentPage]="currentPage"

            [pageSize]="pageSize"

            (pageChange)="onPageChange($event)"

            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>



    <!-- =====================================================
         SUMMARY (search applied)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="acc-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="acc-summary-item">
                    <span class="acc-summary-label">{{ item.label }}</span>
                    <b
                        class="acc-summary-value"
                        [class.acc-ok]="item.tone === 'ok'"
                        [class.acc-bad]="item.tone === 'bad'">{{ item.value }}</b>
                </span>
            }

            <span class="acc-summary-note">
                Matching the search
            </span>

        </div>
    }



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer

        [opened]="historyOpened"

        [title]="historyTitle"

        [items]="historyItems"

        (closed)="closeHistory()">

    </app-history-drawer>



    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

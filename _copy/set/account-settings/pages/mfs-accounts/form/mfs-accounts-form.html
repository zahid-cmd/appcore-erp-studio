<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-mobile-screen-button"

        [title]="pageTitle"

        subtitle="Manage mfs accounts">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : PARENT INFORMATION
            ================================================== -->

            <app-form-section

                title="Parent Information"

                icon="fas fa-sitemap">


                <!-- Branch -->

                <app-search-dropdown

                    label="Branch"

                    [items]="branchItems"

                    [(value)]="entity.Branch"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-search-dropdown>


                <!-- Account Sub Group (Reserved : SUB-002-002-003) -->

                <app-search-dropdown

                    label="Account Sub Group"

                    [items]="accountSubGroupItems"

                    [(value)]="entity.AccountSubGroupsId"

                    [disabled]="true"

                    [required]="true">

                </app-search-dropdown>


                <!-- MFS Account Name (Provider) -->

                <app-search-dropdown

                    label="MFS Account Name"

                    [items]="mfsProviderItems"

                    [(value)]="entity.MFSAccountName"

                    (valueChange)="onDisplayPartChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-search-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 02 : MFS ACCOUNT INFORMATION
            ================================================== -->

            <app-form-section

                title="MFS Accounts Information"

                icon="fas fa-layer-group">


                <!-- MFS Account Code -->

                <app-textbox

                    label="MFS Account Code"

                    placeholder="Auto generated"

                    [(value)]="entity.MFSAccountCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Account Type (Personal / Merchant) -->

                <app-dropdown

                    label="Account Type"

                    [items]="accountTypeItems"

                    [(value)]="entity.AccountType"

                    (valueChange)="onAccountTypeChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <!-- MFS Account Number -->

                <app-textbox

                    label="MFS Account Number"

                    placeholder="Enter MFS account number (e.g. 01712345678)"

                    [(value)]="entity.MFSAccountNumber"

                    (valueChange)="onDisplayPartChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 03 : DISPLAY & CONFIGURATION
            ================================================== -->

            <app-form-section

                title="Display & Configuration"

                icon="fas fa-toggle-on">


                <!-- Display Name (MFS Account Name - MFS Account Number) -->

                <app-textbox

                    label="Display Name"

                    placeholder="Auto generated"

                    [(value)]="entity.DisplayName"

                    [readonly]="true">

                </app-textbox>


                <!-- Linked Bank Account (Merchant only) -->

                <app-search-dropdown

                    label="Linked Bank Account"

                    [items]="linkedBankAccountItems"

                    [(value)]="entity.LinkedBankAccount"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving || !isMerchant"

                    [required]="isMerchant">

                </app-search-dropdown>


                <!-- MFS Charges % (Merchant only) -->

                <app-textbox

                    label="MFS Charges (%)"

                    [placeholder]="isMerchant ? 'Enter charges, e.g. 1.50' : 'Merchant accounts only'"

                    [(value)]="mfsChargesText"

                    (valueChange)="onMfsChargesChange()"

                    [disabled]="isViewMode || isSaving || !isMerchant"

                    [required]="isMerchant">

                </app-textbox>


                <!-- Collection Account -->

                <app-dropdown

                    label="Collection Account"

                    [items]="yesNoItems"

                    [(value)]="entity.CollectionAccount"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <!-- Payment Account -->

                <app-dropdown

                    label="Payment Account"

                    [items]="yesNoItems"

                    [(value)]="entity.PaymentAccount"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : STATUS & DESCRIPTION
            ================================================== -->

            <app-form-section

                title="Status & Description"

                icon="fas fa-align-left">


                <!-- Branch Exclusive -->

                <app-dropdown

                    label="Branch Exclusive"

                    [items]="yesNoItems"

                    [(value)]="entity.BranchExclusive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

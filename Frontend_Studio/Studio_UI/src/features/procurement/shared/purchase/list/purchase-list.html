<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        [title]="page.listTitle"
        subtitle="Purchase : Draft → Approved → Posted"
        icon="fas fa-file-invoice-dollar">

        <div pageHeaderCenter>

            <app-search-box
                [value]="searchText"
                placeholder="Search purchases..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <div
            pageToolbarLeft
            class="pu-toolbar-left">

            <app-control-tabs
                [tabs]="tabs"
                selectedTab="all"
                (selectedTabChange)="onTabChange($event)">

            </app-control-tabs>

            <!-- =============================================
                 DATE RANGE (purchase date)
            ============================================== -->

            <div class="pu-dates">

                <app-datepicker
                    class="pu-date"
                    placeholder="From date"
                    [value]="$any(dateFrom)"
                    [maxDate]="dateTo"
                    (valueChange)="onDateFromChange($event)">

                </app-datepicker>

                <span class="pu-dates-sep">to</span>

                <app-datepicker
                    class="pu-date"
                    placeholder="To date"
                    [value]="$any(dateTo)"
                    [minDate]="dateFrom"
                    (valueChange)="onDateToChange($event)">

                </app-datepicker>

                @if (hasDates)
                {
                    <button
                        type="button"
                        class="pu-dates-clear"
                        title="Clear the dates"
                        aria-label="Clear the dates"
                        (click)="clearDates()">

                        <i class="fas fa-xmark"></i>

                    </button>
                }

            </div>

        </div>

        <div
            pageToolbarRight
            class="pu-toolbar-right">

            <!-- =============================================
                 STATUS FILTER (the supplier list follows it)
            ============================================== -->

            <app-search-dropdown
                class="pu-status"
                placeholder="All Statuses"
                [items]="statusFilterItems"
                labelField="label"
                valueField="value"
                [value]="selectedStatus"
                (valueChange)="onStatusFilterChange($event)">

            </app-search-dropdown>

            <!-- =============================================
                 SUPPLIER FILTER
            ============================================== -->

            <app-search-dropdown
                class="pu-supplier"
                placeholder="All Suppliers"
                [items]="supplierFilterItems"
                labelField="label"
                valueField="value"
                [value]="selectedSupplier"
                (valueChange)="onSupplierFilterChange($event)">

            </app-search-dropdown>

        </div>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="pagedPurchases"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)"
                (rowHover)="itemHover.onHover($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (supplier and search applied)
    ====================================================== -->

    @if (summaryTotal > 0)
    {
        <div class="ics-summary">

            <span class="ics-summary-item">
                <span class="ics-summary-label">Total</span>
                <b class="ics-summary-value">{{ summaryText(summaryTotal) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Draft</span>
                <b class="ics-summary-value">{{ summaryText(countOf('Draft')) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Approved</span>
                <b class="ics-summary-value">{{ summaryText(countOf('Approved')) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Posted</span>
                <b class="ics-summary-value ics-ok">{{ summaryText(countOf('Posted')) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Cancelled</span>
                <b class="ics-summary-value ics-bad">{{ summaryText(countOf('Cancelled')) }}</b>
            </span>

            <span class="ics-summary-note">
                {{ summaryNote }}
            </span>

        </div>
    }

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <!-- Items of the row under the mouse (switch "Show Items
         on Hover") -->
    <app-item-summary-card [card]="itemHover.card"></app-item-summary-card>

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

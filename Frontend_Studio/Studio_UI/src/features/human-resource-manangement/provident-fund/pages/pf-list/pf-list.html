<div class="app-list-page">

    <app-page-header
        [title]="page.title"
        [subtitle]="page.subtitle"
        [icon]="page.icon">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                [placeholder]="'Search ' + page.title + '...'"
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <app-page-toolbar>

        <div
            pageToolbarRight
            class="hrs-filters">
            <app-search-dropdown
                [placeholder]="page.filterAll"
                [items]="filterOptions"
                labelField="label"
                valueField="value"
                [value]="selectedFilter"
                (valueChange)="onFilterChange($event)">
            </app-search-dropdown>
        </div>

    </app-page-toolbar>

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [actions]="page.actions"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    @if (summaryItems.length > 0)
    {
        <div class="hrs-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="hrs-summary-item">
                    <span class="hrs-summary-label">{{ item.label }}</span>
                    <b class="hrs-summary-value">{{ item.value }}</b>
                </span>
            }

            <span class="hrs-summary-note">{{ page.note }}</span>

        </div>
    }

    <app-history-drawer
        [opened]="historyOpened"
        [title]="page.singular + ' History'"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

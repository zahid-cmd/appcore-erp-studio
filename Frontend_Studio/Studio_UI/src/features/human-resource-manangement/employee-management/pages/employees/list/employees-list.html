<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Employee Profiles"
        subtitle="Staff records : personal, job and salary structure"
        icon="fas fa-users">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                placeholder="Search name, code, mobile..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <div
            pageToolbarRight
            class="empl-filters">

            <app-search-dropdown
                placeholder="All Branches"
                [items]="branchItems"
                labelField="label"
                valueField="value"
                [value]="selectedBranch"
                (valueChange)="onBranchChange($event)">
            </app-search-dropdown>

            <app-search-dropdown
                placeholder="All Departments"
                [items]="departmentItems"
                labelField="label"
                valueField="value"
                [value]="selectedDepartment"
                (valueChange)="onDepartmentChange($event)">
            </app-search-dropdown>

            <!-- the status : a dropdown (no tabs) -->
            <app-search-dropdown
                placeholder="All Status"
                [items]="statusItems"
                labelField="label"
                valueField="value"
                [value]="selectedTab"
                (valueChange)="onTabChange($event)">
            </app-search-dropdown>

        </div>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (search and filters applied, all statuses)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="empl-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="empl-summary-item">
                    <span class="empl-summary-label">{{ item.label }}</span>
                    <b
                        class="empl-summary-value"
                        [class.empl-ok]="item.tone === 'ok'"
                        [class.empl-bad]="item.tone === 'bad'">{{ item.value }}</b>
                </span>
            }

            <span class="empl-summary-note">
                Make an employee who has left Inactive : the record is kept
            </span>

        </div>
    }

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

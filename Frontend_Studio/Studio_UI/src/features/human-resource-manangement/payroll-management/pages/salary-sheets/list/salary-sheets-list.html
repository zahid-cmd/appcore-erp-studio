<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Salary Sheets"
        subtitle="The salary of a branch for a month : generate, approve, post, pay"
        icon="fas fa-file-invoice-dollar">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                placeholder="Search month, branch, code..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Generate"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [selectedTab]="selectedTab"
            (selectedTabChange)="onTabChange($event)">
        </app-control-tabs>

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Branches"
            [items]="branchItems"
            labelField="label"
            valueField="value"
            [value]="selectedBranch"
            (valueChange)="onBranchChange($event)">
        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="open($event)"
                (edit)="open($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (search and branch applied, every status)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="pay-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="pay-summary-item">
                    <span class="pay-summary-label">{{ item.label }}</span>
                    <b
                        class="pay-summary-value"
                        [class.pay-ok]="item.tone === 'ok'"
                        [class.pay-bad]="item.tone === 'bad'">{{ item.value }}</b>
                </span>
            }

            <span class="pay-summary-note">
                Open a sheet to approve, post, pay and print payslips
            </span>

        </div>
    }

    <app-history-drawer
        [opened]="historyOpened"
        title="Salary Sheet History"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

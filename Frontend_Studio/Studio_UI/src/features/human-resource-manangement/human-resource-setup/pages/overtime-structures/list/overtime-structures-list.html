<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Overtime Structures"
        subtitle="How overtime is paid : picked on the Employee Profile"
        icon="fas fa-layer-group">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                placeholder="Search overtime structures..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <!-- the status : a dropdown (no tabs) -->
        <div
            pageToolbarRight
            class="hrs-filters">
            <app-search-dropdown
                placeholder="All Status"
                [items]="statusItems"
                labelField="label"
                valueField="value"
                [value]="selectedTab"
                (valueChange)="onTabChange($event)">
            </app-search-dropdown>
        </div>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (search applied, all statuses)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="hrs-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="hrs-summary-item">
                    <span class="hrs-summary-label">{{ item.label }}</span>
                    <b
                        class="hrs-summary-value"
                        [class.hrs-ok]="item.tone === 'ok'"
                        [class.hrs-bad]="item.tone === 'bad'">{{ item.value }}</b>
                </span>
            }

            <span class="hrs-summary-note">
                Overtime is paid for extra hours and for days worked on a weekly or public holiday
            </span>

        </div>
    }

    <app-history-drawer
        [opened]="historyOpened"
        title="Overtime Structure History"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Purchase VAT"
        subtitle="VAT rates on purchases, by VAT type and date"
        icon="fas fa-percent">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search rules..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         EXPIRY ALERTS (Expiring / Expired rules)
    ====================================================== -->

    @if (alerts.length)
    {
        <div class="vat-alerts" role="alert">

            <i class="fas fa-triangle-exclamation"></i>

            <div class="vat-alerts-text">

                @for (alert of alerts; track $index)
                {
                    <div>{{ alert }}</div>
                }

            </div>

        </div>
    }

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <!-- =================================================
             RATE STATE FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All States"
            [items]="stateFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedState"
            (valueChange)="onStateFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Status"
            [items]="statusFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedStatus"
            (valueChange)="onStatusFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="pagedRules"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="filteredRules.length"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

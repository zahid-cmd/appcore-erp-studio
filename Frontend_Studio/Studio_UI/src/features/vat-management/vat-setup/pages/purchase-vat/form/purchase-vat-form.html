<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-percent"

        [title]="pageTitle"

        subtitle="VAT rates on purchases, by VAT type and date">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            command3Text="Extend"

            command3Icon="fas fa-calendar-plus"

            (command3Click)="onExtend()"

            [command3Visible]="canExtend"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : VAT INFORMATION
            ================================================== -->

            <app-form-section

                title="VAT Information"

                icon="fas fa-receipt">


                <!-- Code (generated by the server) -->

                <app-textbox

                    label="Code"

                    placeholder="Auto generated"

                    [value]="entity.VatCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- VAT Type (locked after saving) -->

                <app-dropdown

                    label="VAT Type"

                    [items]="typeItems"

                    [value]="entity.VatType"

                    (valueChange)="onTypeChange($event)"

                    [disabled]="!isAddMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="3"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>



            <!-- =================================================
                 SECTION 02 : RATE
            ================================================== -->

            <app-form-section

                title="Rate"

                icon="fas fa-percent">


                <app-textbox

                    label="VAT Rate (%)"

                    placeholder="e.g. 15"

                    inputMode="decimal"

                    [value]="rateText"

                    (valueChange)="onRateText($event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-textbox>


                <app-dropdown

                    label="Input Credit Allowed"

                    [items]="flagItems"

                    [value]="entity.InputCreditAllowed"

                    (valueChange)="onFlagChange($event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 03 : PERIOD
                 Valid To defaults to 30 June (financial year end).
                 Same rate next period : Extend (header).
            ================================================== -->

            <app-form-section

                title="Period"

                icon="fas fa-calendar-days">


                <app-datepicker

                    label="Effective From"

                    [required]="true"

                    [value]="$any(effectiveFromDate)"

                    (valueChange)="onEffectiveFrom($event)"

                    [disabled]="isViewMode || isSaving">

                </app-datepicker>


                <app-datepicker

                    label="Valid To"

                    [required]="true"

                    [value]="$any(validToDate)"

                    [minDate]="$any(effectiveFromDate)"

                    (valueChange)="onValidTo($event)"

                    [disabled]="isViewMode || isSaving">

                </app-datepicker>


                <app-textbox

                    label="Rate State"

                    placeholder="Current / Expiring / Expired / Upcoming / Old"

                    [value]="rateStateText"

                    [readonly]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : LEDGER & STATUS
            ================================================== -->

            <app-form-section

                title="Ledger & Status"

                icon="fas fa-book">


                <!-- VAT Current Account (sub group SUB-002-002-011) -->

                <app-search-dropdown

                    label="VAT Current Account"

                    [items]="ledgerItems"

                    [value]="entity.LedgerCode"

                    (valueChange)="onLedgerChange($event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-search-dropdown>


                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>


<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

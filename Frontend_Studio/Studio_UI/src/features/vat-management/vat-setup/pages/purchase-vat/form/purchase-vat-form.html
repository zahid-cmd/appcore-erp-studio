<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-percent"

        art="ledger"

        [title]="pageTitle"

        subtitle="VAT rates on purchases, by VAT type and date">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            command3Text="Extend"

            command3Icon="fas fa-calendar-plus"

            (command3Click)="onExtend()"

            [command3Visible]="canExtend"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-step-tabs

            pageToolbarLeft

            [steps]="formSteps"

            [current]="selectedTab"

            (currentChange)="onTabChange($event)">

        </app-step-tabs>


        <!-- more than one screen : no scrolling -->

        <app-step-nav

            pageToolbarRight

            [steps]="formSteps"

            [current]="selectedTab"

            (currentChange)="onTabChange($event)">

        </app-step-nav>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="formConfig">

        <div
            canvasBody
            class="ws-body appcore-scrollbar">

            <!-- ================= LEFT : the fields (2026-11-16 workspace layout) ================= -->

            <div class="ws-steps">

                <div
                    class="ws-step"
                    [class.ws-step-off]="selectedTab !== 'general'">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-receipt"></i>
                            <span>VAT Information</span>
                        </header>

                        <div class="ws-grid ws-cols-2">
                            <app-textbox
                                label="Code"
                                placeholder="Auto generated"
                                [value]="entity.VatCode"
                                [readonly]="true"
                                [required]="true">
                            </app-textbox>

                            <app-dropdown
                                label="VAT Type"
                                [items]="typeItems"
                                [value]="entity.VatType"
                                (valueChange)="onTypeChange($event)"
                                [disabled]="!isAddMode || isSaving"
                                [required]="true">
                            </app-dropdown>
                        </div>

                    </section>

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-percent"></i>
                            <span>Rate</span>
                        </header>

                        <div class="ws-grid ws-cols-2">
                            <app-textbox
                                label="VAT Rate (%)"
                                placeholder="e.g. 15"
                                inputMode="decimal"
                                [value]="rateText"
                                (valueChange)="onRateText($event)"
                                [disabled]="isViewMode || isSaving"
                                [required]="true">
                            </app-textbox>
                        </div>

                    </section>

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-calendar-days"></i>
                            <span>Period</span>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-datepicker
                                label="Effective From"
                                [required]="true"
                                [value]="$any(effectiveFromDate)"
                                (valueChange)="onEffectiveFrom($event)"
                                [disabled]="isViewMode || isSaving">
                            </app-datepicker>

                            <app-datepicker
                                label="Valid To"
                                [required]="true"
                                [value]="$any(validToDate)"
                                [minDate]="$any(effectiveFromDate)"
                                (valueChange)="onValidTo($event)"
                                [disabled]="isViewMode || isSaving">
                            </app-datepicker>

                            <app-textbox
                                label="Rate State"
                                placeholder="Current / Expiring / Expired / Upcoming / Old"
                                [value]="rateStateText"
                                [readonly]="true">
                            </app-textbox>
                        </div>

                    </section>

                </div>

                <div
                    class="ws-step"
                    [class.ws-step-off]="selectedTab !== 'step2'">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-book"></i>
                            <span>Ledger & Status</span>
                        </header>

                        <div class="ws-grid ws-cols-2">
                            <app-search-dropdown
                                label="VAT Current Account (Posting Setup)"
                                [items]="ledgerItems"
                                [value]="entity.LedgerCode"
                                (valueChange)="onLedgerChange($event)"
                                [disabled]="true"
                                [required]="true">
                            </app-search-dropdown>
                        </div>

                    </section>

                    <section class="ws-card ws-notes">

                        <header class="ws-card-head">
                            <i class="fas fa-note-sticky"></i>
                            <span>Remarks</span>
                        </header>

                        <app-note-pad
                            placeholder="Anything the team should know"
                            note="Only for your team, never printed"
                            [maxLength]="1000"
                            [(value)]="entity.Remarks"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-note-pad>

                    </section>

                </div>

            </div>

            <!-- ================= RIGHT : the workspace ================= -->

            <aside class="ws-panel">

                <div class="ws-hero">

                    <app-workspace-art theme="ledger"></app-workspace-art>

                    <div class="ws-identity">

                        <b [class.ws-new]="!pageTitle">{{ pageTitle || 'New VAT rate' }}</b>

                        <div class="ws-chips">

                        </div>

                    </div>

                    <app-toggle-switch
                        label="Input Credit Allowed"
                        onText="Yes"
                        offText="No"
                        [value]="entity.InputCreditAllowed"
                        (valueChange)="onFlagChange($event)"
                        [disabled]="isViewMode || isSaving">
                    </app-toggle-switch>

                    <app-toggle-switch
                        label="Status"
                        onText="Active"
                        offText="Inactive"
                        [(value)]="entity.Status"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-toggle-switch>
                    <ul class="ws-uses">
                        <li><i class="fas fa-file-invoice"></i><span>Applied on purchases invoices</span></li>
                        <li><i class="fas fa-book"></i><span>Posts to the VAT ledger</span></li>
                        <li><i class="fas fa-scale-balanced"></i><span>Feeds the VAT 6.3 return</span></li>
                    </ul>

                </div>

            </aside>

        </div>


    </app-page-canvas>

</div>


<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

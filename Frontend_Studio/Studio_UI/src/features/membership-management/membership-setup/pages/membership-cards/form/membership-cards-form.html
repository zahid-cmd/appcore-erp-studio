<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-id-card"

        art="card"

        [title]="pageTitle"

        subtitle="A card creates its fee, discount and complimentary service ledgers">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-step-tabs

            pageToolbarLeft

            [steps]="formSteps"

            [current]="selectedTab"

            (currentChange)="onTabChange($event)">

        </app-step-tabs>


        <!-- more than one screen : no scrolling -->

        <app-step-nav

            pageToolbarRight

            [steps]="formSteps"

            [current]="selectedTab"

            (currentChange)="onTabChange($event)">

        </app-step-nav>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="formConfig">

        <div
            canvasBody
            class="ws-body appcore-scrollbar">

            <!-- ================= LEFT : the fields (2026-11-16 workspace layout) ================= -->

            <div class="ws-steps">

                <div
                    class="ws-step"
                    [class.ws-step-off]="selectedTab !== 'general'">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-id-card"></i>
                            <span>Card Information</span>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-textbox
                                label="Card Code"
                                placeholder="Auto generated"
                                [(value)]="entity.CardCode"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Card Name"
                                placeholder="e.g. Gold Card"
                                [(value)]="entity.CardName"
                                (valueChange)="onCardNameChange()"
                                [disabled]="isViewMode || isSaving"
                                [required]="true">
                            </app-textbox>

                            <app-textbox
                                label="Card Rank"
                                placeholder="1 = lowest card"
                                [value]="cardRankText"
                                (valueChange)="onCardRankChange($event)"
                                [disabled]="isViewMode || isSaving"
                                [required]="true">
                            </app-textbox>
                        </div>

                    </section>

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-sack-dollar"></i>
                            <span>Income Ledgers</span>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-textbox
                                label="Fee Sub Group"
                                placeholder="SUB-009-003-001"
                                [value]="feeSubGroupDisplay"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Fee Ledger Code"
                                placeholder="Auto generated"
                                [(value)]="entity.FeeLedgerCode"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Fee Ledger Name"
                                placeholder="Sub group name - card name"
                                [(value)]="entity.FeeLedgerName"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Income Ledger Code"
                                placeholder="Auto generated"
                                [(value)]="entity.ServiceIncomeLedgerCode"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Income Ledger Name"
                                placeholder="Sub group name - card name"
                                [(value)]="entity.ServiceIncomeLedgerName"
                                [readonly]="true">
                            </app-textbox>
                        </div>

                    </section>

                </div>

                <div
                    class="ws-step"
                    [class.ws-step-off]="selectedTab !== 'step2'">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-receipt"></i>
                            <span>Expense Ledgers</span>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-textbox
                                label="Discount Sub Group"
                                placeholder="SUB-004-002-002"
                                [value]="discountSubGroupDisplay"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Discount Ledger Code"
                                placeholder="Auto generated"
                                [(value)]="entity.DiscountLedgerCode"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Discount Ledger Name"
                                placeholder="Sub group name - card name"
                                [(value)]="entity.DiscountLedgerName"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Expense Ledger Code"
                                placeholder="Auto generated"
                                [(value)]="entity.ServiceExpenseLedgerCode"
                                [readonly]="true">
                            </app-textbox>

                            <app-textbox
                                label="Expense Ledger Name"
                                placeholder="Sub group name - card name"
                                [(value)]="entity.ServiceExpenseLedgerName"
                                [readonly]="true">
                            </app-textbox>
                        </div>

                    </section>

                    <section class="ws-card ws-notes">

                        <header class="ws-card-head">
                            <i class="fas fa-note-sticky"></i>
                            <span>Remarks</span>
                        </header>

                        <app-note-pad
                            placeholder="Anything the team should know"
                            note="Only for your team, never printed"
                            [maxLength]="1000"
                            [(value)]="entity.Remarks"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-note-pad>

                    </section>

                </div>

            </div>

            <!-- ================= RIGHT : the workspace ================= -->

            <aside class="ws-panel">

                <div class="ws-hero">

                    <app-workspace-art theme="card"></app-workspace-art>

                    <div class="ws-identity">

                        <b [class.ws-new]="!entity.CardName">{{ entity.CardName || 'New card' }}</b>

                        <div class="ws-chips">

                            @if (entity.CardCode)
                            {
                                <span
                                    class="ws-chip"
                                data-tone="info">{{ entity.CardCode }}</span>
                            }

                        </div>

                    </div>

                    <app-toggle-switch
                        label="Status"
                        onText="Active"
                        offText="Inactive"
                        [(value)]="entity.IsActive"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-toggle-switch>
                    <ul class="ws-uses">
                        <li><i class="fas fa-user-tag"></i><span>Assigned to members in Membership Status</span></li>
                        <li><i class="fas fa-money-bill-wave"></i><span>Fee ledger receives the membership fee</span></li>
                        <li><i class="fas fa-percent"></i><span>Discount ledger carries member discounts</span></li>
                    </ul>

                </div>

            </aside>

        </div>


    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

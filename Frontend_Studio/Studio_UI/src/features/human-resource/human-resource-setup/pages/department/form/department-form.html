<div class="app-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        icon="fas fa-building"
        [title]="pageTitle"
        subtitle="Manage human resource departments.">

        <app-command-center
            pageHeaderRight

            [command1Text]="saveButtonText"
            command1Icon="fas fa-floppy-disk"
            (command1Click)="onSave()"
            [command1Visible]="!isViewMode"

            command2Text="Clear"
            command2Icon="fas fa-broom"
            (command2Click)="onClear()"
            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"
            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab">
        </app-control-tabs>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid
            canvasBody
            [columns]="4">

            <!-- =============================================
                 DEPARTMENT INFORMATION
            ============================================== -->

            <app-form-section
                title="Department Information"
                icon="fas fa-building">

                <app-textbox
                    label="Department Code"
                    [(value)]="department.code"
                    [readonly]="true"
                    [required]="true">
                </app-textbox>

                <app-textbox
                    label="Department Name"
                    [(value)]="department.name"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode"
                    [required]="true">
                </app-textbox>

            </app-form-section>

            <!-- =============================================
                 CONTACT INFORMATION
            ============================================== -->

            <app-form-section
                title="Display Information"
                icon="fas fa-address-book">

                <app-textbox
                    label="Short Name"
                    [(value)]="department.shortName"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">
                </app-textbox>

                <app-textbox
                    label="Department Head"
                    [(value)]="department.departmentHead"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">
                </app-textbox>
                
            </app-form-section>
            <!-- =============================================
                 CONTACT INFORMATION
            ============================================== -->

            <app-form-section
                title="Contact Information"
                icon="fas fa-address-book">

                <app-textbox
                    label="Email"
                    type="email"
                    [(value)]="department.email"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">
                </app-textbox>

                <app-textbox
                    label="Phone"
                    [(value)]="department.phone"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">
                </app-textbox>

            </app-form-section>
            <!-- =============================================
                 STATUS & DESCRIPTION
            ============================================== -->

            <app-form-section
                title="Status & Description"
                icon="fas fa-comment">

                <app-dropdown
                    label="Status"
                    [required]="true"
                    [(value)]="department.isActive"
                    (valueChange)="onStatusChange($event)"
                    [items]="statuses"
                    labelField="text"
                    valueField="value"
                    [disabled]="isViewMode">
                </app-dropdown>

                <app-textarea
                    label="Remarks"
                    [(value)]="department.remarks"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">
                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

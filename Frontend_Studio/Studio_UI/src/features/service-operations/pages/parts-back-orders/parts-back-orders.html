<div class="app-list-page">

    <app-page-header
        title="Parts Back-Orders"
        subtitle="Requested parts the service center has not enough stock for : buy them or move them in"
        icon="fas fa-hourglass-half">

        <div pageHeaderCenter>

            <app-search-box
                [value]="searchText"
                placeholder="Search requisition, job card, customer, part..."
                (valueChange)="onSearch($event)">
            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Refresh"
                command1Icon="fas fa-rotate-right"
                (command1Click)="loadList()"
                [command2Visible]="false"
                [command3Visible]="false">
            </app-command-center>

        </div>

    </app-page-header>

    <app-page-canvas
        [config]="listConfig">

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [actions]="listActions"
                emptyTitle="No back-orders"
                emptySubtitle="Every requested part is in stock in its service center."
                (view)="view($event)">
            </app-list-table>

        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <app-toast></app-toast>

</div>

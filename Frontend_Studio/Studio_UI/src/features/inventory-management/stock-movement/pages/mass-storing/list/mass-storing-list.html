<div class="app-list-page ms-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Mass Storing"
        subtitle="Stock Movement : rack and shelf placement"
        icon="fas fa-boxes-stacked">

        <div pageHeaderCenter>

            <app-search-box
                [value]="searchText"
                placeholder="Search storing no, date, warehouse, branch, type, remarks…"
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                command1Title="Place products on racks and shelves"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                command3Title="Restore the most recently deleted draft"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="History"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR : status tabs | notice · product type
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [selectedTab]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <div
            pageToolbarRight
            class="pt-toolbar-right">

            @if (notice)
            {
                <div
                    class="pt-notice"
                    [class.pt-notice-ok]="notice.tone === 'ok'"
                    [class.pt-notice-error]="notice.tone === 'error'"
                    role="status">
                    <i [class]="notice.tone === 'error' ? 'fas fa-circle-exclamation' : (notice.tone === 'ok' ? 'fas fa-circle-check' : 'fas fa-circle-info')"></i>
                    <span [title]="notice.text">{{ notice.text }}</span>
                    <button
                        type="button"
                        class="pt-notice-x"
                        title="Close"
                        aria-label="Close"
                        (click)="closeNotice()">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
            }

            <div
                class="os-types"
                role="group"
                aria-label="Product type">

                @for (type of types; track type.id)
                {
                    <button
                        type="button"
                        class="os-type"
                        [class.is-on]="selectedType === type.id"
                        [attr.aria-pressed]="selectedType === type.id"
                        (click)="onTypeChange(type.id)">
                        <i [class]="type.icon"></i>
                        {{ type.label }}
                        <b>{{ typeCount(type.id) }}</b>
                    </button>
                }

            </div>

        </div>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="pagedRows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [actions]="{ view:true, edit:true, delete:true }"
                [rowActions]="rowActions"
                (rowAction)="onRowAction($event)"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>


    <!-- =====================================================
         SUMMARY (search and type applied)
    ====================================================== -->

    @if (summaryTotal > 0)
    {
        <div class="ics-summary">

            <span class="ics-summary-item">
                <span class="ics-summary-label">Total</span>
                <b class="ics-summary-value">{{ summaryText(summaryTotal) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Draft</span>
                <b class="ics-summary-value">{{ summaryText(countOf('draft')) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Posted</span>
                <b class="ics-summary-value ics-ok">{{ summaryText(countOf('posted')) }}</b>
            </span>

            <span class="ics-summary-item">
                <span class="ics-summary-label">Cancelled</span>
                <b class="ics-summary-value ics-bad">{{ summaryText(countOf('cancelled')) }}</b>
            </span>

            <span class="ics-summary-note">
                {{ summaryNote }}
            </span>

        </div>
    }


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

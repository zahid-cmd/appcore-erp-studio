<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Check Books"
        subtitle="The check books of our bank accounts : every leaf and where it went"
        icon="fas fa-money-check">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                placeholder="Search code, bank, check no..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [selectedTab]="selectedTab"
            (selectedTabChange)="onTabChange($event)">
        </app-control-tabs>

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Bank Accounts"
            [items]="accountItems"
            labelField="label"
            valueField="value"
            [value]="selectedAccount"
            (valueChange)="onAccountChange($event)">
        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         LOW ON CHECKS (switch "Low Check Leaf Warning")
    ====================================================== -->

    @if (lowAccounts.length > 0)
    {
        <div class="cbl-low">
            <i class="fas fa-triangle-exclamation"></i>
            <span>
                <b>Low on checks :</b>
                {{ lowAccounts.join(' · ') }}. Add the next check book soon.
            </span>
        </div>
    }

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (search and bank account applied, all statuses)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <div class="cbl-summary">

            @for (item of summaryItems; track item.label)
            {
                <span class="cbl-summary-item">
                    <span class="cbl-summary-label">{{ item.label }}</span>
                    <b
                        class="cbl-summary-value"
                        [class.cbl-ok]="item.tone === 'ok'"
                        [class.cbl-bad]="item.tone === 'bad'">{{ item.value }}</b>
                </span>
            }

            <span class="cbl-summary-note">
                Leaves are issued from Payment Voucher and Fund Transfer
            </span>

        </div>
    }

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-credit-card"

        [title]="pageTitle"

        subtitle="Manage card setup">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : CARD INFORMATION
            ================================================== -->

            <app-form-section

                title="Card Information"

                icon="fas fa-credit-card">


                <!-- Card Code -->

                <app-textbox

                    label="Card Code"

                    placeholder="Auto generated"

                    [(value)]="entity.CardCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Card Name -->

                <app-textbox

                    label="Card Name"

                    placeholder="Enter card name"

                    [(value)]="entity.CardName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 02 : ISSUER
            ================================================== -->

            <app-form-section

                title="Issuer"

                icon="fas fa-building-columns">


                <!-- Short Name -->

                <app-textbox

                    label="Short Name"

                    placeholder="Enter short name"

                    [(value)]="entity.ShortName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textbox>


                <!-- Issuing Bank (Any Bank + Bank Setup) -->

                <app-search-dropdown

                    label="Issuing Bank"

                    [items]="issuingBankItems"

                    [(value)]="entity.IssuingBank"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-search-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 03 : STATUS
            ================================================== -->

            <app-form-section

                title="Status"

                icon="fas fa-toggle-on">


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : DESCRIPTION
            ================================================== -->

            <app-form-section

                title="Description"

                icon="fas fa-align-left">


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

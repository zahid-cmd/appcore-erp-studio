<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-book"

        [title]="pageTitle"

        subtitle="Manage general ledgers">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =============================================
                 SECTION 01
                 BASIC INFORMATION
            ============================================== -->

            <app-form-section

                title="Basic Information"

                icon="fas fa-layer-group">



                <!-- Account Class -->

                <app-search-dropdown

                    label="Account Class"

                    [items]="accountClassItems"

                    [(value)]="entity.AccountClassId"

                    (valueChange)="onAccountClassChange()"

                    [disabled]="isEditMode || isViewMode"

                    [required]="true">

                </app-search-dropdown>

                <!-- Mode -->

                <app-textbox

                    label="Mode"

                    placeholder="Derived from Account Class"

                    [(value)]="entity.Mode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 02
                 HIERARCHY INFORMATION
            ============================================== -->

            <app-form-section

                title="Hierarchy Information"

                icon="fas fa-sitemap">



                <!-- Account Group -->

                <app-search-dropdown

                    label="Account Group"

                    [items]="accountGroupItems"

                    [(value)]="entity.AccountGroupId"

                    (valueChange)="onAccountGroupChange()"

                    [disabled]="isEditMode || isViewMode"

                    [required]="true">

                </app-search-dropdown>


                <!-- Account Sub Group -->

                <app-search-dropdown

                    label="Account Sub Group"

                    [items]="accountSubGroupItems"

                    [(value)]="entity.AccountSubGroupId"

                    (valueChange)="onAccountSubGroupChange()"

                    [disabled]="isEditMode || isViewMode"

                    [required]="true">

                </app-search-dropdown>

            </app-form-section>



            <!-- =============================================
                 SECTION 03
                 LEDGER INFORMATION
            ============================================== -->

            <app-form-section

                title="Ledger Information"

                icon="fas fa-tags">



                <!-- Ledger Code -->

                <app-textbox

                    label="Ledger Code"

                    placeholder="Auto generated"

                    [(value)]="entity.LedgerCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Ledger Name -->

                <app-textbox

                    label="Ledger Name"

                    placeholder="Enter ledger name"

                    [(value)]="entity.LedgerName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =============================================
                 SECTION 04
                 STATUS & CONTROL
            ============================================== -->

            <app-form-section

                title="Status & Control"

                icon="fas fa-toggle-on">



                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>


        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
    UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

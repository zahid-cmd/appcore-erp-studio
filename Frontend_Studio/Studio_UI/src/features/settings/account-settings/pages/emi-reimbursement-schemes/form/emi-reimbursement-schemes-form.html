<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-file-invoice-dollar"

        [title]="pageTitle"

        subtitle="Per brand : the supplier's share of the showroom's EMI-sale charges">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : SCHEME & VALIDITY
            ================================================== -->

            <app-form-section

                title="Scheme & Validity"

                icon="fas fa-file-invoice-dollar">


                <!-- Scheme Code (generated by the server) -->

                <app-textbox

                    label="Scheme Code"

                    placeholder="Auto generated"

                    [value]="entity.SchemeCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Brand (by code; locked after saving) -->

                <app-search-dropdown

                    label="Brand"

                    [items]="brandItems"

                    [value]="entity.BrandCode"

                    (valueChange)="onBrandChange($event)"

                    [disabled]="!isAddMode || isSaving"

                    [required]="true">

                </app-search-dropdown>


                <!-- The brand's Motor Bikes Supplier (claims go to it) -->

                <app-textbox

                    label="Motor Bikes Supplier"

                    placeholder="Follows the brand"

                    [value]="supplierText"

                    [readonly]="true">

                </app-textbox>


                <app-datepicker

                    label="Valid From"

                    [required]="true"

                    [value]="$any(validFromDate)"

                    (valueChange)="onValidFrom($event)"

                    [disabled]="isViewMode || isSaving">

                </app-datepicker>


            </app-form-section>



            <!-- =================================================
                 SECTION 02 : SWAP CHARGE SHARING (+ Valid To)
            ================================================== -->

            <app-form-section

                title="Swap Charge Sharing"

                icon="fas fa-credit-card">



                <!-- Swap charge -->

                <app-dropdown

                    label="Swap Charge Basis"

                    [items]="basisItems"

                    [value]="entity.SwapBasis"

                    (valueChange)="onBasisChange('swap', $event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <app-textbox

                    [label]="valueLabel('swap')"

                    placeholder="0"

                    inputMode="decimal"

                    [value]="swapValueText"

                    (valueChange)="onText('swapValueText', $event)"

                    [disabled]="isViewMode || isSaving">

                </app-textbox>


                <app-textbox

                    label="Swap Cap (Tk per sale)"

                    placeholder="No limit"

                    inputMode="decimal"

                    [value]="swapCapText"

                    (valueChange)="onText('swapCapText', $event)"

                    [disabled]="isViewMode || isSaving">

                </app-textbox>


                <!-- Empty = open ended -->

                <app-datepicker

                    label="Valid To"

                    [value]="$any(validToDate)"

                    [minDate]="$any(validFromDate)"

                    (valueChange)="onValidTo($event)"

                    [disabled]="isViewMode || isSaving">

                </app-datepicker>

                @if (validToDate && !isViewMode)
                {
                    <!-- The date picker cannot be emptied : this makes
                         the scheme open ended again -->
                    <button
                        type="button"
                        class="ers-open-ended"
                        [disabled]="isSaving"
                        (click)="onValidTo(null)">

                        <i class="fas fa-xmark"></i>

                        Clear Valid To (open ended)

                    </button>
                }
                
            </app-form-section>



            <!-- =================================================
                 SECTION 03 : EMI CHARGE SHARING (+ Total Cap)
                 Percent = % of the showroom's share of that
                 charge; Fixed = Tk per sale. Caps : empty = no
                 limit.
            ================================================== -->

            <app-form-section

                title="EMI Charge Sharing"

                icon="fas fa-hand-holding-dollar">


                <!-- EMI charge -->

                <app-dropdown

                    label="EMI Charge Basis"

                    [items]="basisItems"

                    [value]="entity.EmiBasis"

                    (valueChange)="onBasisChange('emi', $event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <app-textbox

                    [label]="valueLabel('emi')"

                    placeholder="0"

                    inputMode="decimal"

                    [value]="emiValueText"

                    (valueChange)="onText('emiValueText', $event)"

                    [disabled]="isViewMode || isSaving">

                </app-textbox>


                <app-textbox

                    label="EMI Cap (Tk per sale)"

                    placeholder="No limit"

                    inputMode="decimal"

                    [value]="emiCapText"

                    (valueChange)="onText('emiCapText', $event)"

                    [disabled]="isViewMode || isSaving">

                </app-textbox>


                <!-- Swap + EMI claim together : Swap Cap + EMI Cap
                     (read only, live; no limit when both are empty) -->

                <app-textbox

                    label="Total Cap (Tk per sale)"

                    placeholder="No limit (both caps empty)"

                    [value]="totalCapText"

                    [readonly]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : TENURE & STATUS
            ================================================== -->

            <app-form-section

                title="Tenure & Status"

                icon="fas fa-sliders">


                <app-dropdown

                    label="Tenure"

                    [items]="tenureItems"

                    [value]="entity.TenureMonths"

                    (valueChange)="onTenureChange($event)"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>


<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

<!-- PAGE-CLONED : Cash Accounts -> Bank Accounts -->
<!-- PAGE-CLONED : Wings -> Bank Accounts -->
<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-layer-group"

        [title]="pageTitle"

        subtitle="Manage bankAccounts">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">

            <!-- =============================================
                 SECTION 01
                 ACCOUNT SUB GROUP
            ============================================== -->

            <app-form-section

                title="Account Sub Group"

                icon="fas fa-sitemap">


                <!-- Account Sub Groups Id -->

                <app-search-dropdown

                    label="Account Sub Group"

                    [items]="accountSubGroupItems"

                    [(value)]="entity.AccountSubGroupsId"

                    (valueChange)="onAccountSubGroupChange($event)"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-search-dropdown>

            </app-form-section>


            <!-- =============================================
                 SECTION 02
                 BANK ACCOUNTS INFORMATION
            ============================================== -->

            <app-form-section

                title="Bank Accounts Information"

                icon="fas fa-layer-group">


                <!-- Bank Account Code -->

                <app-textbox

                    label="Bank Account Code"

                    placeholder="Auto generated"

                    [(value)]="entity.BankAccountCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Bank Account Name -->

                <app-textbox

                    label="Bank Account Name"

                    placeholder="Enter bank account name"

                    [(value)]="entity.BankAccountName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =============================================
                 SECTION 03
                 STATUS
            ============================================== -->

            <app-form-section

                title="Status"

                icon="fas fa-toggle-on">


                <!-- Is Active -->

                <app-dropdown

                    label="Is Active"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>

            </app-form-section>


            <!-- =============================================
                 SECTION 04
                 DESCRIPTION
            ============================================== -->

            <app-form-section

                title="Description"

                icon="fas fa-align-left">


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

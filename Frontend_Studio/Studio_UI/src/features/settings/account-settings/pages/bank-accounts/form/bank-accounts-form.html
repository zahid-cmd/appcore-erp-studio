<!-- PAGE-CLONED : Cash Accounts -> Bank Accounts -->
<!-- PAGE-CLONED : Wings -> Bank Accounts -->
<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-layer-group"

        [title]="pageTitle"

        subtitle="Manage bank accounts">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">

            <!-- =====================================================
                SECTION 01
                PARENT INFORMATION
            ====================================================== -->

            <app-form-section

                title="Parent Information"

                icon="fas fa-sitemap">


                <!-- Branch -->

                <app-search-dropdown

                    label="Branch"

                    [items]="branchItems"

                    [(value)]="entity.Branch"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-search-dropdown>


                <!-- Account Sub Group (Reserved : SUB-003-002-002) -->

                <app-search-dropdown

                    label="Account Sub Group"

                    [items]="accountSubGroupItems"

                    [(value)]="entity.AccountSubGroupsId"

                    [disabled]="true"

                    [required]="true">

                </app-search-dropdown>


                <!-- Bank Account Name (Auto Uppercase) -->

                <app-textbox

                    label="Bank Account Name"

                    placeholder="ENTER BANK ACCOUNT NAME"

                    [(value)]="entity.BankAccountName"

                    (valueChange)="onBankAccountNameChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


                <!-- Full Account Number -->

                <app-textbox

                    label="Full Account Number"

                    placeholder="Enter full account number"

                    [(value)]="entity.FullAccountNumber"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


                <!-- Bank Branch Name -->

                <app-textbox

                    label="Bank Branch Name"

                    placeholder="Enter bank branch name"

                    [(value)]="entity.BankBranchName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =====================================================
                SECTION 02
                BANK ACCOUNTS INFORMATION
            ====================================================== -->

            <app-form-section

                title="Bank Accounts Information"

                icon="fas fa-layer-group">


                <!-- Bank Account Code -->

                <app-textbox

                    label="Bank Account Code"

                    placeholder="Auto generated"

                    [(value)]="entity.BankAccountCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Bank -->

                <app-search-dropdown

                    label="Bank"

                    [items]="bankItems"

                    [(value)]="entity.Bank"

                    (valueChange)="onDisplayNamePartChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-search-dropdown>


                <!-- Short Account Name (Auto Uppercase) -->

                <app-textbox

                    label="Short Account Name"

                    placeholder="ENTER SHORT ACCOUNT NAME"

                    [(value)]="entity.ShortAccountName"

                    (valueChange)="onDisplayNamePartChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


                <!-- Short Account Number -->

                <app-textbox

                    label="Short Account Number"

                    placeholder="Enter short account number"

                    [(value)]="entity.ShortAccountNumber"

                    (valueChange)="onDisplayNamePartChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


                <!-- Short Branch Name (Auto Uppercase) -->

                <app-textbox

                    label="Short Branch Name"

                    placeholder="ENTER SHORT BRANCH NAME"

                    [(value)]="entity.ShortBranchName"

                    (valueChange)="onDisplayNamePartChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =====================================================
                SECTION 03
                DISPLAY & CONFIGURATION
            ====================================================== -->

            <app-form-section

                title="Display & Configuration"

                icon="fas fa-toggle-on">


                <!-- Display Name (Auto, Uppercase) -->

                <app-textbox

                    label="Display Name"

                    placeholder="Auto generated"

                    [(value)]="entity.DisplayName"

                    [readonly]="true">

                </app-textbox>


                <!-- Swift Code -->

                <app-textbox

                    label="Swift Code"

                    placeholder="Enter swift code"

                    [(value)]="entity.SwiftCode"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


                <!-- Routing Number -->

                <app-textbox

                    label="Routing Number"

                    placeholder="Enter routing number"

                    [(value)]="entity.RoutingNumber"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


                <!-- Branch Exclusive -->

                <app-dropdown

                    label="Branch Exclusive"

                    [items]="yesNoItems"

                    [(value)]="entity.BranchExclusive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>

            </app-form-section>


            <!-- =====================================================
                SECTION 04
                STATUS & DESCRIPTION
            ====================================================== -->

            <app-form-section

                title="Status & Description"

                icon="fas fa-align-left">


                <!-- Collection Account -->

                <app-dropdown

                    label="Collection Account"

                    [items]="yesNoItems"

                    [(value)]="entity.CollectionAccount"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Payment Account -->

                <app-dropdown

                    label="Payment Account"

                    [items]="yesNoItems"

                    [(value)]="entity.PaymentAccount"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

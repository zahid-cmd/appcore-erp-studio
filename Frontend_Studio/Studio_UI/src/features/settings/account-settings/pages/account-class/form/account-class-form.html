<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-layer-group"

        [title]="pageTitle"

        subtitle="Manage account classes">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =============================================
                 SECTION 01
                 BASIC INFORMATION
            ============================================== -->

            <app-form-section

                title="Basic Information"

                icon="fas fa-layer-group">



            <!-- Class Type -->

            <app-dropdown

                label="Class Type"

                [items]="classTypeItems"

                [(value)]="entity.ClassType"

                (valueChange)="onClassTypeChange()"

                [disabled]="isEditMode || isViewMode"

                [required]="true">

            </app-dropdown>



                <!-- Class Code -->

                <app-textbox

                    label="Class Code"

                    placeholder="Auto generated"

                    [(value)]="entity.ClassCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- Class Prefix -->

                <app-textbox

                    label="Class Prefix"

                    placeholder="Auto generated"

                    [(value)]="entity.ClassPrefix"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 02
                 CLASS INFORMATION
            ============================================== -->

            <app-form-section

                title="Class Information"

                icon="fas fa-tags">



                <!-- Class Name -->

                <app-textbox

                    label="Class Name"

                    placeholder="Enter class name"

                    [(value)]="entity.ClassName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>



                <!-- Mode -->

                <app-dropdown

                    label="Mode"

                    [items]="modeItems"

                    [(value)]="entity.Mode"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


            </app-form-section>



            <!-- =============================================
                 SECTION 03
                 STATUS & CONTROL
            ============================================== -->

            <app-form-section

                title="Status & Control"

                icon="fas fa-toggle-on">



                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>



                <!-- Allow Manual Group Creation -->

                <app-dropdown

                    label="Allow Manual Group Creation"

                    [items]="manualGroupCreationItems"

                    [(value)]="entity.AllowManualGroupCreation"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


            </app-form-section>



            <!-- =============================================
                 SECTION 04
                 CONFIGURATION
            ============================================== -->

            <app-form-section

                title="Description"

                icon="fas fa-sliders">



                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>



            </app-form-section>



        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

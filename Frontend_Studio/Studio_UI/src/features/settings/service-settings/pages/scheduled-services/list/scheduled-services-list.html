<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Scheduled Services"
        subtitle="Price the services generated by each Service Policy"
        icon="fas fa-calendar-check">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search scheduled services..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Configure"
                command1Icon="fas fa-sliders"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                [command3Visible]="false"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <!-- =================================================
             BRAND FILTER (brands with a Service Policy)
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Brands"
            [items]="brandFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedBrandId"
            (valueChange)="onBrandFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Status"
            [items]="statusFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedStatus"
            (valueChange)="onStatusFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="pagedScheduledServices"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [actions]="tableActions"
                (view)="view($event)"
                (edit)="edit($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="filteredScheduledServices.length"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>


</div>

<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-calendar-check"

        [title]="pageTitle"

        subtitle="Price the services generated by each Service Policy">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =============================================
                 SECTION 01
                 BASIC INFORMATION
            ============================================== -->

            <app-form-section

                title="Basic Information"

                icon="fas fa-calendar-check">


                <!-- Service Name : generated by the Service Policy.
                     Configure : Pending services only; locked afterwards -->

                <app-search-dropdown

                    label="Service Name"

                    [items]="serviceItems"

                    [value]="selectedServiceId"

                    (valueChange)="onServiceChange($event)"

                    [disabled]="isViewMode || isSaving || isServiceLocked"

                    [required]="true">

                </app-search-dropdown>


                <app-textbox

                    label="Brand"

                    placeholder="Follows the service name"

                    [value]="brandDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Service Policy"

                    placeholder="Follows the service name"

                    [value]="policyDisplay"

                    [readonly]="true">

                </app-textbox>


                <!-- The brand's Scheduled Services sub category -->

                <app-textbox

                    label="Service Sub Category"

                    placeholder="Follows the service name"

                    [value]="subCategoryDisplay"

                    [readonly]="true">

                </app-textbox>


                <!-- Service Code : <Sub Category Code>-nnnnn (assigned on the first save) -->

                <app-textbox

                    label="Service Code"

                    placeholder="Auto generated"

                    [value]="serviceCodeDisplay"

                    [readonly]="true">

                </app-textbox>

            </app-form-section>



            <!-- =============================================
                 SECTION 02
                 SERVICE PARAMETERS
                 Read only : from the Service Policy
            ============================================== -->

            <app-form-section

                title="Service Parameters"

                icon="fas fa-gauge">


                <app-textbox

                    label="Position"

                    placeholder="From the service policy"

                    [value]="positionDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Service Type"

                    placeholder="From the service policy"

                    [value]="serviceTypeDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Due After (Days)"

                    placeholder="From the service policy"

                    [value]="dueDaysDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Due After (Km)"

                    placeholder="From the service policy"

                    [value]="dueKmDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Grace Days"

                    placeholder="From the service policy"

                    [value]="graceDaysDisplay"

                    [readonly]="true">

                </app-textbox>

            </app-form-section>



            <!-- =============================================
                 SECTION 03
                 CHARGES & INCOME LEDGER
            ============================================== -->

            <app-form-section

                title="Charges & Income Ledger"

                icon="fas fa-sack-dollar">


                <!-- Paid services : charged to the customer -->

                <app-textbox

                    label="Customer Charge"

                    [placeholder]="isPaid ? 'Enter amount (e.g. 1200.00)' : 'Not for free services'"

                    [value]="customerChargeText"

                    (valueChange)="onCustomerChargeChange($event)"

                    [disabled]="isViewMode || isSaving || !isPaid"

                    [required]="isPaid">

                </app-textbox>


                <!-- Free services : claimed from the brand -->

                <app-textbox

                    label="Brand Reimbursement"

                    [placeholder]="isFree ? 'Enter amount (e.g. 450.00)' : 'Not for paid services'"

                    [value]="brandReimbursementText"

                    (valueChange)="onBrandReimbursementChange($event)"

                    [disabled]="isViewMode || isSaving || !isFree"

                    [required]="isFree">

                </app-textbox>


                <!-- Income Ledger : GLR-ccc-ggg-sss-nnnnn (created on the first save) -->

                <app-textbox

                    label="Income Ledger Code"

                    placeholder="Auto generated"

                    [value]="ledgerCodeDisplay"

                    [readonly]="true">

                </app-textbox>


                <app-textbox

                    label="Income Ledger Name"

                    placeholder="Follows the service name"

                    [value]="ledgerNameDisplay"

                    [readonly]="true">

                </app-textbox>

            </app-form-section>



            <!-- =============================================
                 SECTION 04
                 STATUS & CONTROL
            ============================================== -->

            <app-form-section

                title="Status & Control"

                icon="fas fa-toggle-on">


                <!-- Pending / Ready / Not in Policy -->

                <app-textbox

                    label="Invoice Readiness"

                    placeholder="Follows the service name"

                    [value]="readinessDisplay"

                    [readonly]="true">

                </app-textbox>


                <!-- Status (Not in Policy : stays inactive) -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving || isStatusLocked"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>


        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

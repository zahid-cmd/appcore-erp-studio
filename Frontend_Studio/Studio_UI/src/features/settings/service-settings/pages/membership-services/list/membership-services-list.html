<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Membership Services"
        subtitle="Set the value of each card's complimentary service"
        icon="fas fa-id-card">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search membership services..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <!-- Configure-only : rows come from Membership Cards
                 (no Add / Restore) -->

            <app-command-center
                [command1Visible]="false"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                [command3Visible]="false"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <!-- =================================================
             MEMBERSHIP CARD FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Membership Cards"
            [items]="cardFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedCardId"
            (valueChange)="onCardFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             READINESS FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Readiness"
            [items]="readinessFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedReadiness"
            (valueChange)="onReadinessFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Status"
            [items]="statusFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedStatus"
            (valueChange)="onStatusFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                [rows]="pagedMembershipServices"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [actions]="tableActions"
                (view)="view($event)"
                (edit)="edit($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="filteredMembershipServices.length"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

</div>

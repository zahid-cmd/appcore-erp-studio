<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="PDI Templates"
        subtitle="Pre-Delivery Inspection sheet of each bike model (Bike Deliveries)"
        icon="fas fa-clipboard-check">

        <div pageHeaderCenter>
            <app-search-box
                [value]="searchText"
                placeholder="Search templates, models..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                command1Permission="add"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                command3Permission="restore"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                rightCommandTitle="Activity history"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <span
            pageToolbarLeft
            class="pdt-count">
            <i class="fas fa-clipboard-check"></i>
            {{ totalRecords }} template{{ totalRecords === 1 ? '' : 's' }}
        </span>

        <app-dropdown
            pageToolbarRight
            [items]="statusItems"
            [value]="selectedStatus"
            (valueChange)="onStatusChange($event)">
        </app-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="rows"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                [rowActions]="rowActions"
                (rowAction)="onRowAction($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>

    <app-toast></app-toast>
    <app-confirm-dialog></app-confirm-dialog>
    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        title="Wing"

        subtitle="Fixed groups of branches : Sales Center, Service Center, Accessory Shop"

        icon="fas fa-layer-group"

        art="wings">

        <div pageHeaderCenter>

            <app-search-box

                [(value)]="searchText"

                placeholder="Search wings..."

                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>


        <div pageHeaderRight>

            <app-command-center

                command1Text="Refresh"

                command1Icon="fas fa-rotate-right"

                (command1Click)="refresh()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="canvasConfig">


        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table

                [columns]="columns"

                [rows]="pagedWings"

                [serialOffset]="(currentPage - 1) * pageSize"

                [loading]="loading"

                [error]="loadFailed"

                emptyArt="wings"

                emptyTitle="No wing yet"

                emptySubtitle="Every company gets its three wings when it is made : Sales Center, Service Center, Accessory Shop."

                [actions]="{ view: true, edit: false, delete: false }"

                (view)="view($event)"

                (edit)="edit($event)"

                (delete)="delete($event)"

                (sortChange)="onSort($event)">

            </app-list-table>

        </div>



        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination

            canvasFooter

            [totalRecords]="totalRecords"

            [currentPage]="currentPage"

            [pageSize]="pageSize"

            (pageChange)="onPageChange($event)"

            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (all records)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <app-summary-line
            [items]="summaryItems"
            noun="wings"
            art="wings"
            note="All records">
        </app-summary-line>
    }



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer

        [opened]="historyOpened"

        [title]="historyTitle"

        [items]="historyItems"

        (closed)="closeHistory()">

    </app-history-drawer>



    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        icon="fas fa-layer-group"
        art="wings"
        [title]="pageTitle"
        subtitle="A group of branches under the company, e.g. Sales, Service, Accessories">

        <app-command-center
            pageHeaderRight
            [command1Text]="saveButtonText"
            command1Icon="fas fa-floppy-disk"
            (command1Click)="onSave()"
            [command1Visible]="!isViewMode"
            command2Text="Clear"
            command2Icon="fas fa-broom"
            (command2Click)="onClear()"
            [command2Visible]="!isViewMode"
            [command3Visible]="false"
            rightCommandIcon="fas fa-arrow-left"
            rightCommandTitle="Back to the list"
            (rightCommandClick)="onBackToList()">
        </app-command-center>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR : one screen, one light step
    ====================================================== -->

    <app-page-toolbar>

        <app-step-tabs
            pageToolbarLeft
            [steps]="tabs"
            [current]="selectedTab"
            (currentChange)="onTabChange($event)">
        </app-step-tabs>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS : the fields left, the workspace right
         (2026-11-16 workspace layout)
    ====================================================== -->

    <app-page-canvas
        [config]="formConfig">

        <div
            canvasBody
            class="ws-body appcore-scrollbar">

            <!-- ================= LEFT : the fields ================= -->

            <div class="ws-steps">

                <div class="ws-step">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-layer-group"></i>
                            <span>Wing</span>
                            <small>The company is fixed once saved</small>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-textbox
                                label="Wing Code"
                                placeholder="Auto generated"
                                [(value)]="entity.WingCode"
                                [readonly]="true"
                                [required]="true">
                            </app-textbox>

                            <app-textbox
                                class="ws-span-2"
                                label="Wing Name"
                                placeholder="e.g. Sales"
                                [(value)]="entity.WingName"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-textbox>

                            <app-dropdown
                                class="ws-full"
                                label="Company"
                                [items]="companyItems"
                                [(value)]="entity.CompanyId"
                                (valueChange)="onCompanyChange($event)"
                                [disabled]="isEditMode || isViewMode"
                                [required]="true">
                            </app-dropdown>

                        </div>

                    </section>

                    <section class="ws-card ws-notes">

                        <header class="ws-card-head">
                            <i class="fas fa-note-sticky"></i>
                            <span>Remarks</span>
                        </header>

                        <app-note-pad
                            placeholder="Anything the team should know"
                            note="Only for your team, never printed"
                            [maxLength]="500"
                            [(value)]="entity.Remarks"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode">
                        </app-note-pad>

                    </section>

                </div>

            </div>

            <!-- ================= RIGHT : the workspace ================= -->

            <aside class="ws-panel">

                <div class="ws-hero">

                    <app-workspace-art theme="wings"></app-workspace-art>

                    <div class="ws-identity">

                        <b [class.ws-new]="!entity.WingName">{{ entity.WingName || 'New wing' }}</b>

                        <div class="ws-chips">

                            @if (entity.WingCode)
                            {
                                <span
                                    class="ws-chip"
                                data-tone="info">{{ entity.WingCode }}</span>
                            }

                        </div>

                    </div>

                    <app-toggle-switch
                        label="Status"
                        onText="Active"
                        offText="Inactive"
                        [(value)]="entity.IsActive"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode">
                    </app-toggle-switch>

                    <ul class="ws-uses">
                        <li><i class="fas fa-code-branch"></i><span>Every branch belongs to one wing</span></li>
                        <li><i class="fas fa-chart-column"></i><span>Reports can be grouped and totalled by wing</span></li>
                    </ul>

                </div>

            </aside>

        </div>

    </app-page-canvas>

</div>

<!-- =====================================================
     UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

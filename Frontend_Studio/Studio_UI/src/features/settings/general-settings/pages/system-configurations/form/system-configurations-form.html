<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-sliders"

        [title]="pageTitle"

        subtitle="Define a switch : where it belongs, what ON and OFF do, its value and rules">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [selectedTab]="entity.ValueType"

            (selectedTabChange)="onValueTabChange($event)">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : WHERE IT BELONGS
            ================================================== -->

            <app-form-section

                title="Module & Page"

                icon="fas fa-sitemap">


                <!-- Module (locked after creation) -->

                <app-search-dropdown

                    label="Module"

                    [items]="moduleItems"

                    [(value)]="entity.NavigationModuleId"

                    (valueChange)="onModuleChange()"

                    [disabled]="!isAddMode || isSaving"

                    [required]="true">

                </app-search-dropdown>


                <!-- Configuration Code (auto generated) -->

                <app-textbox

                    label="Configuration Code"

                    placeholder="Select a module first"

                    [(value)]="entity.ConfigurationCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Scope : who may change it -->

                <app-dropdown

                    label="Who Can Change It"

                    [items]="scopeItems"

                    [(value)]="entity.ScopeType"

                    (valueChange)="onScopeChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>


                @if (isMenuScope)
                {
                    <!-- Menu (by code) -->

                    <app-search-dropdown

                        label="Menu"

                        placeholder="Choose the menu"

                        [items]="menuItems"

                        [(value)]="entity.NavigationMenuCode"

                        (valueChange)="onValueChange()"

                        [disabled]="isViewMode || isSaving"

                        [required]="true">

                    </app-search-dropdown>
                }


                @if (isSubmenuScope)
                {
                    <!-- Page (submenu, by code) -->

                    <app-search-dropdown

                        label="Page (Submenu)"

                        placeholder="Choose the page"

                        [items]="submenuItems"

                        [(value)]="entity.NavigationSubmenuCode"

                        (valueChange)="onValueChange()"

                        [disabled]="isViewMode || isSaving"

                        [required]="true">

                    </app-search-dropdown>
                }


                @if (entity.ValueType !== 'None')
                {
                    <!-- Order on the page (number / text switches) -->

                    <app-textbox
                        label="Display Order"
                        type="number"
                        inputMode="numeric"
                        [(value)]="displayOrderText"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>
                }

            </app-form-section>



            @if (entity.ValueType === 'None')
            {
                <!-- =============================================
                     SECTION 02 : CONFIGURATION INFORMATION
                ============================================== -->

                <app-form-section
                    title="Configuration Information"
                    icon="fas fa-sliders">

                    <app-textbox
                        label="Configuration Name"
                        placeholder="e.g. Max Lines"
                        textCase="none"
                        [maxLength]="200"
                        [(value)]="entity.ConfigurationName"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-textbox>

                    <app-textbox
                        label="Display Order"
                        type="number"
                        inputMode="numeric"
                        [(value)]="displayOrderText"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                    <app-textarea
                        label="Remarks"
                        placeholder="Internal note"
                        [rows]="4"
                        [maxLength]="1000"
                        [(value)]="entity.Remarks"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                </app-form-section>


                <!-- =============================================
                     SECTION 03 : WHEN ON / OFF
                ============================================== -->

                <app-form-section
                    title="When ON / OFF"
                    icon="fas fa-toggle-on">

                    <app-textarea
                        label="When ON"
                        placeholder="What happens when it is ON"
                        [rows]="5"
                        [maxLength]="300"
                        [(value)]="entity.OnDescription"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                    <app-textarea
                        label="When OFF"
                        placeholder="What happens when it is OFF"
                        [rows]="5"
                        [maxLength]="300"
                        [(value)]="entity.OffDescription"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                </app-form-section>


                <!-- =============================================
                     SECTION 04 : STATUS & RULES
                ============================================== -->

                <app-form-section
                    title="Status & Rules"
                    icon="fas fa-shield-halved">

                    <app-dropdown
                        label="Setting Status"
                        [items]="enabledItems"
                        [(value)]="entity.IsEnabled"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-dropdown>

                    <app-dropdown
                        label="Default Status"
                        [items]="enabledItems"
                        [(value)]="entity.DefaultEnabled"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-dropdown>

                    <app-dropdown
                        label="Critical (reason + approval)"
                        [items]="yesNoItems"
                        [(value)]="entity.IsCritical"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-dropdown>

                    <app-search-dropdown
                        label="Works Only When ON"
                        placeholder="No parent"
                        [items]="parentItems"
                        [(value)]="entity.ParentConfigurationCode"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-search-dropdown>

                    @if (needsReason)
                    {
                        <app-textarea
                            label="Reason For This Change"
                            placeholder="Why is this critical switch changing?"
                            [rows]="2"
                            [maxLength]="500"
                            [(value)]="reason"
                            [disabled]="isSaving"
                            [required]="true">
                        </app-textarea>
                    }

                </app-form-section>

            }
            @else
            {
                <!-- =============================================
                     SECTION 02 : CONFIGURATION INFORMATION
                ============================================== -->

                <app-form-section
                    title="Configuration Information"
                    icon="fas fa-sliders">

                    <app-textbox
                        label="Configuration Name"
                        placeholder="e.g. Max Lines"
                        textCase="none"
                        [maxLength]="200"
                        [(value)]="entity.ConfigurationName"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-textbox>

                    <app-textarea
                        label="When ON"
                        placeholder="What happens when it is ON"
                        [rows]="2"
                        [maxLength]="300"
                        [(value)]="entity.OnDescription"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                    <app-textarea
                        label="When OFF"
                        placeholder="What happens when it is OFF"
                        [rows]="2"
                        [maxLength]="300"
                        [(value)]="entity.OffDescription"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                </app-form-section>


                @if (entity.ValueType === 'Number')
                {
                <!-- =============================================
                     SECTION 03 : WHOLE NUMBER
                ============================================== -->

                <app-form-section
                    title="Whole Number"
                    icon="fas fa-hashtag">

                    <app-textbox
                        label="Unit"
                        placeholder="e.g. days, lines"
                        textCase="none"
                        [maxLength]="30"
                        [(value)]="entity.ValueUnit"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                    <div class="sc-pair">
                        <app-textbox
                            label="Lowest Number"
                            type="number"
                            inputMode="numeric"
                            placeholder="No minimum"
                            [(value)]="valueMinText"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-textbox>

                        <app-textbox
                            label="Highest Number"
                            type="number"
                            inputMode="numeric"
                            placeholder="No maximum"
                            [(value)]="valueMaxText"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-textbox>
                    </div>

                    <app-textbox
                        label="When Empty, Show"
                        placeholder="e.g. No limit (blank: a number is required)"
                        textCase="none"
                        [maxLength]="40"
                        [(value)]="entity.ValueEmptyText"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                    <div class="sc-pair">
                        <app-textbox
                            label="Default Value"
                            textCase="none"
                            [maxLength]="100"
                            [(value)]="entity.DefaultValue"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-textbox>

                        <app-textbox
                            label="Current Value"
                            textCase="none"
                            [maxLength]="100"
                            [(value)]="entity.Value"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving">
                        </app-textbox>
                    </div>

                </app-form-section>

                }
                @else
                {
                <!-- =============================================
                     SECTION 03 : SHORT TEXT
                ============================================== -->

                <app-form-section
                    title="Short Text"
                    icon="fas fa-font">

                    <app-textbox
                        label="Unit"
                        placeholder="e.g. days, lines"
                        textCase="none"
                        [maxLength]="30"
                        [(value)]="entity.ValueUnit"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                    <app-textbox
                        label="Default Value"
                        textCase="none"
                        [maxLength]="100"
                        [(value)]="entity.DefaultValue"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                    <app-textbox
                        label="Current Value"
                        textCase="none"
                        [maxLength]="100"
                        [(value)]="entity.Value"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textbox>

                </app-form-section>

                }

                <!-- =============================================
                     SECTION 04 : STATUS & RULES
                ============================================== -->

                <app-form-section
                    title="Status & Rules"
                    icon="fas fa-shield-halved">

                    <div class="sc-pair">
                        <app-dropdown
                            label="Setting Status"
                            [items]="enabledItems"
                            [(value)]="entity.IsEnabled"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving"
                            [required]="true">
                        </app-dropdown>

                        <app-dropdown
                            label="Default Status"
                            [items]="enabledItems"
                            [(value)]="entity.DefaultEnabled"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode || isSaving"
                            [required]="true">
                        </app-dropdown>
                    </div>

                    <app-dropdown
                        label="Critical (reason + approval)"
                        [items]="yesNoItems"
                        [(value)]="entity.IsCritical"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving"
                        [required]="true">
                    </app-dropdown>

                    <app-search-dropdown
                        label="Works Only When ON"
                        placeholder="No parent"
                        [items]="parentItems"
                        [(value)]="entity.ParentConfigurationCode"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-search-dropdown>

                    <app-textarea
                        label="Remarks"
                        placeholder="Internal note"
                        [rows]="2"
                        [maxLength]="1000"
                        [(value)]="entity.Remarks"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode || isSaving">
                    </app-textarea>

                    @if (needsReason)
                    {
                        <app-textarea
                            label="Reason For This Change"
                            placeholder="Why is this critical switch changing?"
                            [rows]="2"
                            [maxLength]="500"
                            [(value)]="reason"
                            [disabled]="isSaving"
                            [required]="true">
                        </app-textarea>
                    }

                </app-form-section>

            }

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

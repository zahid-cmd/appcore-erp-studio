<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-sliders"

        [title]="pageTitle"

        subtitle="Turn module features on or off">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =================================================
                 SECTION 01 : PARENT INFORMATION
            ================================================== -->

            <app-form-section

                title="Parent Information"

                icon="fas fa-sitemap">


                <!-- Module (locked after creation) -->

                <app-search-dropdown

                    label="Module"

                    [items]="moduleItems"

                    [(value)]="entity.NavigationModuleId"

                    (valueChange)="onModuleChange()"

                    [disabled]="!isAddMode || isSaving"

                    [required]="true">

                </app-search-dropdown>


                <!-- Configuration Code (auto generated) -->

                <app-textbox

                    label="Configuration Code"

                    placeholder="Select a module first"

                    [(value)]="entity.ConfigurationCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 02 : CONFIGURATION INFORMATION
            ================================================== -->

            <app-form-section

                title="Configuration Information"

                icon="fas fa-sliders">


                <!-- Configuration Name -->

                <app-textbox

                    label="Configuration Name"

                    placeholder="e.g. Allow negative stock"

                    [(value)]="entity.ConfigurationName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-textbox>

            </app-form-section>



            <!-- =================================================
                 SECTION 03 : CONFIGURATION
            ================================================== -->

            <app-form-section

                title="Configuration"

                icon="fas fa-toggle-on">


                <!-- Setting Status (Enabled / Disabled) -->

                <app-dropdown

                    label="Setting Status"

                    [items]="enabledItems"

                    [(value)]="entity.IsEnabled"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving"

                    [required]="true">

                </app-dropdown>

            </app-form-section>



            <!-- =================================================
                 SECTION 04 : STATUS & DESCRIPTION
            ================================================== -->

            <app-form-section

                title="Status & Description"

                icon="fas fa-align-left">


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="What does this setting control?"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isSaving">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

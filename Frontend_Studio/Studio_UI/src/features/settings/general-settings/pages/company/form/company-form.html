<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-building"

        [title]="pageTitle"

        subtitle="Manage companies">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =============================================
                 SECTION 01
                 BASIC INFORMATION
            ============================================== -->

            <app-form-section

                title="Basic Information"

                icon="fas fa-building">



                <!-- Company Code -->

                <app-textbox

                    label="Company Code"

                    placeholder="Auto generated"

                    [(value)]="entity.CompanyCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- Company Name -->

                <app-textbox

                    label="Company Name"

                    placeholder="Enter company name"

                    [(value)]="entity.CompanyName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>



                <!-- Short Name -->

                <app-textbox

                    label="Short Name"

                    placeholder="Enter short name"

                    [(value)]="entity.CompanyShortName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Website -->

                <app-textbox

                    label="Website"

                    placeholder="Enter website"

                    [(value)]="entity.Website"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Email -->

                <app-textbox

                    label="Email"

                    placeholder="Enter email address"

                    [(value)]="entity.Email"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 02
                 ADDRESS & CONTACT
            ============================================== -->

            <app-form-section

                title="Address & Contact"

                icon="fas fa-address-card">



                <!-- Address Line 1 -->

                <app-textbox

                    label="Address Line 1"

                    placeholder="Enter address line 1"

                    [(value)]="entity.AddressLine1"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Address Line 2 -->

                <app-textbox

                    label="Address Line 2"

                    placeholder="Enter address line 2"

                    [(value)]="entity.AddressLine2"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Phone -->

                <app-textbox

                    label="Phone"

                    placeholder="Enter phone number"

                    [(value)]="entity.Phone"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Mobile -->

                <app-textbox

                    label="Mobile"

                    placeholder="Enter mobile number"

                    [(value)]="entity.Mobile"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Economic Activity -->

                <app-textbox

                    label="Economic Activity"

                    placeholder="Enter economic activity"

                    [(value)]="entity.EconomicActivity"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 03
                 BUSINESS INFORMATION
            ============================================== -->

            <app-form-section

                title="Business Information"

                icon="fas fa-briefcase">



                <!-- BIN No. -->

                <app-textbox

                    label="BIN No."

                    placeholder="Enter BIN number"

                    [(value)]="entity.BINNo"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Ownership Type -->

                <app-textbox

                    label="Ownership Type"

                    placeholder="Enter ownership type"

                    [(value)]="entity.OwnershipType"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- TIN No. -->

                <app-textbox

                    label="TIN No."

                    placeholder="Enter TIN number"

                    [(value)]="entity.TINNo"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Trade License No. -->

                <app-textbox

                    label="Trade License No."

                    placeholder="Enter trade license number"

                    [(value)]="entity.TradeLicenseNo"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


            </app-form-section>



            <!-- =============================================
                 SECTION 04
                 CONFIGURATION
            ============================================== -->

            <app-form-section

                title="Configuration"

                icon="fas fa-sliders">



                <!-- =========================================
                     Company Logo
                ========================================== -->

                <app-image-hub

                    [imageUrl]="companyLogoPreviewUrl"

                    placeholder="No Company Logo"

                    [disabled]="isViewMode"

                    [readonly]="isViewMode"

                    (imageChange)="onCompanyLogoChange($event)">

                </app-image-hub>



                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>


            </app-form-section>



        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

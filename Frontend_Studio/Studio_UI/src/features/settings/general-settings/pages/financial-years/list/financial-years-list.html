<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        title="Financial Years"

        subtitle="Manage financial years"

        icon="fas fa-calendar-days">

        <div pageHeaderCenter>

            <app-search-box

                [(value)]="searchText"

                placeholder="Search financial years..."

                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>


        <div pageHeaderRight>

            <app-command-center

                command1Text="Add"

                command1Icon="fas fa-plus"

                (command1Click)="add()"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                (command2Click)="refresh()"

                command3Text="Restore"

                command3Icon="fas fa-trash-arrow-up"

                (command3Click)="restore()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>


        <!-- =================================================
             FILTERS : YEAR STATUS + STATUS
        ================================================== -->

        <div

            pageToolbarRight

            style="display:flex;gap:12px">

            <div style="width:220px">

                <app-search-dropdown

                    placeholder="All Year Status"

                    [items]="yearStatusFilterItems"

                    labelField="label"

                    valueField="value"

                    [value]="selectedYearStatus"

                    (valueChange)="onYearStatusFilterChange($event)">

                </app-search-dropdown>

            </div>


            <div style="width:220px">

                <app-search-dropdown

                    placeholder="All Status"

                    [items]="statusFilterItems"

                    labelField="label"

                    valueField="value"

                    [value]="selectedStatus"

                    (valueChange)="onStatusFilterChange($event)">

                </app-search-dropdown>

            </div>

        </div>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="canvasConfig">


        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table

                [columns]="columns"

                [rows]="pagedFinancialYears"

                [serialOffset]="(currentPage - 1) * pageSize"

                [loading]="loading"

                [error]="loadFailed"

                (view)="view($event)"

                (edit)="edit($event)"

                (delete)="delete($event)"

                (sortChange)="onSort($event)">

            </app-list-table>

        </div>


        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination

            canvasFooter

            [totalRecords]="filteredFinancialYears.length"

            [currentPage]="currentPage"

            [pageSize]="pageSize"

            (pageChange)="onPageChange($event)"

            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer

        [opened]="historyOpened"

        [title]="historyTitle"

        [items]="historyItems"

        (closed)="closeHistory()">

    </app-history-drawer>



    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Supplier Profiles"
        subtitle="Brand distributors, local vendors and service providers"
        icon="fas fa-truck-field"
        art="truck">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search name, code, phone, BIN..."
                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

        <!-- =================================================
             SUPPLY TYPE FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Supply Types"
            [items]="supplyTypeFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedSupplyType"
            (valueChange)="onSupplyTypeFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             BRAND FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Brands"
            [items]="brandFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedBrandId"
            (valueChange)="onBrandFilterChange($event)">

        </app-search-dropdown>

        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-search-dropdown
            pageToolbarRight
            placeholder="All Status"
            [items]="statusFilterItems"
            labelField="label"
            valueField="value"
            [value]="selectedStatus"
            (valueChange)="onStatusFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table
                [columns]="columns"
                emptyArt="truck"
                emptyTitle="No supplier yet"
                emptySubtitle="Add a supplier : purchases and payments are kept against it."
                [rows]="suppliers"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">

            </app-list-table>

        </div>

        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination
            canvasFooter
            [totalRecords]="totalRecords"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (supply type, brand and search applied; not
         the tab or the status filter)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <app-summary-line
            [items]="summaryItems"
            noun="suppliers"
            art="truck"
            note="All records">
        </app-summary-line>
    }

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">

    </app-history-drawer>

    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

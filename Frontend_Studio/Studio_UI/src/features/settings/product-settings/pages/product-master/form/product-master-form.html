<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-box"

        [title]="pageTitle"

        subtitle="Manage product masters">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =============================================
                 SECTION 01
                 BASIC INFORMATION
            ============================================== -->

            <app-form-section

                title="Basic Information"

                icon="fas fa-layer-group">



                <!-- Product Category -->

                <app-dropdown

                    label="Product Category"

                    [items]="productCategoryItems"

                    [(value)]="entity.ProductCategoryId"

                    (valueChange)="onProductCategoryChange()"

                    [disabled]="isEditMode || isViewMode"

                    [required]="true">

                </app-dropdown>



                <!-- Product Sub Category -->

                <app-dropdown

                    label="Product Sub Category"

                    [items]="productSubCategoryItems"

                    [(value)]="entity.ProductSubCategoryId"

                    (valueChange)="onProductSubCategoryChange()"

                    [disabled]="isEditMode || isViewMode"

                    [required]="true">

                </app-dropdown>



                <!-- Product Code -->

                <app-textbox

                    label="Product Code"

                    placeholder="Auto generated"

                    [(value)]="entity.ProductCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- Product Name -->

                <app-textbox

                    label="Product Name"

                    placeholder="Enter product name"

                    [(value)]="entity.ProductName"

                    (valueChange)="onProductNameChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 02
                 INVENTORY LEDGER CODES
            ============================================== -->

            <app-form-section

                title="Inventory Ledger Codes"

                icon="fas fa-tags">



                <!-- Inventory Ledger Code -->

                <app-textbox

                    label="Inventory Ledger Code"

                    placeholder="Auto generated"

                    [(value)]="entity.InventoryLedgerCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- WIP Ledger Code -->

                <app-textbox

                    label="WIP Ledger Code"

                    placeholder="Auto generated"

                    [(value)]="entity.WipLedgerCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- COGS Ledger Code -->

                <app-textbox

                    label="COGS Ledger Code"

                    placeholder="Auto generated"

                    [(value)]="entity.CogsLedgerCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 03
                 LEDGER NAMES
            ============================================== -->

            <app-form-section

                title="Ledger Names"

                icon="fas fa-folder-tree">



                <!-- Inventory Ledger Name -->

                <app-textbox

                    label="Inventory Ledger Name"

                    placeholder="Enter inventory ledger name"

                    [(value)]="entity.InventoryLedgerName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isEditMode"

                    [required]="true">

                </app-textbox>



                <!-- WIP Ledger Name -->

                <app-textbox

                    label="WIP Ledger Name"

                    placeholder="Enter WIP ledger name"

                    [(value)]="entity.WipLedgerName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isEditMode"

                    [required]="true">

                </app-textbox>



                <!-- COGS Ledger Name -->

                <app-textbox

                    label="COGS Ledger Name"

                    placeholder="Enter COGS ledger name"

                    [(value)]="entity.CogsLedgerName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode || isEditMode"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 04
                 STATUS & CONTROL
            ============================================== -->

            <app-form-section

                title="Status & Control"

                icon="fas fa-toggle-on">



                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.IsActive"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>



                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>


            </app-form-section>



        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 05 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

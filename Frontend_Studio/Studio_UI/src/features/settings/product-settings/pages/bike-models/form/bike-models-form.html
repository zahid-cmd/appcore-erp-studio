<!-- PAGE-CLONED : Color Management -> Bike Models -->
<div class="app-form-page">


    <!-- =====================================================
         SECTION 01 : PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-motorcycle"

        [title]="pageTitle"

        subtitle="Manage bike models">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         SECTION 02 : PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         SECTION 03 : PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =============================================
                 MODEL INFORMATION
            ============================================== -->

            <app-form-section

                title="Model Information"

                icon="fas fa-motorcycle">


                <!-- Model Code (generated by the server) -->

                <app-textbox

                    label="Model Code"

                    placeholder="Auto generated"

                    [(value)]="entity.ModelCode"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


                <!-- Brand -->

                <app-dropdown

                    label="Brand"

                    placeholder="Select brand"

                    [items]="brandItems"

                    [(value)]="entity.BrandManagementId"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Model Name -->

                <app-textbox

                    label="Model Name"

                    placeholder="Enter model name"

                    [(value)]="entity.ModelName"

                    [maxLength]="150"

                    textCase="upper"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


                <!-- Bike Type -->

                <app-dropdown

                    label="Bike Type"

                    placeholder="Select bike type"

                    [items]="bikeTypeItems"

                    [(value)]="entity.BikeType"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>

            </app-form-section>


            <!-- =============================================
                 WEBSITE
            ============================================== -->

            <app-form-section

                title="Website"

                icon="fas fa-globe">


                <!-- Show on Website -->

                <app-dropdown

                    label="Show on Website"

                    [items]="yesNoItems"

                    [(value)]="entity.ShowOnWebsite"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-dropdown>


                <!-- Featured -->

                <app-dropdown

                    label="Featured"

                    [items]="yesNoItems"

                    [(value)]="entity.IsFeatured"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-dropdown>


                <!-- Short Tagline -->

                <app-textbox

                    label="Short Tagline"

                    placeholder="Enter a short tagline"

                    [(value)]="entity.Tagline"

                    [maxLength]="200"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


                <!-- Display Order (digits only) -->

                <app-textbox

                    label="Display Order"

                    placeholder="0"

                    [value]="displayOrderText"

                    (valueChange)="onDisplayOrderChange($event)"

                    [disabled]="isViewMode">

                </app-textbox>

            </app-form-section>


            <!-- =============================================
                 DESCRIPTION
            ============================================== -->

            <app-form-section

                title="Description"

                icon="fas fa-align-left">


                <!-- Description (optional) -->

                <app-textarea

                    label="Description"

                    placeholder="Enter model description"

                    [rows]="8"

                    [(value)]="entity.Description"

                    [maxLength]="2000"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>


            <!-- =============================================
                 STATUS & REMARKS
            ============================================== -->

            <app-form-section

                title="Status & Remarks"

                icon="fas fa-sliders">


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    [(value)]="entity.Status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


                <!-- Remarks (optional) -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [rows]="4"

                    [(value)]="entity.Remarks"

                    [maxLength]="1000"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>

        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     SECTION 04 : UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

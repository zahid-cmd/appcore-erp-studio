<div class="app-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        icon="fas fa-motorcycle"
        art="bike"
        [title]="pageTitle"
        subtitle="A bike model of a brand, e.g. Revoo C32">

        <app-command-center
            pageHeaderRight
            [command1Text]="saveButtonText"
            command1Icon="fas fa-floppy-disk"
            (command1Click)="onSave()"
            [command1Visible]="!isViewMode"
            command2Text="Clear"
            command2Icon="fas fa-broom"
            (command2Click)="onClear()"
            [command2Visible]="!isViewMode"
            [command3Visible]="false"
            rightCommandIcon="fas fa-arrow-left"
            rightCommandTitle="Back to the list"
            (rightCommandClick)="onBackToList()">
        </app-command-center>

    </app-page-header>

    <!-- =====================================================
         PAGE TOOLBAR : one screen, one light step
    ====================================================== -->

    <app-page-toolbar>

        <app-step-tabs
            pageToolbarLeft
            [steps]="tabs"
            [current]="selectedTab"
            (currentChange)="onTabChange($event)">
        </app-step-tabs>

    </app-page-toolbar>

    <!-- =====================================================
         PAGE CANVAS : the fields left, the workspace right
         (2026-11-16 workspace layout)
    ====================================================== -->

    <app-page-canvas
        [config]="formConfig">

        <div
            canvasBody
            class="ws-body appcore-scrollbar">

            <!-- ================= LEFT : the fields ================= -->

            <div class="ws-steps">

                <div class="ws-step">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-motorcycle"></i>
                            <span>Model</span>
                        </header>

                        <div class="ws-grid ws-cols-3">
                            <app-textbox
                                label="Model Code"
                                placeholder="Auto generated"
                                [(value)]="entity.ModelCode"
                                [readonly]="true"
                                [required]="true">
                            </app-textbox>

                            <app-dropdown
                                label="Brand"
                                placeholder="Select brand"
                                [items]="brandItems"
                                [(value)]="entity.BrandManagementId"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-dropdown>

                            <app-dropdown
                                label="Bike Type"
                                placeholder="Select bike type"
                                [items]="bikeTypeItems"
                                [(value)]="entity.BikeType"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-dropdown>

                            <app-textbox
                                class="ws-full"
                                label="Model Name"
                                placeholder="e.g. C32"
                                [(value)]="entity.ModelName"
                                [maxLength]="150"
                                textCase="upper"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-textbox>

                        </div>

                    </section>

                    <section class="ws-card ws-notes">

                        <header class="ws-card-head">
                            <i class="fas fa-note-sticky"></i>
                            <span>Remarks</span>
                        </header>

                        <app-note-pad
                            placeholder="Anything the team should know"
                            note="Only for your team, never printed"
                            [maxLength]="500"
                            [(value)]="entity.Remarks"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode">
                        </app-note-pad>

                    </section>

                </div>

            </div>

            <!-- ================= RIGHT : the workspace ================= -->

            <aside class="ws-panel">

                <div class="ws-hero">

                    <app-workspace-art theme="bike"></app-workspace-art>

                    <div class="ws-identity">

                        <b [class.ws-new]="!entity.ModelName">{{ entity.ModelName || 'New bike model' }}</b>

                        <div class="ws-chips">

                            @if (entity.ModelCode)
                            {
                                <span
                                    class="ws-chip"
                                data-tone="info">{{ entity.ModelCode }}</span>
                            }

                            @if (entity.BikeType)
                            {
                                <span
                                    class="ws-chip">{{ entity.BikeType }}</span>
                            }

                        </div>

                    </div>

                    <app-toggle-switch
                        label="Status"
                        onText="Active"
                        offText="Inactive"
                        [(value)]="entity.Status"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode">
                    </app-toggle-switch>

                    <ul class="ws-uses">
                        <li><i class="fas fa-layer-group"></i><span>Sub categories and bikes are made per model</span></li>
                        <li><i class="fas fa-list-check"></i><span>Specifications are kept per model</span></li>
                    </ul>

                </div>

            </aside>

        </div>

    </app-page-canvas>

</div>

<!-- =====================================================
     UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<app-progress-dialog></app-progress-dialog>

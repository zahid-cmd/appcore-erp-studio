<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        title="Product Category"

        subtitle="The product categories by type (Motor Bikes, Spare Parts, Accessories) and their inventory groups"

        icon="fas fa-layer-group"

        art="catalog">

        <div pageHeaderCenter>

            <app-search-box

                [(value)]="searchText"

                placeholder="Search product categories..."

                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>


        <div pageHeaderRight>

            <app-command-center

                command1Text="Add"

                command1Icon="fas fa-plus"

                (command1Click)="add()"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                (command2Click)="refresh()"

                command3Text="Restore"

                command3Icon="fas fa-trash-arrow-up"

                (command3Click)="restore()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>


        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-search-dropdown

            pageToolbarRight

            placeholder="All Status"

            [items]="statusFilterItems"

            labelField="label"

            valueField="value"

            [value]="selectedStatus"

            (valueChange)="onStatusFilterChange($event)">

        </app-search-dropdown>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="canvasConfig">


        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <app-list-table

                [columns]="columns"

                [rows]="productCategories"

                [serialOffset]="(currentPage - 1) * pageSize"

                [loading]="loading"

                [error]="loadFailed"

                emptyArt="catalog"

                emptyTitle="No product category yet"

                emptySubtitle="Add a category : sub categories and products sit under it."

                (view)="view($event)"

                (edit)="edit($event)"

                (delete)="delete($event)"

                (sortChange)="onSort($event)">

            </app-list-table>

        </div>


        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination

            canvasFooter

            [totalRecords]="totalRecords"

            [currentPage]="currentPage"

            [pageSize]="pageSize"

            (pageChange)="onPageChange($event)"

            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>

    <!-- =====================================================
         SUMMARY (status filter and search)
    ====================================================== -->

    @if (summaryItems.length > 0)
    {
        <app-summary-line
            [items]="summaryItems"
            noun="categories"
            art="catalog"
            note="All records">
        </app-summary-line>
    }



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer

        [opened]="historyOpened"

        [title]="historyTitle"

        [items]="historyItems"

        (closed)="closeHistory()">

    </app-history-drawer>



    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

    <app-progress-dialog></app-progress-dialog>

</div>

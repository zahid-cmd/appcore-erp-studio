<div class="app-form-page">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-list"

        [title]="pageTitle"

        subtitle="Manage login pages">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid

            canvasBody

            [columns]="4">


            <!-- =============================================
                 SECTION 1
                 GENERAL INFORMATION
            ============================================== -->

            <app-form-section

                title="General Information"

                icon="fas fa-circle-info">


                <!-- Code -->

                <app-textbox

                    label="Code"

                    placeholder="Auto generated"

                    [(value)]="entity.code"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- Name -->

                <app-textbox

                    label="Name"

                    placeholder="Enter login page name"

                    [(value)]="entity.name"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 2
                 PAGE DEFINITION
            ============================================== -->

            <app-form-section

                title="Page Definition"

                icon="fas fa-window-maximize">


                <!-- Page Key -->

                <app-textbox

                    label="Page Key"

                    placeholder="Auto generated from name"

                    [(value)]="entity.pageKey"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- Title -->

                <app-textbox

                    label="Title"

                    placeholder="Enter login page title"

                    [(value)]="entity.title"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>



                <!-- Subtitle -->

                <app-textbox

                    label="Subtitle"

                    placeholder="Enter login page subtitle"

                    [(value)]="entity.subtitle"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>


            </app-form-section>



            <!-- =============================================
                 SECTION 3
                 STATUS INFORMATION
            ============================================== -->

            <app-form-section

                title="Status Information"

                icon="fas fa-toggle-on">


                <!-- Status -->

                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    labelField="text"

                    valueField="value"

                    [(value)]="entity.status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


            </app-form-section>



            <!-- =============================================
                 SECTION 4
                 ADDITIONAL INFORMATION
            ============================================== -->

            <app-form-section

                title="Additional Information"

                icon="fas fa-clipboard">


                <!-- Remarks -->

                <app-textarea

                    label="Remarks"

                    placeholder="Enter remarks"

                    [(value)]="entity.remarks"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textarea>


            </app-form-section>


        </app-form-grid>

    </app-page-canvas>

</div>



<!-- =====================================================
     UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

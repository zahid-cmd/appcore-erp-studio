<div class="app-list-page">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        title="Login Pages"

        subtitle="Manage login pages"

        icon="fas fa-list">

        <div pageHeaderCenter>

            <app-search-box

                [(value)]="searchText"

                placeholder="Search login pages..."

                (valueChange)="onSearch($event)">

            </app-search-box>

        </div>


        <div pageHeaderRight>

            <app-command-center

                command1Text="Add"

                command1Icon="fas fa-plus"

                (command1Click)="add()"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                (command2Click)="refresh()"

                command3Text="Restore"

                command3Icon="fas fa-trash-arrow-up"

                (command3Click)="restore()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>


        <!-- =================================================
             STATUS FILTER
        ================================================== -->

        <app-dropdown

            pageToolbarRight

            placeholder="All Status"

            [items]="statusItems"

            labelField="text"

            valueField="value"

            [(value)]="selectedStatus"

            (valueChange)="onStatusFilterChange($event)">

        </app-dropdown>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="canvasConfig">


        <!-- =================================================
             LIST TABLE
        ================================================== -->

        <div canvasBody>

            <!--
                Page-specific wrapper.

                This wrapper belongs ONLY to Login Pages.

                The mouseover handler changes the native
                operation tooltip from "Synchronize" to
                "Preview" for this page only.

                The shared ListTableComponent is NOT changed.
            -->

            <div

                class="login-pages-operation-table"

                (mouseover)="
                    onLoginPagesOperationMouseOver($event)
                ">


                <app-list-table

                    [columns]="columns"

                    [rows]="pagedLoginPages"

                    [serialOffset]="
                        (currentPage - 1)
                        *
                        pageSize
                    "

                    [loading]="loading"

                    [error]="loadFailed"

                    (view)="view($event)"

                    (edit)="edit($event)"

                    (delete)="delete($event)"

                    (operation)="preview($event)"

                    (sortChange)="onSort($event)">

                </app-list-table>


            </div>

        </div>



        <!-- =================================================
             PAGINATION
        ================================================== -->

        <app-pagination

            canvasFooter

            [totalRecords]="
                filteredLoginPages.length
            "

            [currentPage]="currentPage"

            [pageSize]="pageSize"

            (pageChange)="onPageChange($event)"

            (pageSizeChange)="onPageSizeChange($event)">

        </app-pagination>

    </app-page-canvas>



    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer

        [opened]="historyOpened"

        [title]="historyTitle"

        [items]="historyItems"

        (closed)="closeHistory()">

    </app-history-drawer>



    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>


</div>

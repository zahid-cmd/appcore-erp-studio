<div class="app-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        icon="fas fa-list"
        [title]="pageTitle"
        [subtitle]="
            isMasterMode
                ? 'Manage ERP master activities.'
                : 'Manage ERP navigation activities.'
        ">

        <app-command-center
            pageHeaderRight

            [command1Text]="saveButtonText"
            command1Icon="fas fa-floppy-disk"
            (command1Click)="onSave()"
            [command1Visible]="!isViewMode"

            command2Text="Clear"
            command2Icon="fas fa-broom"
            (command2Click)="onClear()"
            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"
            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>


    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab"
            (selectedTabChange)="onTabChange($event)">

        </app-control-tabs>

    </app-page-toolbar>


    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas>

        <app-form-grid
            canvasBody
            [columns]="4">

            <!-- =============================================
                 ACTIVITY INFORMATION
            ============================================== -->

            <app-form-section
                title="Activity Information"
                icon="fas fa-list">

                @if (isNavigationMode)
                {
                <app-search-dropdown

                    label="Module"

                    [required]="true"

                    [items]="modules"

                    labelField="name"

                    valueField="id"

                    [(value)]="activity.navigationModuleId"

                    (valueChange)="onModuleChange($event)">
                </app-search-dropdown>
                }

                <app-textbox
                    label="Activity Code"
                    [(value)]="activity.code"
                    [readonly]="true"
                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =============================================
                 DISPLAY SETTINGS
            ============================================== -->

            <app-form-section
                title="Display Settings"
                icon="fas fa-sort-numeric-down">
                
                <app-textbox
                    label="Activity Name"
                    [(value)]="activity.name"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode"
                    [required]="true">

                </app-textbox>

                <app-textbox
                    label="Display Order"
                    type="number"
                    [(value)]="activity.displayOrder"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode"
                    [required]="true">

                </app-textbox>

            </app-form-section>


            <!-- =============================================
                 CONFIGURATION
            ============================================== -->

            <app-form-section
                title="Configuration"
                icon="fas fa-sliders">

                <app-dropdown
                    label="Status"
                    [required]="true"
                    [(value)]="activity.isActive"
                    (valueChange)="onStatusChange($event)"
                    [items]="statuses"
                    labelField="text"
                    valueField="value"
                    [disabled]="isViewMode">

                </app-dropdown>

            </app-form-section>


            <!-- =============================================
                 DESCRIPTION
            ============================================== -->

            <app-form-section
                title="Description"
                icon="fas fa-comment">

                <app-textarea
                    label="Remarks"
                    [(value)]="activity.remarks"
                    (valueChange)="checkForChanges()"
                    [disabled]="isViewMode">

                </app-textarea>

            </app-form-section>


        </app-form-grid>

    </app-page-canvas>

</div>

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

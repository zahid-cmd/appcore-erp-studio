<div class="app-list-page">

    <app-page-header
        title="Navigation Menus"
        subtitle="Manage application navigation menus."
        icon="fas fa-bars">

        <div pageHeaderCenter>

            <app-search-box
                [(value)]="searchText"
                placeholder="Search menus..."
                (valueChange)="onSearch($event)">
            </app-search-box>

        </div>

        <div pageHeaderRight>

            <app-command-center

                command1Text="Add"

                command1Icon="fas fa-plus"

                (command1Click)="add()"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                (command2Click)="refresh()"

                command3Text="Restore"

                command3Icon="fas fa-trash-arrow-up"

                (command3Click)="restore()"

                rightCommandIcon="fas fa-clock-rotate-left"

                (rightCommandClick)="openHistory()">

            </app-command-center>

        </div>

    </app-page-header>


    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab">
        </app-control-tabs>

        <app-search-dropdown
            pageToolbarRight

            placeholder="Select Module"

            [items]="modules"

            labelField="text"

            valueField="value"

            [(value)]="selectedModuleId"

            (valueChange)="onModuleChange($event)">
        </app-search-dropdown>

    </app-page-toolbar>


    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>

            <app-list-table

                [columns]="columns"

                [rows]="pagedMenus"

                [serialOffset]="(currentPage - 1) * pageSize"

                [loading]="loading"

                [error]="loadFailed"

                (view)="view($event)"

                (edit)="edit($event)"

                (delete)="delete($event)"

                (sortChange)="onSort($event)">

            </app-list-table>

        </div>


        <app-pagination
            canvasFooter
            [totalRecords]="filteredMenus.length"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>


    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>


    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

</div>

<div class="app-form-page"> 
    
    <!-- ===================================================== 
         PAGE HEADER 
    ====================================================== --> 
    
    <app-page-header 
    
        icon="fas fa-list" 
    
        [title]="pageTitle" 
    
        subtitle="Manage controlcomponentses"> 
    
        <app-command-center 
    
            pageHeaderRight 
    
            [command1Text]="saveButtonText" 
    
            command1Icon="fas fa-floppy-disk" 
    
            (command1Click)="onSave()" 
    
            [command1Visible]="!isViewMode" 
    
            command2Text="Clear" 
    
            command2Icon="fas fa-broom" 
    
            (command2Click)="onClear()" 
    
            [command2Visible]="!isViewMode" 
    
            [command3Visible]="false" 
    
            rightCommandIcon="fas fa-arrow-left" 
    
            (rightCommandClick)="onBackToList()"> 
    
        </app-command-center> 
    
    </app-page-header> 
    
    
    
    <!-- ===================================================== 
         PAGE TOOLBAR 
    ====================================================== --> 
    
    <app-page-toolbar> 
    
        <app-control-tabs 
    
            pageToolbarLeft 
    
            [tabs]="tabs" 
    
            [(selectedTab)]="selectedTab"> 
    
        </app-control-tabs> 
    
    </app-page-toolbar> 
    
    
    
    <!-- ===================================================== 
         PAGE CANVAS 
    ====================================================== --> 
    
    <app-page-canvas> 
    
        <app-form-grid 
    
            canvasBody 
    
            [columns]="4"> 
    
    
            <!-- ============================================= 
                 SECTION 1 
                 GENERAL INFORMATION 
            ============================================== --> 
    
            <app-form-section 
    
                title="General Information" 
    
                icon="fas fa-circle-info"> 
    
    
                <!-- Code --> 
    
                <app-textbox 
    
                    label="Code" 
    
                    placeholder="Auto generated" 
    
                    [(value)]="entity.code" 
    
                    [readonly]="true" 
    
                    [required]="true"> 
    
                </app-textbox> 
    
    
    
                <!-- Name --> 
    
                <app-textbox 
    
                    label="Name" 
    
                    placeholder="Enter component name" 
    
                    [(value)]="entity.name" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode" 
    
                    [required]="true"> 
    
                </app-textbox> 
    
    
    
            <!-- Tab Name -->     

            <app-textbox     

                label="Tab Name"     

                placeholder="Enter tab name"     

                [(value)]="entity.tabName"     

                (valueChange)="onValueChange()"     

                [disabled]="isViewMode"     

                [required]="true">     

            </app-textbox>
    
    
    
            </app-form-section> 
    
    
    
            <!-- ============================================= 
                 SECTION 2 
                 COMPONENT INFORMATION 
            ============================================== --> 
    
            <app-form-section 
    
                title="Component Information" 
    
                icon="fas fa-puzzle-piece"> 
    
    
                <!-- Icon --> 
    
                <app-textbox 
    
                    label="Icon" 
    
                    placeholder="Enter component icon" 
    
                    [(value)]="entity.icon" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode"> 
    
                </app-textbox> 
    
    
    
                <!-- Component Key --> 
    
                <app-textbox 
    
                    label="Component Key" 
    
                    placeholder="Auto generated" 
    
                    [(value)]="entity.componentKey" 
    
                    [readonly]="true" 
    
                    [required]="true"> 
    
                </app-textbox> 
                    
                <!-- Component Path --> 
    
                <app-textbox 
    
                    label="Component Path" 
    
                    placeholder="Enter component path" 
    
                    [(value)]="entity.componentPath" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode"> 
    
                </app-textbox> 
    
    
            </app-form-section> 
    
    
    
            <!-- ============================================= 
                 SECTION 3 
                 STATUS INFORMATION 
            ============================================== --> 
    
            <app-form-section 
    
                title="Status Information" 
    
                icon="fas fa-toggle-on"> 
                 <!-- Display Order --> 
    
                <app-textbox 
    
                    label="Display Order" 
    
                    placeholder="Enter display order" 
    
                    [(value)]="entity.displayOrder" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode" 
    
                    [required]="true"> 
    
                </app-textbox> 
    
                <!-- Status --> 
    
                <app-dropdown 
    
                    label="Status" 
    
                    [items]="statusItems" 
    
                    labelField="text" 
    
                    valueField="value" 
    
                    [(value)]="entity.status" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode" 
    
                    [required]="true"> 
    
                </app-dropdown> 
    
    
            </app-form-section> 
    
    
            <!-- ============================================= 
                 SECTION 5 
                 ADDITIONAL INFORMATION 
            ============================================== --> 
    
            <app-form-section 
    
                title="Additional Information" 
    
                icon="fas fa-clipboard"> 
    
    
                <!-- Remarks --> 
    
                <app-textarea 
    
                    label="Remarks" 
    
                    placeholder="Enter remarks" 
    
                    [(value)]="entity.remarks" 
    
                    (valueChange)="onValueChange()" 
    
                    [disabled]="isViewMode"> 
    
                </app-textarea> 
    
    
            </app-form-section> 
    
    
        </app-form-grid> 
    
    </app-page-canvas> 
    
</div> 
    
    
    
<!-- ===================================================== 
     UTILITIES 
====================================================== --> 
    
<app-toast></app-toast> 
    
<app-confirm-dialog></app-confirm-dialog>

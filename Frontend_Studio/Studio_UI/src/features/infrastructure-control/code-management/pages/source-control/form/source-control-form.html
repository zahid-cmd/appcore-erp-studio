<div class="app-form-page"> 
 
    <!-- ===================================================== 
         PAGE HEADER 
    ====================================================== --> 
 
    <app-page-header 
 
        icon="fas fa-code-branch" 
 
        [title]="pageTitle" 
 
        subtitle="Manage source control repositories"> 
 
        <app-command-center 
 
            pageHeaderRight 
 
            [command1Text]="saveButtonText" 
 
            command1Icon="fas fa-floppy-disk" 
 
            (command1Click)="onSave()" 
 
            [command1Visible]="!isViewMode" 
 
            command2Text="Clear" 
 
            command2Icon="fas fa-broom" 
 
            (command2Click)="onClear()" 
 
            [command2Visible]="!isViewMode" 
 
            [command3Visible]="false" 
 
            rightCommandIcon="fas fa-arrow-left" 
 
            (rightCommandClick)="onBackToList()"> 
 
        </app-command-center> 
 
    </app-page-header> 
 
 
 
    <!-- ===================================================== 
         PAGE TOOLBAR 
    ====================================================== --> 
 
    <app-page-toolbar> 
 
        <app-control-tabs 
 
            pageToolbarLeft 
 
            [tabs]="tabs" 
 
            [(selectedTab)]="selectedTab"> 
 
        </app-control-tabs> 
 
    </app-page-toolbar> 
 
 
 
    <!-- ===================================================== 
         PAGE CANVAS 
    ====================================================== --> 
 
    <app-page-canvas> 
 
        <app-form-grid 
 
            canvasBody 
 
            [columns]="4"> 
 
 
            <!-- ============================================= 
                 SECTION 1 
                 GENERAL INFORMATION 
            ============================================== --> 
 
            <app-form-section 
 
                title="General Information" 
 
                icon="fas fa-circle-info"> 
 
 
                <!-- Code --> 
 
                <app-textbox 
 
                    label="Code" 
 
                    placeholder="Auto generated" 
 
                    [(value)]="entity.repositoryCode" 
 
                    [readonly]="true" 
 
                    [required]="true"> 
 
                </app-textbox> 
 
 
 
                <!-- Name --> 
 
                <app-textbox 
 
                    label="Name" 
 
                    placeholder="Enter repository name" 
 
                    [(value)]="entity.repositoryName" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode" 
 
                    [required]="true"> 
 
                </app-textbox> 
 
 
            </app-form-section> 
 
 
 
            <!-- ============================================= 
                 SECTION 2 
                 GIT CONFIGURATION 
            ============================================== --> 
 
            <app-form-section 
 
                title="Git Configuration" 
 
                icon="fas fa-code-branch"> 
 
 
                <!-- Git Remote URL --> 
 
                <app-textbox 
 
                    label="Git Remote URL" 
 
                    placeholder="Enter Git remote URL" 
 
                    [(value)]="entity.gitRemoteUrl" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode" 
 
                    [required]="true"> 
 
                </app-textbox> 
 
 
 
                <!-- Repository Path --> 
 
                <app-textbox 
 
                    label="Repository Path" 
 
                    placeholder="Enter complete source folder path" 
 
                    [(value)]="entity.repositoryPath" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode" 
 
                    [required]="true"> 
 
                </app-textbox> 
 
 
            </app-form-section> 
 
 
 
            <!-- ============================================= 
                 SECTION 3 
                 STATUS INFORMATION 
            ============================================== --> 
 
            <app-form-section 
 
                title="Status Information" 
 
                icon="fas fa-toggle-on"> 
 
 
                <!-- Default Branch --> 
 
                <app-dropdown 
 
                    label="Default Branch" 
 
                    [items]="branchItems" 
 
                    labelField="text" 
 
                    valueField="value" 
 
                    [(value)]="entity.defaultBranch" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode" 
 
                    [required]="true"> 
 
                </app-dropdown> 
 
 
 
                <!-- Status --> 
 
                <app-dropdown 
 
                    label="Status" 
 
                    [items]="statusItems" 
 
                    labelField="text" 
 
                    valueField="value" 
 
                    [(value)]="entity.isActive" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode" 
 
                    [required]="true"> 
 
                </app-dropdown> 
 
 
            </app-form-section> 
 
 
 
            <!-- ============================================= 
                 SECTION 4 
                 ADDITIONAL INFORMATION 
            ============================================== --> 
 
            <app-form-section 
 
                title="Additional Information" 
 
                icon="fas fa-clipboard"> 
 
 
                <!-- Remarks --> 
 
                <app-textarea 
 
                    label="Remarks" 
 
                    placeholder="Enter remarks" 
 
                    [(value)]="remarks" 
 
                    (valueChange)="onValueChange()" 
 
                    [disabled]="isViewMode"> 
 
                </app-textarea> 
 
 
            </app-form-section> 
 
 
        </app-form-grid> 
 
    </app-page-canvas> 
 
</div> 
 
 
 
<!-- ===================================================== 
     UTILITIES 
====================================================== --> 
 
<app-toast></app-toast> 
 
<app-confirm-dialog></app-confirm-dialog>

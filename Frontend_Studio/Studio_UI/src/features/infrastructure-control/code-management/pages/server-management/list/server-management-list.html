<div class="app-list-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        title="Server Management"
        subtitle="Live servers for the Deployment Center (Deploy Agent over Tailscale)"
        icon="fas fa-server">

        <div pageHeaderCenter>
            <app-search-box
                [(value)]="searchText"
                placeholder="Search servers..."
                (valueChange)="onSearch($event)">
            </app-search-box>
        </div>

        <div pageHeaderRight>
            <app-command-center
                command1Text="Add"
                command1Icon="fas fa-plus"
                (command1Click)="add()"
                command2Text="Refresh"
                command2Icon="fas fa-rotate-right"
                (command2Click)="refresh()"
                command3Text="Restore"
                command3Icon="fas fa-trash-arrow-up"
                (command3Click)="restore()"
                rightCommandIcon="fas fa-clock-rotate-left"
                (rightCommandClick)="openHistory()">
            </app-command-center>
        </div>

    </app-page-header>


    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-control-tabs
            pageToolbarLeft
            [tabs]="tabs"
            [(selectedTab)]="selectedTab">
        </app-control-tabs>

        <app-dropdown
            pageToolbarRight
            placeholder="All Status"
            [items]="statusItems"
            labelField="text"
            valueField="value"
            [(value)]="selectedStatus"
            (valueChange)="onStatusFilterChange($event)">
        </app-dropdown>

    </app-page-toolbar>


    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas
        [config]="canvasConfig">

        <div canvasBody>
            <app-list-table
                [columns]="columns"
                [rows]="pagedServers"
                [serialOffset]="(currentPage - 1) * pageSize"
                [loading]="loading"
                [error]="loadFailed"
                [rowActions]="rowActions"
                (rowAction)="onRowAction($event)"
                (view)="view($event)"
                (edit)="edit($event)"
                (delete)="delete($event)"
                (sortChange)="onSort($event)">
            </app-list-table>
        </div>

        <app-pagination
            canvasFooter
            [totalRecords]="filteredServers.length"
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-pagination>

    </app-page-canvas>


    <!-- =====================================================
         SUMMARY (all records)
    ====================================================== -->

    @if (summaryTotal > 0)
    {
        <div class="ics-summary">
            <span class="ics-summary-item">
                <span class="ics-summary-label">Total</span>
                <b class="ics-summary-value">{{ summaryText(summaryTotal) }}</b>
            </span>
            <span class="ics-summary-item">
                <span class="ics-summary-label">Active</span>
                <b class="ics-summary-value ics-ok">{{ summaryText(summaryActive) }}</b>
            </span>
            <span class="ics-summary-item">
                <span class="ics-summary-label">Online (last check)</span>
                <b class="ics-summary-value ics-ok">{{ summaryText(summaryOnline) }}</b>
            </span>
            <span class="ics-summary-note">
                Plug button = Test Connection
            </span>
        </div>
    }


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <app-history-drawer
        [opened]="historyOpened"
        [title]="historyTitle"
        [items]="historyItems"
        (closed)="closeHistory()">
    </app-history-drawer>


    <!-- =====================================================
         UTILITIES
    ====================================================== -->

    <app-toast></app-toast>

    <app-confirm-dialog></app-confirm-dialog>

</div>

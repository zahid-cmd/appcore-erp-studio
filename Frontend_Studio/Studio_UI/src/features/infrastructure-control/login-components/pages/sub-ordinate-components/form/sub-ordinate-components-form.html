<div class="app-form-page">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->


    <app-page-header

        icon="fas fa-table-columns"

        [title]="pageTitle"

        subtitle="Manage sub ordinate components">


        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>


    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->


    <app-page-toolbar>


        <app-control-tabs

            pageToolbarLeft

            [tabs]="tabs"

            [(selectedTab)]="selectedTab">

        </app-control-tabs>


    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->


    <app-page-canvas>


        <app-form-grid

            canvasBody

            [columns]="4">



            <!-- =================================================
                 SECTION 1
                 GENERAL INFORMATION
            ================================================== -->


            <app-form-section

                title="General Information"

                icon="fas fa-circle-info">


                <!-- =============================================
                     CODE
                ============================================== -->


                <app-textbox

                    label="Code"

                    placeholder="Auto generated"

                    [(value)]="entity.code"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     NAME
                ============================================== -->


                <app-textbox

                    label="Name"

                    placeholder="Enter component name"

                    [(value)]="entity.name"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     TAB NAME
                ============================================== -->


                <app-textbox

                    label="Tab Name"

                    placeholder="Enter tab name"

                    [(value)]="entity.tabName"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     ICON
                ============================================== -->


                <app-textbox

                    label="Icon"

                    placeholder="Enter component icon"

                    [(value)]="entity.icon"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode">

                </app-textbox>



                <!-- =============================================
                     DISPLAY ORDER
                ============================================== -->


                <app-textbox

                    label="Display Order"

                    placeholder="Enter display order"

                    [(value)]="entity.displayOrder"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =================================================
                 SECTION 2
                 COMPONENT INFORMATION
            ================================================== -->


            <app-form-section

                title="Component Information"

                icon="fas fa-puzzle-piece">


                <!-- =============================================
                     FOLDER NAME
                ============================================== -->


                <app-textbox

                    label="Folder Name"

                    placeholder="Enter folder name"

                    [(value)]="entity.folderName"

                    (valueChange)="onFolderNameChange()"

                    [readonly]="isFolderNameReadonly"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     FEATURE FOLDER
                ============================================== -->


                <app-textbox

                    label="Feature Folder"

                    placeholder="Auto generated"

                    [(value)]="entity.featureFolder"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     FEATURE SUB FOLDER
                ============================================== -->


                <app-textbox

                    label="Feature Sub Folder"

                    placeholder="Auto generated"

                    [(value)]="entity.featureSubFolder"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     COMPONENT PATH
                ============================================== -->


                <app-textbox

                    label="Component Path"

                    placeholder="Auto generated"

                    [(value)]="entity.componentPath"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     STATUS
                ============================================== -->


                <app-dropdown

                    label="Status"

                    [items]="statusItems"

                    labelField="text"

                    valueField="value"

                    [(value)]="entity.status"

                    (valueChange)="onValueChange()"

                    [disabled]="isViewMode"

                    [required]="true">

                </app-dropdown>


            </app-form-section>



            <!-- =================================================
                 SECTION 3
                 FILE & REGISTRATION INFORMATION
            ================================================== -->


            <app-form-section

                title="File & Registration Information"

                icon="fas fa-folder-tree">


                <!-- =============================================
                     REGISTRATION FILE PATH
                ============================================== -->


                <app-textbox

                    label="Registration File Path"

                    placeholder="Auto generated"

                    [(value)]="entity.registrationFilePath"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     HTML FILE PATH
                ============================================== -->


                <app-textbox

                    label="HTML File Path"

                    placeholder="Auto generated"

                    [(value)]="entity.htmlFilePath"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     TS FILE PATH
                ============================================== -->


                <app-textbox

                    label="TS File Path"

                    placeholder="Auto generated"

                    [(value)]="entity.tsFilePath"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>



                <!-- =============================================
                     CSS FILE PATH
                ============================================== -->


                <app-textbox

                    label="CSS File Path"

                    placeholder="Auto generated"

                    [(value)]="entity.cssFilePath"

                    [readonly]="true"

                    [required]="true">

                </app-textbox>


            </app-form-section>



            <!-- =================================================
                 SECTION 4
                 BACKGROUND IMAGE CONFIGURATION
            ================================================== -->


            <app-form-section

                title="Background Image Configuration"

                icon="fas fa-images">


                <!-- =============================================
                     LIGHT THEME IMAGE
                ============================================== -->


                <app-image-hub

                    label="Light theme image"

                    [imageUrl]="lightBackgroundImageUrl"

                    placeholder="No Light Background Image"

                    [disabled]="isViewMode"

                    [readonly]="isViewMode"

                    (imageChange)="
                        onLightBackgroundImageChange($event)
                    ">

                </app-image-hub>



                <!-- =============================================
                     DEEP THEME IMAGE
                ============================================== -->


                <app-image-hub

                    label="Deep theme image"

                    [imageUrl]="deepBackgroundImageUrl"

                    placeholder="No Deep Background Image"

                    [disabled]="isViewMode"

                    [readonly]="isViewMode"

                    (imageChange)="
                        onDeepBackgroundImageChange($event)
                    ">

                </app-image-hub>


            </app-form-section>


        </app-form-grid>


    </app-page-canvas>


</div>



<!-- =====================================================
     UTILITIES
====================================================== -->


<app-toast></app-toast>


<app-confirm-dialog></app-confirm-dialog>

<div class="app-form-page">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header

        icon="fas fa-user-shield"

        art="people"

        [title]="pageTitle"

        subtitle="Manage role profiles">

        <app-command-center

            pageHeaderRight

            [command1Text]="saveButtonText"

            command1Icon="fas fa-floppy-disk"

            (command1Click)="onSave()"

            [command1Visible]="!isViewMode"

            command2Text="Clear"

            command2Icon="fas fa-broom"

            (command2Click)="onClear()"

            [command2Visible]="!isViewMode"

            [command3Visible]="false"

            rightCommandIcon="fas fa-arrow-left"

            (rightCommandClick)="onBackToList()">

        </app-command-center>

    </app-page-header>



    <!-- =====================================================
         PAGE TOOLBAR
    ====================================================== -->

    <app-page-toolbar>

        <app-step-tabs

            pageToolbarLeft

            [steps]="tabs"

            [current]="selectedTab"

            (currentChange)="onTabChange($event)">

        </app-step-tabs>

    </app-page-toolbar>



    <!-- =====================================================
         PAGE CANVAS
    ====================================================== -->

    <app-page-canvas

        [config]="formConfig">

        <div
            canvasBody
            class="ws-body appcore-scrollbar">

            <!-- ================= LEFT : the fields (2026-11-16 workspace layout) ================= -->

            <div class="ws-steps">

                <div class="ws-step">

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-user-shield"></i>
                            <span>Role Profile Information</span>
                        </header>

                        <div class="ws-grid ws-cols-2">
                            <app-textbox
                                label="Profile Code"
                                placeholder="Auto generated"
                                [(value)]="entity.ProfileCode"
                                [readonly]="true"
                                [required]="true">
                            </app-textbox>

                            <app-textbox
                                label="Profile Name"
                                placeholder="Enter profile name"
                                [(value)]="entity.ProfileName"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-textbox>
                        </div>

                    </section>

                    <section class="ws-card">

                        <header class="ws-card-head">
                            <i class="fas fa-sliders"></i>
                            <span>Profile Settings</span>
                        </header>

                        <div class="ws-grid ws-cols-2">
                            <app-textbox
                                label="Display Order"
                                placeholder="Enter display order"
                                [(value)]="entity.DisplayOrder"
                                (valueChange)="onValueChange()"
                                [disabled]="isViewMode"
                                [required]="true">
                            </app-textbox>
                        </div>

                    </section>

                    <section class="ws-card ws-notes">

                        <header class="ws-card-head">
                            <i class="fas fa-note-sticky"></i>
                            <span>Remarks</span>
                        </header>

                        <app-note-pad
                            placeholder="Anything the team should know"
                            note="Only for your team, never printed"
                            [maxLength]="1000"
                            [(value)]="entity.Remarks"
                            (valueChange)="onValueChange()"
                            [disabled]="isViewMode">
                        </app-note-pad>

                    </section>

                </div>

            </div>

            <!-- ================= RIGHT : the workspace ================= -->

            <aside class="ws-panel">

                <div class="ws-hero">

                    <app-workspace-art theme="people"></app-workspace-art>

                    <div class="ws-identity">

                        <b [class.ws-new]="!entity.ProfileName">{{ entity.ProfileName || 'New role' }}</b>

                        <div class="ws-chips">

                            @if (entity.ProfileCode)
                            {
                                <span
                                    class="ws-chip"
                                data-tone="info">{{ entity.ProfileCode }}</span>
                            }

                        </div>

                    </div>

                    <app-toggle-switch
                        label="Status"
                        onText="Active"
                        offText="Inactive"
                        [(value)]="entity.IsActive"
                        (valueChange)="onValueChange()"
                        [disabled]="isViewMode">
                    </app-toggle-switch>
                    <ul class="ws-uses">
                        <li><i class="fas fa-list-check"></i><span>Holds menus and actions (Activity Assignment)</span></li>
                        <li><i class="fas fa-user-tag"></i><span>Given to users (Role Assignment)</span></li>
                        <li><i class="fas fa-shield-halved"></i><span>Controls what each user can do</span></li>
                    </ul>

                </div>

            </aside>

        </div>


    </app-page-canvas>

</div>



<!-- =====================================================
     UTILITIES
====================================================== -->

<app-toast></app-toast>

<app-confirm-dialog></app-confirm-dialog>

<div class="app-form-page">
    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <app-page-header
        icon="fas fa-user-shield"
        [title]="pageTitle"
        subtitle="Manage activity assignments.">
        <div
            pageHeaderCenter
            class="activity-header-center">
            <app-record-counter
                [sections]="recordCounterSections"
                [compact]="true">
            </app-record-counter>
            <app-search-box
                class="activity-header-search"
                placeholder="Search menu or sub menu..."
                [value]="activitySearchText"
                [disabled]="loading"
                (search)="onActivitySearch($event)">
            </app-search-box>
        </div>
        <app-command-center
            pageHeaderRight
            [command1Text]="saveButtonText"
            command1Icon="fas fa-floppy-disk"
            (command1Click)="onSave()"
            [command1Visible]="
                mode === 'add'
                    ? canAdd
                    : canUpdate
            "
            command2Text="Clear"
            command2Icon="fas fa-broom"
            (command2Click)="onClear()"
            [command2Visible]="!isViewMode"
            [command3Visible]="false"
            rightCommandIcon="fas fa-arrow-left"
            (rightCommandClick)="onBackToList()">
        </app-command-center>
    </app-page-header>

    <app-page-toolbar
        leftFlex="0 0 420px"
        rightFlex="1 1 auto">
        <div
            pageToolbarLeft
            class="activity-toolbar-left">
            <app-control-tabs
                [tabs]="tabs"
                [(selectedTab)]="selectedTab"
                (selectedTabChange)="onTabChange($event)">
            </app-control-tabs>
        </div>

        <div
            pageToolbarRight
            class="activity-toolbar-right">
            <app-search-dropdown
                placeholder="Select Role Profile"
                [items]="roleProfiles"
                labelField="displayName"
                valueField="roleProfileId"
                [disabled]="
                    isViewMode
                    ||
                    isRoleProfileLocked
                "
                [(value)]="selectedRoleProfileId"
                (valueChange)="onRoleProfileChanged($event)">
            </app-search-dropdown>

            <app-search-dropdown
                placeholder="Select Module"
                [items]="modules"
                labelField="name"
                valueField="id"
                [disabled]="isViewMode"
                [(value)]="selectedModuleId"
                (valueChange)="onModuleChanged($event)">
            </app-search-dropdown>

            <app-search-dropdown
                placeholder="Select Menu"
                [items]="menus"
                labelField="name"
                valueField="id"
                [disabled]="
                    isViewMode
                    ||
                    selectedModuleId == null
                    ||
                    selectedModuleId === 0
                "
                [(value)]="selectedMenuId"
                (valueChange)="onMenuChanged($event)">
            </app-search-dropdown>

            <app-search-dropdown
                placeholder="Select Sub Menu"
                [items]="subMenus"
                labelField="name"
                valueField="id"
                [disabled]="
                    isViewMode
                    ||
                    selectedMenuId == null
                    ||
                    selectedModuleId === 0
                    ||
                    selectedMenuId === 0
                "
                [(value)]="selectedSubMenuId"
                (valueChange)="onSubMenuChanged($event)">
            </app-search-dropdown>

            <button
                *ngIf="canAdd"
                type="button"
                class="activity-add-button"
                [disabled]="addDisabled"
                (click)="onAddSelection()">
                <i class="fas fa-plus"></i>
                <span>Add</span>
            </button>

            <button
                type="button"
                class="activity-reset-button"
                [disabled]="
                    isViewMode
                    ||
                    itemCartRows.length === 0
                "
                (click)="onResetSelection()">
                <i class="fas fa-arrows-rotate"></i>
                <span>Reset</span>
            </button>
        </div>
    </app-page-toolbar>

    <app-page-canvas [config]="canvasConfig">
        <ng-container canvasBody>
            <app-item-cart
                [columns]="itemCartColumns"
                [rows]="pagedItemCartRows"
                [serialOffset]="
                    (currentPage - 1) * pageSize
                "
                [loading]="loading"
                [orbitLoading]="orbitLoading"
                [error]="loadFailed"
                [readOnly]="isViewMode"
                [headerCheckboxStates]="headerCheckboxStates"
                (headerCheckboxStateChange)="
                    onHeaderCheckboxStateChanged($event)
                "
                (remove)="onRemoveItem($event)"
                (activityChanged)="onActivityChanged()">
            </app-item-cart>
        </ng-container>

        <ng-container canvasFooter>
            <app-pagination
                [totalRecords]="itemCartRows.length"
                [currentPage]="currentPage"
                [pageSize]="pageSize"
                (pageChange)="onPageChange($event)"
                (pageSizeChange)="onPageSizeChange($event)">
            </app-pagination>
        </ng-container>
    </app-page-canvas>
</div>

<app-toast></app-toast>
<app-confirm-dialog></app-confirm-dialog>
<app-progress-dialog></app-progress-dialog>

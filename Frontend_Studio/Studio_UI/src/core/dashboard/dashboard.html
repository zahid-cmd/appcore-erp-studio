<!-- ===========================================================
     DASHBOARD HOST
=========================================================== -->

<div class="dashboard">


    <!-- =======================================================
         DASHBOARD HEADER
         -------------------------------------------------------
         FIXED — NEVER SCROLLS
    ======================================================== -->

    <app-page-header

        title="Dashboard"

        subtitle="Welcome back. Here's what's happening across your ERP."

        icon="fas fa-gauge-high">


        <!-- ===================================================
             DASHBOARD ACTIONS
        ==================================================== -->

        <div pageHeaderRight>

            <app-command-center

                [command1Text]="
                    isCustomizeMode
                        ? 'Done'
                        : 'Customize'
                "

                [command1Icon]="
                    isCustomizeMode
                        ? 'fas fa-check'
                        : 'fas fa-sliders'
                "

                [command1Visible]="true"

                (command1Click)="
                    toggleCustomizeMode()
                "

                [command2Text]="'Refresh'"

                [command2Icon]="'fas fa-rotate-right'"

                [command2Visible]="true"

                (command2Click)="
                    refreshDashboard()
                ">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =======================================================
         DASHBOARD SCROLL VIEWPORT
         -------------------------------------------------------
         ONLY THIS AREA SCROLLS.
    ======================================================== -->

    <div class="dashboard-scroll-wrapper appcore-scrollbar">


        <!-- ===================================================
             DASHBOARD CONTENT
        ==================================================== -->

        <div class="dashboard-content">


            <!-- ===============================================
                 ORBIT LOADER
                 -----------------------------------------------
                 APPCORE STANDARD LOADER
            ================================================= -->

            <app-orbit-loader

                *ngIf="isLoading"

                title="Loading Dashboard"

                message="Preparing your dashboard widgets."

                size="medium"

                [showMessage]="true"

                [overlay]="false">

            </app-orbit-loader>



            <!-- ===============================================
                 LOAD FAILURE
                 -----------------------------------------------
                 APPCORE SHARED EMPTY STATE
            ================================================= -->

            <app-empty-state

                *ngIf="
                    !isLoading &&
                    loadFailed
                "

                icon="fas fa-triangle-exclamation"

                title="Dashboard Could Not Be Loaded"

                subtitle="The dashboard could not be loaded at this time."

                actionText="Retry"

                [showAction]="true"

                (action)="
                    retryDashboard()
                ">

            </app-empty-state>



            <!-- ===============================================
                 DASHBOARD WIDGET AREA
            ================================================ -->

            <ng-container

                *ngIf="
                    !isLoading &&
                    !loadFailed
                ">


                <!-- ===========================================
                     EMPTY DASHBOARD
                ============================================ -->

                <div

                    class="dashboard-empty"

                    *ngIf="
                        visibleWidgets.length === 0
                    ">


                    <div class="dashboard-empty-icon">

                        <i
                            class="fas fa-gauge-high">
                        </i>

                    </div>


                    <div class="dashboard-empty-title">

                        No Dashboard Widgets

                    </div>


                    <div class="dashboard-empty-text">

                        No widgets are currently configured for this dashboard.

                    </div>


                </div>



                <!-- ===========================================
                     WIDGET GRID
                ============================================ -->

                <div

                    class="dashboard-widget-grid"

                    *ngIf="
                        visibleWidgets.length > 0
                    ">


                    <!-- =======================================
                         CONFIGURED WIDGETS
                    ======================================== -->

                    <ng-container

                        *ngFor="
                            let widget of visibleWidgets;
                            trackBy: trackByWidgetId
                        ">


                        <!-- ===================================
                             DASHBOARD WIDGET
                        ==================================== -->

                        <div

                            class="dashboard-widget"

                            [style.grid-column]="
                                'span ' +
                                widget.columnSpan
                            "

                            [class.dashboard-widget-small]="
                                widget.size === 'small'
                            "

                            [class.dashboard-widget-medium]="
                                widget.size === 'medium'
                            "

                            [class.dashboard-widget-large]="
                                widget.size === 'large'
                            ">


                            <!-- =============================
                                 WIDGET CONTENT
                            ============================== -->

                            <div

                                class="dashboard-widget-content">


                                <app-component-renderer

                                    [componentKey]="
                                        widget.componentKey
                                    ">

                                </app-component-renderer>


                            </div>


                        </div>


                    </ng-container>


                </div>


            </ng-container>


        </div>


    </div>


</div>

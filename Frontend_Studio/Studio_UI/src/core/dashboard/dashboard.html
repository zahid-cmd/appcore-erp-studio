<!-- ===========================================================
     DASHBOARD HOST
=========================================================== -->

<div class="dashboard">


    <!-- =======================================================
         DASHBOARD HEADER
         -------------------------------------------------------
         FIXED — NEVER SCROLLS
    ======================================================== -->

    <app-page-header

        title="Dashboard"

        subtitle="Welcome back. Here's what's happening across your ERP."

        icon="fas fa-gauge-high">


        <!-- ===================================================
             DASHBOARD ACTIONS
        ==================================================== -->

        <div pageHeaderRight>

            <app-command-center

                [command1Text]="
                    isCustomizeMode
                        ? 'Done'
                        : 'Customize'
                "

                [command1Icon]="
                    isCustomizeMode
                        ? 'fas fa-check'
                        : 'fas fa-sliders'
                "

                [command1Visible]="true"

                (command1Click)="
                    toggleCustomizeMode()
                "

                [command2Text]="'Refresh'"

                [command2Icon]="'fas fa-rotate-right'"

                [command2Visible]="true"

                (command2Click)="
                    refreshDashboard()
                ">

            </app-command-center>

        </div>

    </app-page-header>



    <!-- =======================================================
         DASHBOARD SCROLL VIEWPORT
         -------------------------------------------------------
         ONLY THIS AREA SCROLLS.
    ======================================================== -->

    <div class="dashboard-scroll-wrapper appcore-scrollbar">


        <!-- ===================================================
             DASHBOARD CONTENT
        ==================================================== -->

        <div class="dashboard-content">


            <!-- ===============================================
                 LOADING STATE
            ================================================ -->

            <div
                class="dashboard-state"
                *ngIf="isLoading">

                <div class="dashboard-state-icon">

                    <i class="fas fa-spinner fa-spin"></i>

                </div>

                <div class="dashboard-state-title">

                    Loading Dashboard

                </div>

                <div class="dashboard-state-text">

                    Preparing your dashboard widgets.

                </div>

            </div>



            <!-- ===============================================
                 LOAD FAILURE
            ================================================ -->

            <div
                class="dashboard-state dashboard-load-failed"
                *ngIf="
                    !isLoading &&
                    loadFailed
                ">

                <div class="dashboard-state-icon">

                    <i class="fas fa-triangle-exclamation"></i>

                </div>

                <div class="dashboard-state-title">

                    Dashboard Could Not Be Loaded

                </div>

                <div class="dashboard-state-text">

                    The dashboard could not be loaded at this time.

                </div>

                <button
                    type="button"
                    class="dashboard-state-button"
                    (click)="refreshDashboard()">

                    <i class="fas fa-rotate-right"></i>

                    Retry

                </button>

            </div>



            <!-- ===============================================
                 DASHBOARD WIDGET AREA
            ================================================ -->

            <ng-container
                *ngIf="
                    !isLoading &&
                    !loadFailed
                ">


                <!-- ===========================================
                     EMPTY DASHBOARD
                ============================================ -->

                <div
                    class="dashboard-empty"
                    *ngIf="
                        visibleWidgets.length === 0
                    ">

                    <div class="dashboard-empty-icon">

                        <i class="fas fa-gauge-high"></i>

                    </div>

                    <div class="dashboard-empty-title">

                        No Dashboard Widgets

                    </div>

                    <div class="dashboard-empty-text">

                        No widgets are currently configured for this dashboard.

                    </div>

                </div>



                <!-- ===========================================
                     WIDGET GRID
                ============================================ -->

                <div
                    class="dashboard-widget-grid"
                    *ngIf="
                        visibleWidgets.length > 0
                    ">


                    <!-- =======================================
                         CONFIGURED WIDGETS
                    ======================================== -->

                    <ng-container
                        *ngFor="
                            let widget of visibleWidgets;
                            trackBy: trackByWidgetId
                        ">


                        <!-- ===================================
                             DASHBOARD WIDGET
                        ==================================== -->

                        <div

                            class="dashboard-widget"

                            [style.grid-column]="
                                'span ' +
                                widget.columnSpan
                            "

                            [class.dashboard-widget-small]="
                                widget.size === 'small'
                            "

                            [class.dashboard-widget-medium]="
                                widget.size === 'medium'
                            "

                            [class.dashboard-widget-large]="
                                widget.size === 'large'
                            ">


                            <!-- =============================
                                 WIDGET CONTENT
                            ============================== -->

                            <div
                                class="dashboard-widget-content">


                                <app-component-renderer

                                    [componentKey]="
                                        widget.componentKey
                                    ">

                                </app-component-renderer>


                            </div>


                        </div>


                    </ng-container>


                </div>


            </ng-container>


        </div>


    </div>


</div>

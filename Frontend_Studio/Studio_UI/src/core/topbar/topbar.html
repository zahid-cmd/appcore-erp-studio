<!-- =====================================================
     TOPBAR
     -----------------------------------------------------
     Left    logo block (same width as the sidebar) and
             sidebar toggle
     Center  page search (Ctrl K) and Branch / FY chips
     Right   Light / Deep and Side / Top switches, clock,
             notifications, profile
===================================================== -->

<div class="topbar">


    <!-- =================================================
         LEFT
    ================================================== -->

    <div class="topbar-left">

        <app-topbar-header>
        </app-topbar-header>

    </div>



    <!-- =================================================
         CENTER
    ================================================== -->

    <div class="topbar-center">

        <app-topbar-search>
        </app-topbar-search>

        <app-topbar-context>
        </app-topbar-context>

    </div>



    <!-- =================================================
         RIGHT
    ================================================== -->

    <div class="topbar-right">

        <app-topbar-switches>
        </app-topbar-switches>

        <!-- Website : the company's public website in a new tab -->
        <a
            class="site-button"
            href="/"
            target="_blank"
            rel="noopener"
            aria-label="Website"
            data-tip="Website">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg>
        </a>

        <!-- Calculator (Alt C) : opens the floating window -->

        <app-topbar-calculator>
        </app-topbar-calculator>

        <app-topbar-actions
            (profileClick)="onProfileClick()"
            (changePasswordClick)="onChangePasswordClick()">
        </app-topbar-actions>

    </div>


</div>



<!-- =====================================================
     CONFIRMATION DIALOG
     -----------------------------------------------------
     The only confirm dialog in the shell (Change Password
     and Logout both use it). Kept outside the Topbar flex
     container so it cannot move the Topbar items.
===================================================== -->

<app-confirm-dialog>
</app-confirm-dialog>



<!-- =====================================================
     CHANGE PASSWORD
     -----------------------------------------------------
     changePasswordMounted : component lifetime
     changePasswordOpened  : panel visibility

     The component stays mounted while its confirmation
     dialog is shown, so Cancel brings the same form back
     with the values already typed.
===================================================== -->

<app-change-password
    *ngIf="changePasswordMounted"
    [visible]="
        changePasswordOpened
    "
    (close)="
        onChangePasswordClose()
    "
    (reopen)="
        onChangePasswordReopen()
    "
    (update)="
        onChangePasswordUpdate()
    ">
</app-change-password>

<!--===========================================================
    Login Page Loader
    -----------------------------------------------------------
    RESPONSIBILITIES:

        - Normal Active Login Page loading
        - Selected Login Page Preview loading
        - Login Page 1
        - Login Page 2
        - Login Page 3
        - Login Page 4
        - Login Page 5

    MODES:

        NORMAL MODE:

            Loads the currently active Login Page.

        PREVIEW MODE:

            Loads the Login Page selected by the route:

                /preview/1
                /preview/2
                /preview/3
                /preview/4
                /preview/5

            The TypeScript component determines the
            activePageKey.

    IMPORTANT:

        The Login Page Loader does NOT contain:

            - Application Topbar
            - Application Sidebar
            - Application Footer
            - Login Page Previewer

        The selected Login Page is rendered directly by
        this Loader.

    IMPORTANT:

        Only ONE Login Page is rendered at a time.

        The activePageKey determines which Login Page
        component is displayed.
============================================================-->


<div
    class="login-page-loader"
>


    <!--===========================================================
        Orbit Loader
        -----------------------------------------------------------
        Displays while the Login Page configuration is being
        resolved.

        This works for both:

            - Normal Active Login Page mode
            - Preview mode
    ============================================================-->

    <app-orbit-loader
        *ngIf="isLoading"

        title="Loading Login Page"

        message="Please wait while the login page is being loaded."

        size="medium"

        [showMessage]="true"

        [overlay]="false"
    >
    </app-orbit-loader>



    <!--===========================================================
        Toast
        -----------------------------------------------------------
        Page-level Toast component.

        ToastService controls the actual toast items.
    ============================================================-->

    <app-toast>
    </app-toast>



    <!--===========================================================
        Empty State
        -----------------------------------------------------------
        Displays when:

            - Active Login Page cannot be loaded
            - Requested Preview Login Page is invalid
            - Login Page configuration cannot be resolved
    ============================================================-->

    <app-empty-state
        *ngIf="
            !isLoading
            &&
            loadError
        "

        icon="fas fa-exclamation-triangle"

        title="Login Page Could Not Be Loaded"

        [subtitle]="loadError"

        actionText="Retry"

        [showAction]="true"

        (action)="onRetry()"
    >
    </app-empty-state>



    <!--===========================================================
        Login Page 1
        -----------------------------------------------------------
        Rendered when:

            activePageKey === 'login-page-1'

        Preview:

            /preview/1
    ============================================================-->

    <app-login-page-1
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-1'
        "
    >
    </app-login-page-1>



    <!--===========================================================
        Login Page 2
        -----------------------------------------------------------
        Rendered when:

            activePageKey === 'login-page-2'

        Preview:

            /preview/2
    ============================================================-->

    <app-login-page-2
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-2'
        "
    >
    </app-login-page-2>



    <!--===========================================================
        Login Page 3
        -----------------------------------------------------------
        Rendered when:

            activePageKey === 'login-page-3'

        Preview:

            /preview/3
    ============================================================-->

    <app-login-page-3
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-3'
        "
    >
    </app-login-page-3>



    <!--===========================================================
        Login Page 4
        -----------------------------------------------------------
        Rendered when:

            activePageKey === 'login-page-4'

        Preview:

            /preview/4
    ============================================================-->

    <app-login-page-4
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-4'
        "
    >
    </app-login-page-4>



    <!--===========================================================
        Login Page 5
        -----------------------------------------------------------
        Rendered when:

            activePageKey === 'login-page-5'

        Preview:

            /preview/5
    ============================================================-->

    <app-login-page-5
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-5'
        "
    >
    </app-login-page-5>


</div>

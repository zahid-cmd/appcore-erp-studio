<!--===========================================================
    Login Page Loader
============================================================-->

<div
    class="login-page-loader"
>


    <!--===========================================================
        Orbit Loader
        -----------------------------------------------------------
        Displays while the active Login Page configuration is
        being loaded.
    ============================================================-->

    <app-orbit-loader
        *ngIf="isLoading"

        title="Loading Login Page"

        message="Please wait while the login page is being loaded."

        size="medium"

        [showMessage]="true"

        [overlay]="false"
    >
    </app-orbit-loader>



    <!--===========================================================
        Toast
        -----------------------------------------------------------
        Page-level Toast component.

        ToastService controls the actual toast items.
    ============================================================-->

    <app-toast>
    </app-toast>



    <!--===========================================================
        Empty State
        -----------------------------------------------------------
        Displays when the active Login Page configuration cannot
        be loaded or is invalid.
    ============================================================-->

    <app-empty-state
        *ngIf="
            !isLoading
            &&
            loadError
        "

        icon="fas fa-exclamation-triangle"

        title="Login Page Could Not Be Loaded"

        [subtitle]="loadError"

        actionText="Retry"

        [showAction]="true"

        (action)="onRetry()"
    >
    </app-empty-state>



    <!--===========================================================
        Login Page 1
    ============================================================-->

    <app-login-page-1
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-1'
        "
    >
    </app-login-page-1>



    <!--===========================================================
        Login Page 2
    ============================================================-->

    <app-login-page-2
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-2'
        "
    >
    </app-login-page-2>



    <!--===========================================================
        Login Page 3
    ============================================================-->

    <app-login-page-3
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-3'
        "
    >
    </app-login-page-3>



    <!--===========================================================
        Login Page 4
    ============================================================-->

    <app-login-page-4
        *ngIf="
            !isLoading
            &&
            !loadError
            &&
            activePageKey === 'login-page-4'
        "
    >
    </app-login-page-4>


</div>

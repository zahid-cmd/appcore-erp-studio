<div
    class="layout"
    [class.sidebar-is-collapsed]="isSidebarCollapsed"
    [class.layout-top]="layoutMode() === 'top'"
    [class.appearance-light]="appearance() === 'light'"
    [style.--sidebar-width]="sidebarFitWidth()">


    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <app-topbar>
    </app-topbar>



    <!-- =====================================================
         TOP NAVIGATION (Top layout only)
    ====================================================== -->

    @if (layoutMode() === 'top')
    {
        <app-topbar-nav>
        </app-topbar-nav>
    }



    <!-- =====================================================
         LAYOUT BODY
    ====================================================== -->

    <div class="layout-body">


        <!-- =================================================
             SIDEBAR
             (kept loaded in Top layout, only hidden: it
             feeds the page list, active page and favorites)
        ================================================== -->

        <app-sidebar
            [class.sidebar-collapsed]="isSidebarCollapsed">
        </app-sidebar>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <main class="content">


            <!-- =============================================
                 BREADCRUMB
            ============================================== -->

            <app-breadcrumb
                *ngIf="!isDashboard">
            </app-breadcrumb>



            <!-- =============================================
                 ROUTED PAGE
            ============================================== -->

            <router-outlet>
            </router-outlet>


        </main>


    </div>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <app-footer
        (aboutClick)="openAbout()">
    </app-footer>



    <!-- =====================================================
         ABOUT APPCORE
    ====================================================== -->

    <app-about-appcore
        [visible]="showAbout"
        (close)="closeAbout()">
    </app-about-appcore>



    <!-- =====================================================
         CALCULATOR (floating, opened from the top bar)
    ====================================================== -->

    <app-calculator-window>
    </app-calculator-window>

    <!-- =====================================================
         GLOBAL TOAST
    ====================================================== -->

    <app-toast>
    </app-toast>


</div>

<!-- ==========================================================
     APP FOOTER
     ----------------------------------------------------------
     Version | Server status | Session time left
     © copyright                          About · brand
=========================================================== -->

<div class="footer">


    <!-- ======================================================
         VERSION (same width as the sidebar)
    ======================================================= -->

    <app-footer-version>
    </app-footer-version>



    <!-- ======================================================
         STATUS
    ======================================================= -->

    <div class="footer-status">


        <!-- SERVER -->

        <span
            class="status-item server"
            [class.online]="server().state === 'online'"
            [class.degraded]="server().state === 'degraded'"
            [class.offline]="server().state === 'offline'"
            [title]="serverTitle()"
            role="status">

            <span class="status-dot"></span>

            <b class="status-value">
                {{ serverLabel() }}
            </b>

            @if (server().state === 'online' && server().responseMs !== null)
            {
                <span class="status-muted">
                    · {{ server().responseMs }} ms
                </span>
            }

        </span>



        <!-- SESSION -->

        @if (sessionLeft() !== null)
        {
            <span class="status-divider"></span>

            <span
                class="status-item session"
                [class.warning]="sessionWarning()"
                [title]="sessionTitle()">

                <i class="fa-regular fa-clock"></i>

                <span class="status-muted">Session</span>

                <b class="status-value numeric">
                    {{ sessionLabel() }}
                </b>

                <span class="status-muted">left</span>

            </span>
        }


    </div>



    <!-- ======================================================
         COPYRIGHT
    ======================================================= -->

    <div class="footer-center">

        <span class="footer-copyright">
            © {{ year }} AppCore Technologies
        </span>

    </div>



    <!-- ======================================================
         ABOUT · BRAND
    ======================================================= -->

    <div class="footer-right">

        <app-footer-brand
            (aboutClick)="openAbout()">
        </app-footer-brand>

    </div>


</div>

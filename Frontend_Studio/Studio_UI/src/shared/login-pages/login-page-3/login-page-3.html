<!-- ===========================================================
     LOGIN PAGE 3 ROOT
============================================================ -->

<div
    class="login-page-3"
>


    <!-- =======================================================
         PAGE-LEVEL BACKGROUND IMAGE
         -------------------------------------------------------
         Background Image 3 is loaded by LoginPage3.ts from:

             Sub Ordinate Component ID = 3

         The current image is selected according to:

             isLightTheme = true
                 → Light Background Image 3

             isLightTheme = false
                 → Deep Background Image 3

         The background consumes NO layout-grid space.
    ======================================================== -->

    <div
        class="login-page-3-background"

        [style.background-image]="
            currentBackgroundImageUrl
                ? 'url(' + currentBackgroundImageUrl + ')'
                : ''
        "
    >
    </div>


    <!-- =======================================================
         PAGE-LEVEL NOTIFICATION PANEL
         -------------------------------------------------------
         This component remains completely independent from
         the Login Page 3 desktop layout.

         It consumes NO physical layout space.

         Its own CSS controls:

             - Notification Button
             - Unread Counter
             - Notification Popover
             - Floating Position

         #notificationPanel provides the explicit template
         reference used by LoginPage3 @ViewChild.
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         MAIN DESKTOP LAYOUT
         -------------------------------------------------------
         FULL WIDTH:

             LEFT   = 35%
             CENTER = 45%
             RIGHT  = 20%

         COMPONENT LOCATIONS:

             LEFT:

                 Theme Selector
                 Login / Registration / Forget Password

             CENTER:

                 Branding

             RIGHT:

                 Powered By

         Notification Panel remains PAGE LEVEL / FLOATING.

         Login Page 3 does NOT render:

             - Promotional Image
             - Client Logo
    ======================================================== -->

    <main
        class="login-page-3-layout"
    >


        <!-- ===================================================
             LEFT AREA
             ---------------------------------------------------
             WIDTH:

                 35%

             VERTICAL STRUCTURE:

                 TOP    = 30px
                 CENTER = REST
                 BOTTOM = 30px

             CONTENT:

                 Theme Selector

                 Login /
                 Registration /
                 Forget Password
        ==================================================== -->

        <section
            class="login-page-3-left-area"
        >


            <!-- ===============================================
                 LEFT TOP
                 -----------------------------------------------
                 HEIGHT:

                     30px

                 CONTENT:

                     THEME SELECTOR

                 Theme state is owned by Login Page 3.

                 true:

                     Light Theme

                 false:

                     Deep Theme
            ================================================= -->

            <section
                class="login-page-3-left-top"
            >

                <!-- ===========================================
                     LOGIN PAGE 3 THEME SELECTOR
                     -------------------------------------------
                     Login Page 3 owns:

                         isLightTheme

                     Theme Selector emits:

                         themeChange
                ============================================ -->

                <app-login-page-theme-selector
                    [isLightTheme]="isLightTheme"

                    (themeChange)="
                        onThemeChange($event)
                    "
                >
                </app-login-page-theme-selector>

            </section>


            <!-- ===============================================
                 LEFT CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REMAINING HEIGHT

                 CONTENT:

                     LOGIN /
                     REGISTRATION /
                     FORGET PASSWORD
            ================================================= -->

            <section
                class="login-page-3-left-center"
            >


                <!-- ===========================================
                     LOGIN PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = false

                         AND

                         isForgetPasswordMode = false

                     Authentication is completely handled
                     internally by the Login Panel.
                ============================================ -->

                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="
                        onRegister()
                    "

                    (forgotPassword)="
                        onForgotPassword()
                    "
                >
                </app-login-page-login-panel>


                <!-- ===========================================
                     REGISTRATION PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = true
                ============================================ -->

                <app-login-page-registration-panel
                    *ngIf="
                        isRegistrationMode
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-registration-panel>


                <!-- ===========================================
                     FORGET PASSWORD PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isForgetPasswordMode = true

                     SUCCESS:

                         passwordResetSuccess is emitted.

                         Login Page 3 then:

                             1. Returns to Login Panel.
                             2. Creates Password Changed
                                notification.
                             3. Leaves notification unread.
                             4. Opens Notification Panel.
                             5. Keeps it open for 5 seconds.
                             6. Closes automatically.
                             7. Leaves unread counter visible.
                ============================================ -->

                <app-login-page-forget-password-panel
                    *ngIf="
                        isForgetPasswordMode
                    "

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 LEFT BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     30px

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-3-left-bottom"
            >
            </section>


        </section>


        <!-- ===================================================
             CENTER AREA
             ---------------------------------------------------
             WIDTH:

                 45%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = 70%
                 BOTTOM = 15%

             CONTENT:

                 BRANDING

             Branding remains intrinsically sized.
        ==================================================== -->

        <section
            class="login-page-3-middle-area"
        >


            <!-- ===============================================
                 MIDDLE TOP
                 -----------------------------------------------
                 BRANDING AREA
            ================================================= -->

            <section
                class="login-page-3-middle-top"
            >

                <!-- ===========================================
                     BRANDING
                     -------------------------------------------
                     Branding controls its own intrinsic:

                         width
                         height
                         opacity
                         object-fit

                     Login Page 3 controls only its position.
                ============================================ -->

            </section>


            <!-- ===============================================
                 MIDDLE CENTER
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-middle-center"
            >
            </section>


            <!-- ===============================================
                 MIDDLE BOTTOM
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-middle-bottom"
            >
                <app-login-page-powered-by>
                </app-login-page-powered-by>
            </section>


        </section>


        <!-- ===================================================
             RIGHT AREA
             ---------------------------------------------------
             WIDTH:

                 20%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = 70%
                 BOTTOM = 15%

             CONTENT:

                 POWERED BY
        ==================================================== -->

        <section
            class="login-page-3-right-area"
        >


            <!-- ===============================================
                 RIGHT TOP
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-right-top"
            >
                <app-login-page-branding>
                </app-login-page-branding>
            </section>


            <!-- ===============================================
                 RIGHT CENTER
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-right-center"
            >
            </section>


            <!-- ===============================================
                 RIGHT BOTTOM
                 -----------------------------------------------
                 POWERED BY

                 Positioned from the LEFT edge of the
                 20% Right Bottom area.
            ================================================= -->

            <section
                class="login-page-3-right-bottom"
            >

                <!-- ===========================================
                     POWERED BY
                     -------------------------------------------
                     Powered By controls its own intrinsic
                     dimensions.

                     Login Page 3 controls only its position.
                ============================================ -->


            </section>


        </section>


    </main>


</div>

<!-- ===========================================================
     LOGIN PAGE 3
     -----------------------------------------------------------
     FINAL DESKTOP PAGE COMPOSITION

     FULL VIEWPORT

     │
     ├── FLOATING NOTIFICATION CONTROL
     │   └── Notification Button + Counter + Popover
     │
     ├── LEFT 35%
     │   ├── TOP 30px
     │   │   └── THEME SELECTOR
     │   │
     │   ├── CENTER
     │   │   ├── LOGIN PANEL
     │   │   ├── REGISTRATION PANEL
     │   │   └── FORGET PASSWORD PANEL
     │   │
     │   └── BOTTOM 30px
     │       └── EMPTY
     │
     ├── MIDDLE 20%
     │   ├── TOP
     │   │   └── BRANDING
     │   │
     │   ├── CENTER
     │   │   └── EMPTY
     │   │
     │   └── BOTTOM
     │       └── POWERED BY
     │
     └── RIGHT 45%
         ├── TOP 15%
         │   └── EMPTY
         │
         ├── CENTER
         │   └── EMPTY
         │
         └── BOTTOM 15%
             └── EMPTY

     IMPORTANT:

         This page is intentionally mirrored horizontally
         compared with Login Page 2.

         LEFT  ↔  RIGHT

         The Notification Panel is completely independent
         from the desktop layout.

         It consumes NO physical layout space.

         The promotional image remains completely independent
         from the desktop layout.

         BRANDING IS IN THE MIDDLE 20% AREA.

         POWERED BY IS CURRENTLY IN THE MIDDLE BOTTOM AREA.

         Theme Selector controls:

             LIGHT
                 ↓
             Promotional Image Light

             DEEP
                 ↓
             Promotional Image Deep

         This version is DESKTOP ONLY.

         Tablet and mobile layouts will be implemented later.

         REGISTER NOW EVENT:

             Login Panel emits the register event.

             This page receives the event through onRegister().

             isRegistrationMode becomes TRUE.

             Login Panel is hidden.

             Registration Panel is displayed.

         FORGOT PASSWORD EVENT:

             Login Panel emits the forgotPassword event.

             This page receives the event through onForgotPassword().

             isForgetPasswordMode becomes TRUE.

             Login Panel is hidden.

             Forget Password Panel is displayed.

         PASSWORD RESET SUCCESS EVENT:

             Forget Password Panel emits the
             passwordResetSuccess event.

             This page receives the event through
             onPasswordResetSuccess().

             The Notification Panel receives:

                 Password Changed

             The notification remains unread.

             The Notification Panel automatically opens
             for 5 seconds.

             The Notification Panel then closes automatically.

             The unread counter remains visible.

             The Forget Password Panel is immediately replaced
             by the Login Panel.

             The notification becomes read only when the user
             manually opens/interacts with the Notification Panel.

         BACK TO LOGIN EVENT:

             Registration Panel or Forget Password Panel emits
             the backToLogin event.

             This page receives the event through
             onBackToLogin().

             Both panel states become FALSE.

             Login Panel is displayed.

         THEME CHANGE EVENT:

             Theme Selector emits themeChange.

             This page receives the event through
             onThemeChange().

             isLightTheme becomes TRUE or FALSE.

             Promotional Image changes accordingly.
============================================================ -->


<!-- ===========================================================
     LOGIN PAGE 3
============================================================ -->

<div
    class="login-page-3"
>


    <!-- =======================================================
         FLOATING NOTIFICATION PANEL
         -------------------------------------------------------
         PAGE-LEVEL COMPONENT

         IMPORTANT:

             This component is intentionally outside the
             35% / 20% / 45% desktop layout.

             It does NOT belong to:

                 - Login Panel
                 - Registration Panel
                 - Forget Password Panel
                 - Left Area
                 - Middle Area
                 - Right Area

             It consumes NO physical layout space.

             Its own CSS controls its fixed position.

             #notificationPanel provides an explicit template
             reference for the Login Page 3 @ViewChild.
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         PROMOTIONAL IMAGE AREA
         -------------------------------------------------------
         FULL VIEWPORT BACKGROUND

         This layer remains completely independent from the
         35% / 20% / 45% desktop layout.
    ======================================================== -->

    <section
        class="login-page-3-promotional-area"
    >

        <!-- ===================================================
             LIGHT PROMOTIONAL IMAGE
             ---------------------------------------------------
             DISPLAYED WHEN:

                 isLightTheme = true
        ==================================================== -->

        <app-login-page-promotional-image-light
            *ngIf="isLightTheme"
        >
        </app-login-page-promotional-image-light>


        <!-- ===================================================
             DEEP PROMOTIONAL IMAGE
             ---------------------------------------------------
             DISPLAYED WHEN:

                 isLightTheme = false
        ==================================================== -->

        <app-login-page-promotional-image-deep
            *ngIf="!isLightTheme"
        >
        </app-login-page-promotional-image-deep>

    </section>


    <!-- =======================================================
         MAIN DESKTOP LAYOUT
         -------------------------------------------------------
         MIRRORED STRUCTURE

             LEFT   = 35%
             MIDDLE = 20%
             RIGHT  = 45%

         IMPORTANT:

             Notification Panel is NOT inside this layout.

             Therefore it cannot affect the
             35% / 20% / 45% dimensions.
    ======================================================== -->

    <main
        class="login-page-3-layout"
    >


        <!-- ===================================================
             LEFT AREA
             ---------------------------------------------------
             WIDTH:

                 35%

             CONTENT:

                 Theme Selector
                 Login / Registration / Forget Password
        ==================================================== -->

        <section
            class="login-page-3-left-area"
        >


            <!-- ===============================================
                 LEFT TOP
                 -----------------------------------------------
                 HEIGHT:

                     30px

                 CONTENT:

                     THEME SELECTOR
            ================================================= -->

            <section
                class="login-page-3-left-top"
            >

                <app-login-page-theme-selector
                    [isLightTheme]="isLightTheme"
                    (themeChange)="onThemeChange($event)"
                >
                </app-login-page-theme-selector>

            </section>


            <!-- ===============================================
                 LEFT CENTER
                 -----------------------------------------------
                 CONTENT:

                     LOGIN /
                     REGISTRATION /
                     FORGET PASSWORD
            ================================================= -->

            <section
                class="login-page-3-left-center"
            >


                <!-- ===========================================
                     LOGIN PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = false

                         AND

                         isForgetPasswordMode = false
                ============================================ -->

                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="onRegister()"

                    (forgotPassword)="onForgotPassword()"

                    (signIn)="onSignIn($event)"
                >
                </app-login-page-login-panel>


                <!-- ===========================================
                     REGISTRATION PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = true
                ============================================ -->

                <app-login-page-registration-panel
                    *ngIf="isRegistrationMode"

                    (backToLogin)="onBackToLogin()"
                >
                </app-login-page-registration-panel>


                <!-- ===========================================
                     FORGET PASSWORD PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isForgetPasswordMode = true

                     SUCCESS:

                         passwordResetSuccess is emitted by
                         the Forget Password Panel.

                         onPasswordResetSuccess() then:

                             1. Returns to Login Panel.
                             2. Creates Password Changed
                                notification.
                             3. Keeps notification unread.
                             4. Opens Notification Panel
                                automatically.
                             5. Keeps it open for 5 seconds.
                             6. Closes automatically.
                             7. Leaves unread counter visible.
                ============================================ -->

                <app-login-page-forget-password-panel
                    *ngIf="isForgetPasswordMode"

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 LEFT BOTTOM
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-left-bottom"
            >

            </section>


        </section>


        <!-- ===================================================
             MIDDLE AREA
             ---------------------------------------------------
             WIDTH:

                 20%

             CONTENT:

                 BRANDING
                 POWERED BY

             Current component placement is preserved.
        ==================================================== -->

        <section
            class="login-page-3-middle-area"
        >


            <!-- ===============================================
                 MIDDLE TOP
                 -----------------------------------------------
                 CONTENT:

                     BRANDING
            ================================================= -->

            <section
                class="login-page-3-middle-top"
            >

                <app-login-page-branding>
                </app-login-page-branding>

            </section>


            <!-- ===============================================
                 MIDDLE CENTER
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-middle-center"
            >

            </section>


            <!-- ===============================================
                 MIDDLE BOTTOM
                 -----------------------------------------------
                 CONTENT:

                     POWERED BY
            ================================================= -->

            <section
                class="login-page-3-middle-bottom"
            >

                <app-login-page-powered-by>
                </app-login-page-powered-by>

            </section>


        </section>


        <!-- ===================================================
             RIGHT AREA
             ---------------------------------------------------
             WIDTH:

                 45%

             CONTENT:

                 EMPTY
        ==================================================== -->

        <section
            class="login-page-3-right-area"
        >


            <!-- ===============================================
                 RIGHT TOP
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-right-top"
            >

            </section>


            <!-- ===============================================
                 RIGHT CENTER
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-right-center"
            >

            </section>


            <!-- ===============================================
                 RIGHT BOTTOM
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-3-right-bottom"
            >

            </section>


        </section>


    </main>


</div>

<!-- ===========================================================
     LOGIN PAGE 1 ROOT
============================================================ -->

<div
    class="login-page-1"
>


    <!-- =======================================================
         ACTUAL BACKGROUND IMAGE 1

         Light:

             lightBackgroundImageUrl

         Deep:

             deepBackgroundImageUrl

         Current:

             currentBackgroundImageUrl
    ======================================================== -->

    <div
        class="login-page-1-background"

        [style.background-image]="
            currentBackgroundImageUrl
                ? 'url(' + currentBackgroundImageUrl + ')'
                : ''
        "
    >
    </div>


    <!-- =======================================================
         NOTIFICATION
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         MAIN LAYOUT
    ======================================================== -->

    <main
        class="login-page-1-layout"
    >


        <!-- ===================================================
             LEFT
        ==================================================== -->

        <section
            class="login-page-1-left-area"
        >


            <section
                class="login-page-1-left-top"
            >

                <app-login-page-branding>
                </app-login-page-branding>

            </section>


            <section
                class="login-page-1-left-center"
            >
            </section>


            <section
                class="login-page-1-left-bottom"
            >
            </section>


        </section>


        <!-- ===================================================
             MIDDLE
        ==================================================== -->

        <section
            class="login-page-1-middle-area"
        >


            <section
                class="login-page-1-middle-top"
            >
            </section>


            <section
                class="login-page-1-middle-center"
            >
            </section>


            <section
                class="login-page-1-middle-bottom"
            >

                <app-login-page-powered-by>
                </app-login-page-powered-by>

            </section>


        </section>


        <!-- ===================================================
             RIGHT
        ==================================================== -->

        <section
            class="login-page-1-right-area"
        >


            <!-- ===============================================
                 THEME SELECTOR
            ================================================ -->

            <section
                class="login-page-1-right-top"
            >

                <app-login-page-theme-selector
                    [isLightTheme]="isLightTheme"

                    (themeChange)="
                        onThemeChange($event)
                    "
                >
                </app-login-page-theme-selector>

            </section>


            <!-- ===============================================
                 AUTHENTICATION
            ================================================ -->

            <section
                class="login-page-1-right-center"
            >


                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="
                        onRegister()
                    "

                    (forgotPassword)="
                        onForgotPassword()
                    "
                >
                </app-login-page-login-panel>


                <app-login-page-registration-panel
                    *ngIf="
                        isRegistrationMode
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-registration-panel>


                <app-login-page-forget-password-panel
                    *ngIf="
                        isForgetPasswordMode
                    "

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 BOTTOM
            ================================================ -->

            <section
                class="login-page-1-right-bottom"
            >
            </section>


        </section>


    </main>


</div>

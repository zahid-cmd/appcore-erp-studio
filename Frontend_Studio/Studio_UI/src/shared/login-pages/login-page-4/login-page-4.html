<!-- ===========================================================
     LOGIN PAGE 4 ROOT
============================================================ -->

<div
    class="login-page-4"
>


    <!-- =======================================================
         ACTUAL BACKGROUND IMAGE 4

         Light:

             lightBackgroundImageUrl

         Deep:

             deepBackgroundImageUrl

         Current:

             currentBackgroundImageUrl

         SOURCE:

             Sub Ordinate Component ID = 4
    ======================================================== -->

    <div
        class="login-page-4-background"

        [style.background-image]="
            currentBackgroundImageUrl
                ? 'url(' + currentBackgroundImageUrl + ')'
                : ''
        "
    >
    </div>


    <!-- =======================================================
         NOTIFICATION
         -------------------------------------------------------
         Page-level floating notification component.
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         MAIN LAYOUT
         -------------------------------------------------------
         PIXEL-BY-PIXEL CLONE OF LOGIN PAGE 2
    ======================================================== -->

    <main
        class="login-page-4-layout"
    >


        <!-- ===================================================
             LEFT
             ---------------------------------------------------
             Same structure as Login Page 2.
        ==================================================== -->

        <section
            class="login-page-4-left-area"
        >


            <!-- ===============================================
                 LEFT TOP
                 -----------------------------------------------
                 BRANDING
            ================================================= -->

            <section
                class="login-page-4-left-top"
            >
                <app-login-page-powered-by>
                </app-login-page-powered-by>
            </section>


            <!-- ===============================================
                 LEFT CENTER
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-4-left-center"
            >
            </section>


            <!-- ===============================================
                 LEFT BOTTOM
                 -----------------------------------------------
                 POWERED BY
            ================================================= -->

            <section
                class="login-page-4-left-bottom"
            >

            </section>


        </section>


        <!-- ===================================================
             MIDDLE
             ---------------------------------------------------
             EMPTY
             Same structure as Login Page 2.
        ==================================================== -->

        <section
            class="login-page-4-middle-area"
        >


            <!-- ===============================================
                 MIDDLE TOP
            ================================================= -->

            <section
                class="login-page-4-middle-top"
            >
            </section>


            <!-- ===============================================
                 MIDDLE CENTER
            ================================================= -->

            <section
                class="login-page-4-middle-center"
            >
            </section>


            <!-- ===============================================
                 MIDDLE BOTTOM
            ================================================= -->

            <section
                class="login-page-4-middle-bottom"
            >
            </section>


        </section>


        <!-- ===================================================
             RIGHT
             ---------------------------------------------------
             Same structure as Login Page 2.
        ==================================================== -->

        <section
            class="login-page-4-right-area"
        >


            <!-- ===============================================
                 THEME SELECTOR
            ================================================= -->

            <section
                class="login-page-4-right-top"
            >

                <app-login-page-theme-selector
                    [isLightTheme]="isLightTheme"

                    (themeChange)="
                        onThemeChange($event)
                    "
                >
                </app-login-page-theme-selector>

            </section>


            <!-- ===============================================
                 AUTHENTICATION
                 ------------------------------------------------
                 LOGIN / REGISTRATION / FORGET PASSWORD
            ================================================= -->

            <section
                class="login-page-4-right-center"
            >


                <!-- ===========================================
                     LOGIN PANEL
                ============================================ -->

                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="
                        onRegister()
                    "

                    (forgotPassword)="
                        onForgotPassword()
                    "
                >
                </app-login-page-login-panel>


                <!-- ===========================================
                     REGISTRATION PANEL
                ============================================ -->

                <app-login-page-registration-panel
                    *ngIf="
                        isRegistrationMode
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-registration-panel>


                <!-- ===========================================
                     FORGET PASSWORD PANEL
                ============================================ -->

                <app-login-page-forget-password-panel
                    *ngIf="
                        isForgetPasswordMode
                    "

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 RIGHT BOTTOM
                 -----------------------------------------------
                 EMPTY
            ================================================= -->

            <section
                class="login-page-4-right-bottom"
            >
            </section>


        </section>


    </main>


</div>

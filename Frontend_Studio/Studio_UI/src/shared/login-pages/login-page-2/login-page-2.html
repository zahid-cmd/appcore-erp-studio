<!-- ===========================================================
     LOGIN PAGE 2
     -----------------------------------------------------------
     FINAL DESKTOP PAGE COMPOSITION

     FULL VIEWPORT
     │
     ├── FLOATING NOTIFICATION CONTROL
     │   └── Notification Button + Counter + Popover
     │
     ├── LEFT 45%
     │   ├── TOP 15%
     │   │   └── BRANDING 1
     │   │
     │   ├── CENTER
     │   │   └── EMPTY
     │   │
     │   └── BOTTOM 15%
     │       └── POWERED BY
     │
     ├── MIDDLE 20%
     │   ├── TOP 15%
     │   │   └── CLIENT LOGO AREA
     │   │
     │   ├── CENTER
     │   │   └── EMPTY
     │   │
     │   └── BOTTOM 15%
     │       └── EMPTY
     │
     └── RIGHT 35%
         ├── TOP 50px
         │   └── THEME SELECTOR
         │
         ├── CENTER
         │   ├── LOGIN PANEL
         │   ├── REGISTRATION PANEL
         │   └── FORGET PASSWORD PANEL
         │
         └── BOTTOM 50px
             └── EMPTY FOOTER AREA

     IMPORTANT:

         The Promotional Image remains completely independent
         from this layout.

         It occupies the FULL VIEWPORT behind all sections.

         The Notification Panel is completely independent
         from the page layout.

         It consumes NO physical layout space.

         Branding 2 has been completely removed.

         The Client Logo area remains in the
         MIDDLE TOP area.

         Powered By remains only in the
         LEFT BOTTOM area.

         Theme Selector is placed in the
         RIGHT TOP area.

         Notification Button is floating at page level.

         Theme Selector controls:

             LIGHT
                 ↓
             Promotional Image Light

             DEEP
                 ↓
             Promotional Image Deep

         This version is DESKTOP ONLY.

         Tablet and mobile layouts will be implemented later.

         REGISTER NOW EVENT:

             Login Panel emits the register event.

             This page receives the event through onRegister().

             isRegistrationMode becomes TRUE.

             Login Panel is hidden.

             Registration Panel is displayed.

         FORGOT PASSWORD EVENT:

             Login Panel emits the forgotPassword event.

             This page receives the event through onForgotPassword().

             isForgetPasswordMode becomes TRUE.

             Login Panel is hidden.

             Forget Password Panel is displayed.

         PASSWORD RESET SUCCESS EVENT:

             Forget Password Panel emits the
             passwordResetSuccess event.

             This page receives the event through
             onPasswordResetSuccess().

             The Notification Panel receives:

                 Password Changed

             The notification remains unread.

             The Notification Panel automatically opens
             for 5 seconds.

             The Notification Panel then closes automatically.

             The unread counter remains visible.

             The Forget Password Panel is immediately replaced
             by the Login Panel.

             The notification becomes read only when the user
             manually opens/interacts with the Notification Panel.

         BACK TO LOGIN EVENT:

             Registration Panel or Forget Password Panel emits
             the backToLogin event.

             This page receives the event through
             onBackToLogin().

             Both panel states become FALSE.

             Login Panel is displayed.

         THEME CHANGE EVENT:

             Theme Selector emits themeChange.

             This page receives the event through
             onThemeChange().

             isLightTheme becomes TRUE or FALSE.

             Promotional Image changes accordingly.
=========================================================== -->


<!-- ===========================================================
     LOGIN PAGE 2 ROOT
============================================================ -->

<div
    class="login-page-2"
>


    <!-- =======================================================
         FLOATING NOTIFICATION PANEL
         -------------------------------------------------------
         PAGE-LEVEL COMPONENT

         IMPORTANT:

             This component is intentionally placed OUTSIDE
             the desktop layout.

             It does NOT belong to:

                 - Login Panel
                 - Registration Panel
                 - Forget Password Panel
                 - Left Area
                 - Middle Area
                 - Right Area

             It consumes NO physical layout space.

             Its own CSS controls its fixed position.

             #notificationPanel provides an explicit template
             reference for the Login Page 2 @ViewChild.
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         FULL VIEWPORT PROMOTIONAL IMAGE
         -------------------------------------------------------
         This layer remains completely independent from the
         45% / 20% / 35% page structure.

         It occupies:

             Width  = 100vw
             Height = 100vh
    ======================================================== -->

    <section
        class="login-page-2-promotional-area"
    >


        <!-- ===================================================
             LIGHT PROMOTIONAL IMAGE
             ---------------------------------------------------
             DISPLAYED WHEN:

                 isLightTheme = true
        ==================================================== -->

        <app-login-page-promotional-image-light
            *ngIf="isLightTheme"
        >
        </app-login-page-promotional-image-light>


        <!-- ===================================================
             DEEP PROMOTIONAL IMAGE
             ---------------------------------------------------
             DISPLAYED WHEN:

                 isLightTheme = false
        ==================================================== -->

        <app-login-page-promotional-image-deep
            *ngIf="!isLightTheme"
        >
        </app-login-page-promotional-image-deep>


    </section>


    <!-- =======================================================
         DESKTOP PAGE LAYOUT
         -------------------------------------------------------
         FULL WIDTH SPLIT:

             LEFT   = 45%
             MIDDLE = 20%
             RIGHT  = 35%

         IMPORTANT:

             Notification Panel is NOT inside this layout.

             Therefore it cannot affect the 45% / 20% / 35%
             dimensions.
    ======================================================== -->

    <main
        class="login-page-2-layout"
    >


        <!-- ===================================================
             LEFT AREA
             ---------------------------------------------------
             WIDTH:

                 45%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = REST
                 BOTTOM = 15%
        ==================================================== -->

        <section
            class="login-page-2-left-area"
        >


            <!-- ===============================================
                 LEFT TOP
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     BRANDING 1
            ================================================= -->

            <section
                class="login-page-2-left-top"
            >

                <app-login-page-branding>
                </app-login-page-branding>

            </section>


            <!-- ===============================================
                 LEFT CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 Promotional image remains visible underneath.
            ================================================= -->

            <section
                class="login-page-2-left-center"
            >

            </section>


            <!-- ===============================================
                 LEFT BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     POWERED BY
            ================================================= -->

            <section
                class="login-page-2-left-bottom"
            >

                <app-login-page-powered-by>
                </app-login-page-powered-by>

            </section>


        </section>


        <!-- ===================================================
             MIDDLE AREA
             ---------------------------------------------------
             WIDTH:

                 20%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = REST
                 BOTTOM = 15%
        ==================================================== -->

        <section
            class="login-page-2-middle-area"
        >


            <!-- ===============================================
                 MIDDLE TOP
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     CLIENT LOGO AREA

                 The Client Logo component can be placed here
                 independently without affecting the rest of
                 the page composition.
            ================================================= -->

            <section
                class="login-page-2-middle-top"
            >

            </section>


            <!-- ===============================================
                 MIDDLE CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 Promotional image remains visible underneath.
            ================================================= -->

            <section
                class="login-page-2-middle-center"
            >

            </section>


            <!-- ===============================================
                 MIDDLE BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-2-middle-bottom"
            >

            </section>


        </section>


        <!-- ===================================================
             RIGHT AREA
             ---------------------------------------------------
             WIDTH:

                 35%

             VERTICAL STRUCTURE:

                 TOP    = 50px
                 CENTER = REST
                 BOTTOM = 50px
        ==================================================== -->

        <section
            class="login-page-2-right-area"
        >


            <!-- ===============================================
                 RIGHT TOP
                 -----------------------------------------------
                 HEIGHT:

                     50px

                 CONTENT:

                     THEME SELECTOR

                 Theme Selector emits:

                     true
                         ↓
                     LIGHT THEME

                     false
                         ↓
                     DEEP THEME

                 Page 2 remains the owner of the
                 isLightTheme state.
            ================================================= -->

            <section
                class="login-page-2-right-top"
            >

                <app-login-page-theme-selector
                    [isLightTheme]="isLightTheme"
                    (themeChange)="onThemeChange($event)"
                >
                </app-login-page-theme-selector>

            </section>


            <!-- ===============================================
                 RIGHT CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 CONTENT:

                     LOGIN / REGISTRATION /
                     FORGET PASSWORD PANEL
            ================================================= -->

            <section
                class="login-page-2-right-center"
            >


                <!-- ===========================================
                     LOGIN PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = false

                         AND

                         isForgetPasswordMode = false
                ============================================ -->

                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="onRegister()"

                    (forgotPassword)="onForgotPassword()"

                    (signIn)="onSignIn($event)"
                >
                </app-login-page-login-panel>


                <!-- ===========================================
                     REGISTRATION PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = true
                ============================================ -->

                <app-login-page-registration-panel
                    *ngIf="isRegistrationMode"

                    (backToLogin)="onBackToLogin()"
                >
                </app-login-page-registration-panel>


                <!-- ===========================================
                     FORGET PASSWORD PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isForgetPasswordMode = true

                     SUCCESS:

                         passwordResetSuccess is emitted by
                         the Forget Password Panel.

                         onPasswordResetSuccess() then:

                             1. Returns to Login Panel.
                             2. Creates Password Changed
                                notification.
                             3. Keeps notification unread.
                             4. Opens Notification Panel
                                automatically.
                             5. Keeps it open for 5 seconds.
                             6. Closes automatically.
                             7. Leaves unread counter visible.
                ============================================ -->

                <app-login-page-forget-password-panel
                    *ngIf="isForgetPasswordMode"

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 RIGHT BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     50px

                 CONTENT:

                     EMPTY FOOTER AREA

                 Powered By remains completely removed from
                 this section.
            ================================================= -->

            <section
                class="login-page-2-right-bottom"
            >

            </section>


        </section>


    </main>


</div>

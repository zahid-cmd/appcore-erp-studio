<!-- ===========================================================
     LOGIN PAGE 2
     -----------------------------------------------------------
     FINAL DESKTOP PAGE COMPOSITION

     FULL VIEWPORT
     │
     ├── FLOATING NOTIFICATION CONTROL
     │   └── Notification Button + Counter + Popover
     │
     ├── LEFT 45%
     │   ├── TOP 15%
     │   │   └── EMPTY
     │   │
     │   ├── CENTER
     │   │   └── EMPTY
     │   │
     │   └── BOTTOM 15%
     │       └── EMPTY
     │
     ├── MIDDLE 20%
     │   ├── TOP 15%
     │   │   └── EMPTY
     │   │
     │   ├── CENTER
     │   │   └── EMPTY
     │   │
     │   └── BOTTOM 15%
     │       └── EMPTY
     │
     └── RIGHT 35%
         ├── TOP 50px
         │   └── EMPTY
         │
         ├── CENTER
         │   ├── LOGIN PANEL
         │   ├── REGISTRATION PANEL
         │   └── FORGET PASSWORD PANEL
         │
         └── BOTTOM 50px
             └── EMPTY FOOTER AREA

     IMPORTANT:

         Promotional Image, Branding, Powered By and
         Theme Selector have been transferred to their
         new locations.

         They are therefore intentionally removed from
         Login Page 2.

         The Notification Panel remains completely
         independent from the page layout.

         It consumes NO physical layout space.

         Authentication:

             Authentication is completely owned by the
             Central Login Panel.

             Login Page 2 does NOT:

                 - receive signIn
                 - call AuthenticationService
                 - create LoginRequest
                 - store authentication
                 - navigate after login
                 - manage login errors
                 - manage signing-in state

             The Login Panel handles the complete
             authentication flow internally.

         This version is DESKTOP ONLY.

         Tablet and mobile layouts will be implemented later.

         REGISTER NOW EVENT:

             Login Panel emits the register event.

             This page receives the event through onRegister().

             isRegistrationMode becomes TRUE.

             Login Panel is hidden.

             Registration Panel is displayed.

         FORGOT PASSWORD EVENT:

             Login Panel emits the forgotPassword event.

             This page receives the event through onForgotPassword().

             isForgetPasswordMode becomes TRUE.

             Login Panel is hidden.

             Forget Password Panel is displayed.

         PASSWORD RESET SUCCESS EVENT:

             Forget Password Panel emits the
             passwordResetSuccess event.

             This page receives the event through
             onPasswordResetSuccess().

             The Notification Panel receives:

                 Password Changed

             The notification remains unread.

             The Notification Panel automatically opens
             for 5 seconds.

             The Notification Panel then closes automatically.

             The unread counter remains visible.

             The Forget Password Panel is immediately replaced
             by the Login Panel.

             The notification becomes read only when the user
             manually opens/interacts with the Notification Panel.

         BACK TO LOGIN EVENT:

             Registration Panel or Forget Password Panel emits
             the backToLogin event.

             This page receives the event through
             onBackToLogin().

             Both panel states become FALSE.

             Login Panel is displayed.
=========================================================== -->


<!-- ===========================================================
     LOGIN PAGE 2 ROOT
============================================================ -->

<div
    class="login-page-2"
>


    <!-- =======================================================
         FLOATING NOTIFICATION PANEL
         -------------------------------------------------------
         PAGE-LEVEL COMPONENT

         IMPORTANT:

             This component is intentionally placed OUTSIDE
             the desktop layout.

             It does NOT belong to:

                 - Login Panel
                 - Registration Panel
                 - Forget Password Panel
                 - Left Area
                 - Middle Area
                 - Right Area

             It consumes NO physical layout space.

             Its own CSS controls its fixed position.

             #notificationPanel provides an explicit template
             reference for the Login Page 2 @ViewChild.
    ======================================================== -->

    <app-login-page-notification-panel
        #notificationPanel
    >
    </app-login-page-notification-panel>


    <!-- =======================================================
         DESKTOP PAGE LAYOUT
         -------------------------------------------------------
         FULL WIDTH SPLIT:

             LEFT   = 45%
             MIDDLE = 20%
             RIGHT  = 35%

         The following components have been transferred
         and are no longer rendered by Login Page 2:

             Promotional Image Light
             Promotional Image Deep
             Branding
             Powered By
             Theme Selector

         Notification Panel is intentionally NOT included
         inside this layout.
    ======================================================== -->

    <main
        class="login-page-2-layout"
    >


        <!-- ===================================================
             LEFT AREA
             ---------------------------------------------------
             WIDTH:

                 45%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = REST
                 BOTTOM = 15%

             CONTENT:

                 EMPTY
        ==================================================== -->

        <section
            class="login-page-2-left-area"
        >


            <!-- ===============================================
                 LEFT TOP
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     EMPTY

                 Branding has been transferred.
            ================================================= -->

            <section
                class="login-page-2-left-top"
            >

            </section>


            <!-- ===============================================
                 LEFT CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-2-left-center"
            >

            </section>


            <!-- ===============================================
                 LEFT BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     EMPTY

                 Powered By has been transferred.
            ================================================= -->

            <section
                class="login-page-2-left-bottom"
            >

            </section>


        </section>


        <!-- ===================================================
             MIDDLE AREA
             ---------------------------------------------------
             WIDTH:

                 20%

             VERTICAL STRUCTURE:

                 TOP    = 15%
                 CENTER = REST
                 BOTTOM = 15%

             CONTENT:

                 EMPTY
        ==================================================== -->

        <section
            class="login-page-2-middle-area"
        >


            <!-- ===============================================
                 MIDDLE TOP
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     EMPTY

                 Client Logo area remains structurally empty
                 until its component is transferred.
            ================================================= -->

            <section
                class="login-page-2-middle-top"
            >

            </section>


            <!-- ===============================================
                 MIDDLE CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-2-middle-center"
            >

            </section>


            <!-- ===============================================
                 MIDDLE BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     15%

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-2-middle-bottom"
            >

            </section>


        </section>


        <!-- ===================================================
             RIGHT AREA
             ---------------------------------------------------
             WIDTH:

                 35%

             VERTICAL STRUCTURE:

                 TOP    = 50px
                 CENTER = REST
                 BOTTOM = 50px

             Theme Selector has been transferred.
        ==================================================== -->

        <section
            class="login-page-2-right-area"
        >


            <!-- ===============================================
                 RIGHT TOP
                 -----------------------------------------------
                 HEIGHT:

                     50px

                 CONTENT:

                     EMPTY
            ================================================= -->

            <section
                class="login-page-2-right-top"
            >

            </section>


            <!-- ===============================================
                 RIGHT CENTER
                 -----------------------------------------------
                 HEIGHT:

                     REST

                 CONTENT:

                     LOGIN /
                     REGISTRATION /
                     FORGET PASSWORD PANEL
            ================================================= -->

            <section
                class="login-page-2-right-center"
            >


                <!-- ===========================================
                     LOGIN PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = false

                         AND

                         isForgetPasswordMode = false

                     IMPORTANT:

                         Authentication is fully handled by
                         the Login Panel itself.

                         Login Page 2 does NOT receive or
                         process a signIn event.
                ============================================ -->

                <app-login-page-login-panel
                    *ngIf="
                        !isRegistrationMode
                        &&
                        !isForgetPasswordMode
                    "

                    (register)="onRegister()"

                    (forgotPassword)="onForgotPassword()"
                >
                </app-login-page-login-panel>


                <!-- ===========================================
                     REGISTRATION PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isRegistrationMode = true
                ============================================ -->

                <app-login-page-registration-panel
                    *ngIf="isRegistrationMode"

                    (backToLogin)="onBackToLogin()"
                >
                </app-login-page-registration-panel>


                <!-- ===========================================
                     FORGET PASSWORD PANEL
                     -------------------------------------------
                     DISPLAYED WHEN:

                         isForgetPasswordMode = true

                     SUCCESS:

                         passwordResetSuccess is emitted by
                         the Forget Password Panel.

                         onPasswordResetSuccess() then:

                             1. Returns to Login Panel.
                             2. Creates Password Changed
                                notification.
                             3. Keeps notification unread.
                             4. Opens Notification Panel
                                automatically.
                             5. Keeps it open for 5 seconds.
                             6. Closes automatically.
                             7. Leaves unread counter visible.
                ============================================ -->

                <app-login-page-forget-password-panel
                    *ngIf="isForgetPasswordMode"

                    (passwordResetSuccess)="
                        onPasswordResetSuccess()
                    "

                    (backToLogin)="
                        onBackToLogin()
                    "
                >
                </app-login-page-forget-password-panel>


            </section>


            <!-- ===============================================
                 RIGHT BOTTOM
                 -----------------------------------------------
                 HEIGHT:

                     50px

                 CONTENT:

                     EMPTY FOOTER AREA
            ================================================= -->

            <section
                class="login-page-2-right-bottom"
            >

            </section>


        </section>


    </main>


</div>

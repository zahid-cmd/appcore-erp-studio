<!-- ===========================================================
     LOGIN PAGE PREVIEWER
     -----------------------------------------------------------
     FULL-SCREEN LOGIN PAGE PREVIEW

     IMPORTANT:

         This Previewer contains ONLY the selected Login Page.

         The normal application shell is hidden while this
         Previewer is active.

         NOT DISPLAYED DURING PREVIEW:

             - Application Topbar
             - Application Sidebar
             - Application Footer
             - Orbit Loader
             - Toast
             - Empty State

         ESCAPE KEY:

             Press ESC to close the Previewer and return to
             the Login Pages list.
============================================================ -->


<div
    class="login-page-previewer"
    [class.preview-closed]="!isOpen"
>


    <!-- =======================================================
         LOGIN PAGE HOST
         -------------------------------------------------------
         The selected Login Page occupies the complete
         viewport.
    ======================================================== -->

    <div
        class="login-page-previewer-host"
    >


        <!-- ===================================================
             LOGIN PAGE 1
        ==================================================== -->

        <app-login-page-1
            *ngIf="isLoginPage1"
        >
        </app-login-page-1>



        <!-- ===================================================
             LOGIN PAGE 2
        ==================================================== -->

        <app-login-page-2
            *ngIf="isLoginPage2"
        >
        </app-login-page-2>



        <!-- ===================================================
             LOGIN PAGE 3
        ==================================================== -->

        <app-login-page-3
            *ngIf="isLoginPage3"
        >
        </app-login-page-3>



        <!-- ===================================================
             LOGIN PAGE 4
        ==================================================== -->

        <app-login-page-4
            *ngIf="isLoginPage4"
        >
        </app-login-page-4>



        <!-- ===================================================
             LOGIN PAGE 5
        ==================================================== -->

        <app-login-page-5
            *ngIf="isLoginPage5"
        >
        </app-login-page-5>


    </div>


</div>

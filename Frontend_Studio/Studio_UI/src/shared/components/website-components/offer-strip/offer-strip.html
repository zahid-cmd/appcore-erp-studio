<!-- ===========================================================
     OFFER STRIP
============================================================ -->

<section class="wrap">
    <div class="offer">
        <span class="offer-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
        </span>
        <div class="offer-text">
            <b>{{ offer().title }}</b>
            @if (offer().text)
            {
                <span>{{ offer().text }}</span>
            }
        </div>
        @if (endsText())
        {
            <span class="offer-ends">Until {{ endsText() }}</span>
        }
        @if (askLink())
        {
            <a class="offer-ask" [href]="askLink()" target="_blank" rel="noopener">Ask about it</a>
        }
    </div>
</section>

<!-- ===========================================================
     SERVICE, PARTS & CARE
============================================================ -->

<section class="wrap section">

    <div class="top">
        <div class="head">
            <span class="kicker">{{ t('service.kicker') }}</span>
            <h2 class="title">{{ t('service.title') }}</h2>
        </div>
        <div class="cta">
            <!-- The enquire form : saves an ERP Service Enquiry -->
            <a class="btn btn-accent" routerLink="/enquire" [queryParams]="{ type:'service' }">Book a service</a>
            <a class="btn" routerLink="/enquire" [queryParams]="{ type:'parts' }">Ask for a part</a>
            @if (call())
            {
                <a class="btn" [href]="call()">Call {{ content().company.hotline }}</a>
            }
        </div>
    </div>

    <div class="grid">
        @for (item of content().services; track item.title)
        {
            <article class="card lift item">
                <div class="photo">
                    @if (item.photo)
                    {
                        <img [src]="item.photo" [alt]="item.title" loading="lazy">
                    }
                    @else
                    {
                        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg>
                    }
                </div>
                <div class="body">
                    <b>{{ item.title }}</b>
                    @if (item.text)
                    {
                        <span>{{ item.text }}</span>
                    }
                </div>
            </article>
        }
    </div>

</section>

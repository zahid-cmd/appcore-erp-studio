<!-- =========================================================
     WORKSPACE HOST
========================================================= -->

<div class="workspace-host">

    <div class="workspace-content">


        <!-- =================================================
             CARD HEADER
        ================================================== -->

        <div class="workspace-card-header">

            <div class="workspace-title">

                <i class="fas fa-laptop-code"></i>

                <span>
                    Frontend Synchronization Workspace
                </span>

            </div>

            <div class="workspace-status">

                Ready

            </div>

        </div>


        <!-- =================================================
             CARD BODY
        ================================================== -->

        <div class="workspace-card-body">


            <!-- =================================================
                 TARGET LOCATION
            ================================================== -->

            <div class="workspace-section">

                <div class="workspace-section-title">

                    <div class="section-title-left">

                        <i class="fas fa-location-dot"></i>

                        <span>
                            Target Location
                        </span>

                    </div>

                    <button
                        type="button"
                        class="section-lock-button"
                        (click)="onTargetLocationEdit()">

                        <i
                            [class]="
                                targetLocationReadonly
                                    ? 'fas fa-pen'
                                    : 'fas fa-check'
                            ">
                        </i>

                    </button>

                </div>


                <app-textbox
                    label="Frontend Solution"
                    [(value)]="frontendSolution"
                    (valueChange)="emitFrontendSolution($event)"
                    [readonly]="targetLocationReadonly">
                </app-textbox>


                <app-textbox
                    label="Project"
                    [(value)]="project"
                    (valueChange)="emitProject($event)"
                    [readonly]="targetLocationReadonly">
                </app-textbox>


                <app-textbox
                    label="Source Folder"
                    [(value)]="sourceFolder"
                    (valueChange)="emitSourceFolder($event)"
                    [readonly]="targetLocationReadonly">
                </app-textbox>


                <app-textbox
                    label="Feature Folder"
                    [(value)]="featureFolder"
                    (valueChange)="emitFeatureFolder($event)"
                    [readonly]="targetLocationReadonly">
                </app-textbox>


                <app-textbox
                    label="Menu Folder"
                    [(value)]="menuFolder"
                    (valueChange)="emitMenuFolder($event)"
                    [readonly]="targetLocationReadonly">
                </app-textbox>

            </div>


            <!-- =================================================
                 SUBMENU LOCATION
            ================================================== -->

            <div class="workspace-section">

                <div class="workspace-section-title">

                    <div class="section-title-left">

                        <i class="fas fa-folder-tree"></i>

                        <span>
                            Submenu Location
                        </span>

                    </div>

                    <button
                        type="button"
                        class="section-lock-button"
                        (click)="onSubmenuLocationEdit()">

                        <i
                            [class]="
                                submenuLocationReadonly
                                    ? 'fas fa-pen'
                                    : 'fas fa-check'
                            ">
                        </i>

                    </button>

                </div>

                <app-textbox
                    label="Submenu Folder"
                    [(value)]="submenuFolder"
                    (valueChange)="emitSubmenuFolder($event)"
                    [readonly]="submenuLocationReadonly">
                </app-textbox>
                
                <app-textbox
                    label="Pages Folder"
                    [(value)]="pagesFolder"
                    (valueChange)="emitPagesFolder($event)"
                    [readonly]="submenuLocationReadonly">
                </app-textbox>

                <app-textbox
                    label="Form Folder"
                    [(value)]="formFolder"
                    (valueChange)="emitFormFolder($event)"
                    [readonly]="submenuLocationReadonly">
                </app-textbox>


                <app-textbox
                    label="List Folder"
                    [(value)]="listFolder"
                    (valueChange)="emitListFolder($event)"
                    [readonly]="submenuLocationReadonly">
                </app-textbox>

            </div>


            <!-- =================================================
                 SUBMENU CORE FILES
            ================================================== -->

            <div class="workspace-section">

                <div class="workspace-section-title">

                    <div class="section-title-left">

                        <i class="fas fa-file-code"></i>

                        <span>
                            Submenu Core Files
                        </span>

                    </div>

                    <button
                        type="button"
                        class="section-lock-button"
                        (click)="onCoreFilesEdit()">

                        <i
                            [class]="
                                coreFilesReadonly
                                    ? 'fas fa-pen'
                                    : 'fas fa-check'
                            ">
                        </i>

                    </button>

                </div>


                <app-textbox
                    label="Submenu Model File"
                    [(value)]="submenuModelFile"
                    (valueChange)="emitSubmenuModelFile($event)"
                    [readonly]="coreFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="Submenu Service File"
                    [(value)]="submenuServiceFile"
                    (valueChange)="emitSubmenuServiceFile($event)"
                    [readonly]="coreFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="Submenu Route File"
                    [(value)]="submenuRouteFile"
                    (valueChange)="emitSubmenuRouteFile($event)"
                    [readonly]="coreFilesReadonly">
                </app-textbox>

            </div>


            <!-- =================================================
                 SUBMENU PAGE FILES
            ================================================== -->

            <div class="workspace-section">

                <div class="workspace-section-title">

                    <div class="section-title-left">

                        <i class="fas fa-folder-open"></i>

                        <span>
                            Submenu Page Files
                        </span>

                    </div>

                    <button
                        type="button"
                        class="section-lock-button"
                        (click)="onPageFilesEdit()">

                        <i
                            [class]="
                                pageFilesReadonly
                                    ? 'fas fa-pen'
                                    : 'fas fa-check'
                            ">
                        </i>

                    </button>

                </div>


                <app-textbox
                    label="Form TypeScript File"
                    [(value)]="submenuFormTsFile"
                    (valueChange)="emitSubmenuFormTsFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="Form HTML File"
                    [(value)]="submenuFormHtmlFile"
                    (valueChange)="emitSubmenuFormHtmlFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="Form CSS File"
                    [(value)]="submenuFormCssFile"
                    (valueChange)="emitSubmenuFormCssFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="List TypeScript File"
                    [(value)]="submenuListTsFile"
                    (valueChange)="emitSubmenuListTsFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="List HTML File"
                    [(value)]="submenuListHtmlFile"
                    (valueChange)="emitSubmenuListHtmlFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>


                <app-textbox
                    label="List CSS File"
                    [(value)]="submenuListCssFile"
                    (valueChange)="emitSubmenuListCssFile($event)"
                    [readonly]="pageFilesReadonly">
                </app-textbox>

            </div>


        </div>

    </div>

</div>

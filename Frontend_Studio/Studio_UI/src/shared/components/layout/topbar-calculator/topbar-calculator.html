<!-- =====================================================
     TOPBAR CALCULATOR
     -----------------------------------------------------
     Button : opens / closes the calculator (Alt C)
     Pill   : last result while minimised
===================================================== -->

<button
    type="button"
    class="calc-button"
    [class.open]="calculator.open() && !calculator.minimized()"
    [class.minimized]="calculator.minimized()"
    [attr.aria-expanded]="calculator.open() && !calculator.minimized()"
    aria-label="Calculator"
    title="Calculator · Alt C"
    (click)="toggle()">

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect><path d="M8.5 6.5h7v3h-7z"></path><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01"></path></svg>

    @if (calculator.minimized())
    {
        <span class="calc-pill">
            {{ calculator.lastResult() }}
        </span>
    }

</button>

@else
{
    <!-- =============================================================
         PANEL / EMPTY : the full drawing
    ============================================================== -->

    <svg
        viewBox="0 0 260 170"
        class="wa-svg">

        <!-- the soft backdrop : a disc and the ground shadow -->
        <circle class="wa-soft" cx="186" cy="54" r="40" />

        @switch (drawn)
        {

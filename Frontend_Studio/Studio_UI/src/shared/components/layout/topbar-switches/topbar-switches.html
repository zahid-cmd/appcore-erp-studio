<!-- =====================================================
     TOPBAR SWITCHES
     -----------------------------------------------------
     Appearance : ☀ Light / ☾ Deep   (Ctrl Shift D)
     Layout     : Sidebar / Top bar  (Ctrl Shift L)
     Both remembered per user in this browser.
===================================================== -->

<div class="switches">


    <!-- =================================================
         APPEARANCE
    ================================================== -->

    <div
        class="segmented"
        role="group"
        aria-label="Appearance">

        <button
            type="button"
            class="segment light"
            [class.active]="appearance() === 'light'"
            [attr.aria-pressed]="appearance() === 'light'"
            aria-label="Light appearance"
            title="Light · Ctrl Shift D"
            (click)="setAppearance('light')">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>

        </button>

        <button
            type="button"
            class="segment"
            [class.active]="appearance() === 'deep'"
            [attr.aria-pressed]="appearance() === 'deep'"
            aria-label="Deep appearance"
            title="Deep · Ctrl Shift D"
            (click)="setAppearance('deep')">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>

        </button>

    </div>



    <!-- =================================================
         LAYOUT
    ================================================== -->

    <div
        class="segmented"
        role="group"
        aria-label="Layout">

        <button
            type="button"
            class="segment"
            [class.active]="layoutMode() === 'side'"
            [attr.aria-pressed]="layoutMode() === 'side'"
            aria-label="Sidebar layout"
            title="Layout: Sidebar · Ctrl Shift L"
            (click)="setLayout('side')">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>

        </button>

        <button
            type="button"
            class="segment"
            [class.active]="layoutMode() === 'top'"
            [attr.aria-pressed]="layoutMode() === 'top'"
            aria-label="Top navigation layout"
            title="Layout: Top navigation · Ctrl Shift L"
            (click)="setLayout('top')">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg>

        </button>

    </div>


</div>

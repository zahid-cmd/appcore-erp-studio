<!-- =====================================================
     TOPBAR HEADER
     -----------------------------------------------------
     The brand block is exactly as wide as the sidebar
     (open or collapsed), so its right edge lines up with
     the sidebar edge below it.

       Open       full logo + toggle inside the block
       Collapsed  logo mark centred in the rail,
                  toggle just after the block
       Top layout full logo only (no sidebar, no toggle)
       Light      logo-light.png instead of logo-dark.png

     Company logo (Settings › General Settings › Company)
     follows the block after a divider.
===================================================== -->

<div
    class="topbar-header"
    [class.collapsed]="showMark()"
    [class.top-layout]="isTopLayout()">


    <!-- =================================================
         BRAND BLOCK
    ================================================== -->

    <div class="brand-block">

        @if (showMark())
        {
            <img
                class="brand-mark"
                src="assets/AC.png"
                alt="AppCore">
        }
        @else
        {
            <img
                class="brand-logo"
                [src]="logoSrc()"
                alt="AppCore Logo">
        }

        @if (!showMark() && !isTopLayout())
        {
            <button
                type="button"
                class="sidebar-toggle"
                aria-label="Collapse sidebar"
                title="Collapse sidebar"
                (click)="toggleSidebar()">

                <i class="fa-solid fa-bars"></i>

            </button>
        }

    </div>



    <!-- =================================================
         TOGGLE (collapsed)
    ================================================== -->

    @if (showMark())
    {
        <button
            type="button"
            class="sidebar-toggle outside"
            aria-label="Expand sidebar"
            title="Expand sidebar"
            (click)="toggleSidebar()">

            <i class="fa-solid fa-bars"></i>

        </button>
    }



    <!-- =================================================
         COMPANY LOGO
    ================================================== -->

    @if (companyName() || companyLogoUrl())
    {
        <span class="brand-divider"></span>

        <span
            class="company-badge"
            [class.text-only]="!companyLogoUrl()"
            [title]="companyName()">

            @if (companyLogoUrl())
            {
                <img
                    class="company-logo"
                    [src]="companyLogoUrl()"
                    [alt]="companyName() || 'Company logo'"
                    (error)="onLogoError()">
            }
            @else
            {
                <i class="fa-solid fa-building-columns"></i>

                <b class="company-name">
                    {{ companyName() }}
                </b>
            }

        </span>
    }


</div>

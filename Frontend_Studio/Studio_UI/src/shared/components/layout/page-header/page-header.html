<div class="page-header">

    <!-- =====================================================
         LEFT
    ====================================================== -->

    <div class="page-header-left">

        <div
            *ngIf="icon || art"
            class="page-header-icon"
            [class.page-header-art]="!!art">

            <app-workspace-art
                *ngIf="art; else fontIcon"
                [theme]="art"
                size="tile">
            </app-workspace-art>

            <ng-template #fontIcon>
                <i [class]="icon"></i>
            </ng-template>

        </div>

        <div class="page-header-content">

            <div
                *ngIf="title"
                class="page-header-title">

                {{ title }}

                <ng-container *ngIf="titleMark">
                    - <span class="page-header-title-mark">{{ titleMark }}</span>
                </ng-container>

            </div>

            <div
                *ngIf="subtitle"
                class="page-header-subtitle">

                {{ subtitle }}

            </div>

        </div>

    </div>

    <!-- =====================================================
         CENTER
    ====================================================== -->

    <div class="page-header-center">

        <ng-content
            select="[pageHeaderCenter]">
        </ng-content>

    </div>

    <!-- =====================================================
         RIGHT
    ====================================================== -->

    <div class="page-header-right">

        <ng-content
            select="[pageHeaderRight]">
        </ng-content>

    </div>

</div>

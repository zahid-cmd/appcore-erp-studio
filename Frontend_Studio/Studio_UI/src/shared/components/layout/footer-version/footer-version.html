<!-- ==========================================================
     FOOTER VERSION
     ----------------------------------------------------------
     Same width as the sidebar (open or collapsed), so its
     edge lines up with the sidebar above it.
=========================================================== -->

<div
    class="footer-version"
    [class.collapsed]="isCollapsed()">

    <button
        type="button"
        class="version-label"
        [title]="'AppCore ERP ' + versions.label() + ' : version history'"
        (click)="versions.openHistory()">
        {{ versions.label() }}
    </button>

</div>

<!-- ============================================================
     Topbar Actions
     ------------------------------------------------------------
     Clock · Notifications · Profile
============================================================ -->

<div class="topbar-actions">


    <!-- ========================================================
         Clock
    ========================================================= -->

    <div
        class="clock"
        [title]="clockTitle()">

        <span class="clock-time">
            {{ clockTime() }}
        </span>

        <span class="clock-date">
            {{ clockDate() }}
        </span>

    </div>



    <!-- ========================================================
         Notifications
    ========================================================= -->

    <app-topbar-notifications>
    </app-topbar-notifications>



    <!-- ========================================================
         User Account
    ========================================================= -->

    <div class="user-account">


        <!-- ====================================================
             User Menu Button
        ===================================================== -->

        <button
            class="user-menu-button"
            type="button"
            aria-haspopup="menu"
            [attr.aria-expanded]="isUserMenuOpen()"
            (click)="onUserMenuClick()">

            <span class="avatar">
                @if (photoUrl())
                {
                    <img
                        class="avatar-photo"
                        [src]="photoUrl()"
                        [alt]="userName()"
                        (error)="onPhotoError()">
                }
                @else
                {
                    {{ initials() }}
                }
            </span>

            <span class="user-text">

                <b class="user-name">
                    {{ userName() }}
                </b>

                @if (userRole())
                {
                    <span class="user-role">
                        {{ userRole() }}
                    </span>
                }

            </span>

            <i
                class="fas fa-chevron-down menu-arrow"
                [class.open]="isUserMenuOpen()">
            </i>

        </button>



        <!-- ====================================================
             User Account Dropdown
        ===================================================== -->

        @if (isUserMenuOpen())
        {
            <div
                class="user-dropdown"
                role="menu">


                <!-- Signed-in user -->

                <div class="dropdown-head">

                    <span class="avatar large">
                        @if (photoUrl())
                        {
                            <img
                                class="avatar-photo"
                                [src]="photoUrl()"
                                [alt]="userName()"
                                (error)="onPhotoError()">
                        }
                        @else
                        {
                            {{ initials() }}
                        }
                    </span>

                    <span class="dropdown-head-text">

                        <b>{{ userName() }}</b>

                        @if (loginName())
                        {
                            <span>{{ loginName() }}</span>
                        }

                        @if (branchName())
                        {
                            <span>{{ branchName() }}</span>
                        }

                    </span>

                </div>


                <!-- Profile -->

                <button
                    class="user-dropdown-item"
                    type="button"
                    role="menuitem"
                    (click)="onProfileClick()">

                    <span class="dropdown-icon">
                        <i class="fas fa-user"></i>
                    </span>

                    <span class="dropdown-label">
                        Profile
                    </span>

                </button>


                <!-- Change Password -->

                <button
                    class="user-dropdown-item"
                    type="button"
                    role="menuitem"
                    (click)="onChangePasswordClick()">

                    <span class="dropdown-icon">
                        <i class="fas fa-key"></i>
                    </span>

                    <span class="dropdown-label">
                        Change Password
                    </span>

                </button>


                <!-- Switch Branch : two or more assigned branches -->

                @if (branchSwitch.showMenuItem())
                {
                    <button
                        class="user-dropdown-item"
                        type="button"
                        role="menuitem"
                        (click)="onSwitchBranchClick()">

                        <span class="dropdown-icon">
                            <i class="fas fa-code-branch"></i>
                        </span>

                        <span class="dropdown-label">
                            Switch Branch
                        </span>

                    </button>
                }


                <div class="dropdown-divider"></div>


                <!-- Logout -->

                <button
                    class="user-dropdown-item logout-item"
                    type="button"
                    role="menuitem"
                    (click)="onLogout()">

                    <span class="dropdown-icon">
                        <i class="fas fa-sign-out-alt"></i>
                    </span>

                    <span class="dropdown-label">
                        Logout
                    </span>

                </button>


            </div>
        }


    </div>


</div>

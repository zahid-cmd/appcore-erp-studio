<!-- ===========================================================
     LOGIN PAGE 1 — PROMOTIONAL IMAGE
     -----------------------------------------------------------
     PURPOSE:

         Clean promotional image container.

     IMPORTANT:

         This component contains ONLY the promotional image.

         No:
         - Border
         - Background
         - Card
         - Shadow
         - Overlay
         - Additional content

         Image sizing and positioning are controlled by the
         component configuration.
=========================================================== -->

<div
    class="login-page-promotional-image"
    *ngIf="config.visible"
>
    <img
        *ngIf="config.imageUrl"
        class="promotional-image"
        [src]="config.imageUrl"
        [style]="imageStyle"
        [alt]="config.altText"
    >

    <div
        *ngIf="!config.imageUrl"
        class="promotional-image-empty"
    >
    </div>
</div>

<!-- ===========================================================
     LOGIN PAGE REGISTRATION PANEL
     -----------------------------------------------------------
     FINAL PREMIUM REGISTRATION PANEL

     MASTER GEOMETRY:

         Width:
             590px

         Height:
             Available panel height
             with 20px top + 20px bottom breathing space.

     IMPORTANT:

         This panel controls ONLY the registration form.

         No:
         - Client Logo
         - Client Branding
         - Language selector
         - Background artwork
         - Powered By
         - Footer

         The registration panel uses the same master geometry
         and visual language as the Login Panel.
============================================================ -->


<div
    class="registration-page-registration-panel"
    *ngIf="config.visible"
>


    <!-- =======================================================
         REGISTRATION PANEL CONTENT
    ======================================================== -->

    <div
        class="registration-panel-content"
    >


        <!-- ===================================================
             REGISTRATION CARD
        ==================================================== -->

        <div
            class="registration-card"
        >


            <!-- ===============================================
                 CARD HEADER
            ================================================ -->

            <div
                class="registration-card-header"
            >


                <!-- ===========================================
                     TOP META
                ============================================ -->

                <div
                    class="registration-card-top-meta"
                >

                    <span>
                        SIMPLE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SECURE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SCALABLE
                    </span>

                </div>


                <!-- ===========================================
                     BLUE ACCENT
                ============================================ -->

                <div
                    class="registration-card-accent"
                >
                </div>


                <!-- ===========================================
                     HEADING AREA
                ============================================ -->

                <div
                    class="registration-card-heading-area"
                >

                    <h2
                        class="registration-card-heading"
                    >
                        {{ config.heading }}
                    </h2>


                    <p
                        class="registration-card-subtitle"
                    >
                        {{ config.subtitle }}
                    </p>

                </div>


            </div>


            <!-- ===============================================
                 REGISTRATION FORM
            ================================================ -->

            <form
                class="registration-form"
                (ngSubmit)="onRegister()"
                autocomplete="on"
            >


                <!-- ===========================================
                     FULL NAME
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-full-name"
                    >

                        {{ config.fullNameLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-full-name"
                            class="registration-form-input"
                            type="text"
                            name="fullName"
                            [value]="fullName"
                            [placeholder]="config.fullNamePlaceholder"
                            autocomplete="name"
                            (input)="
                                onFullNameChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     DISPLAY NAME
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-display-name"
                    >

                        {{ config.displayNameLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-display-name"
                            class="registration-form-input"
                            type="text"
                            name="displayName"
                            [value]="displayName"
                            [placeholder]="config.displayNamePlaceholder"
                            autocomplete="nickname"
                            (input)="
                                onDisplayNameChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     EMAIL ADDRESS
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-email"
                    >

                        {{ config.emailLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-envelope"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-email"
                            class="registration-form-input"
                            type="email"
                            name="email"
                            [value]="email"
                            [placeholder]="config.emailPlaceholder"
                            autocomplete="email"
                            (input)="
                                onEmailChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     LOGIN ID
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-login-id"
                    >

                        {{ config.loginIdLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-login-id"
                            class="registration-form-input"
                            type="text"
                            name="loginId"
                            [value]="loginId"
                            [placeholder]="config.loginIdPlaceholder"
                            autocomplete="username"
                            (input)="
                                onLoginIdChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     PASSWORD
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-password"
                    >

                        {{ config.passwordLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-lock"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-password"
                            class="registration-form-input registration-password-input"
                            [type]="
                                passwordVisible
                                    ? 'text'
                                    : 'password'
                            "
                            name="password"
                            [value]="password"
                            [placeholder]="config.passwordPlaceholder"
                            autocomplete="new-password"
                            (input)="
                                onPasswordChange(
                                    $any($event.target).value
                                )
                            "
                        />


                        <button
                            type="button"
                            class="password-visibility-button"
                            aria-label="Show or hide password"
                            (click)="
                                togglePasswordVisibility()
                            "
                        >

                            <i
                                [class]="
                                    passwordVisible
                                        ? 'fas fa-eye'
                                        : 'fas fa-eye-slash'
                                "
                                aria-hidden="true"
                            >
                            </i>

                        </button>

                    </div>

                </div>


                <!-- ===========================================
                     CONFIRM PASSWORD
                ============================================ -->

                <div
                    class="registration-form-field"
                >

                    <label
                        class="registration-form-label"
                        for="registration-page-confirm-password"
                    >

                        {{ config.confirmPasswordLabel }}

                    </label>


                    <div
                        class="registration-input-wrapper"
                    >

                        <span
                            class="registration-input-icon"
                        >

                            <i
                                class="fas fa-lock"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="registration-page-confirm-password"
                            class="registration-form-input registration-password-input"
                            [type]="
                                confirmPasswordVisible
                                    ? 'text'
                                    : 'password'
                            "
                            name="confirmPassword"
                            [value]="confirmPassword"
                            [placeholder]="config.confirmPasswordPlaceholder"
                            autocomplete="new-password"
                            (input)="
                                onConfirmPasswordChange(
                                    $any($event.target).value
                                )
                            "
                        />


                        <button
                            type="button"
                            class="password-visibility-button"
                            aria-label="Show or hide password"
                            (click)="
                                toggleConfirmPasswordVisibility()
                            "
                        >

                            <i
                                [class]="
                                    confirmPasswordVisible
                                        ? 'fas fa-eye'
                                        : 'fas fa-eye-slash'
                                "
                                aria-hidden="true"
                            >
                            </i>

                        </button>

                    </div>

                </div>


                <!-- ===========================================
                     TERMS AND PRIVACY
                ============================================ -->

                <label
                    class="registration-terms"
                >

                    <input
                        type="checkbox"
                        name="termsAccepted"
                        [checked]="termsAccepted"
                        (change)="
                            onTermsAcceptedChange(
                                $any($event.target).checked
                            )
                        "
                    />


                    <span
                        class="registration-terms-checkbox"
                    >
                    </span>


                    <span
                        class="registration-terms-text"
                    >

                        {{ config.termsPrefixText }}

                        <button
                            type="button"
                            class="registration-terms-link"
                            (click)="onTermsOfService()"
                        >
                            {{ config.termsText }}
                        </button>

                        {{ config.termsMiddleText }}

                        <button
                            type="button"
                            class="registration-terms-link"
                            (click)="onPrivacyPolicy()"
                        >
                            {{ config.privacyText }}
                        </button>

                    </span>

                </label>


                <!-- ===========================================
                     CREATE ACCOUNT BUTTON
                ============================================ -->

                <button
                    type="submit"
                    class="create-account-button"
                >

                    <span
                        class="create-account-icon"
                    >

                        <i
                            [class]="config.createAccountButtonIcon"
                            aria-hidden="true"
                        >
                        </i>

                    </span>


                    <span
                        class="create-account-text"
                    >
                        {{ config.createAccountButtonText }}
                    </span>


                    <span
                        class="create-account-arrow"
                    >

                        <i
                            [class]="config.createAccountButtonArrowIcon"
                            aria-hidden="true"
                        >
                        </i>

                    </span>

                </button>


            </form>


            <!-- =================================================
                 OR SEPARATOR
            ================================================== -->

            <div
                class="registration-or-separator"
            >

                <span
                    class="separator-line"
                >
                </span>


                <span
                    class="separator-text"
                >
                    {{ config.orText }}
                </span>


                <span
                    class="separator-line"
                >
                </span>

            </div>


            <!-- =================================================
                 BACK TO LOGIN
            ================================================== -->

            <div
                class="login-registration-area"
                *ngIf="config.loginVisible"
            >


                <!-- =============================================
                     LOGIN ICON
                ============================================== -->

                <div
                    class="login-registration-icon"
                >

                    <i
                        [class]="config.loginIcon"
                        aria-hidden="true"
                    >
                    </i>

                </div>


                <!-- =============================================
                     LOGIN CONTENT
                ============================================== -->

                <div
                    class="login-registration-content"
                >

                    <div
                        class="login-registration-heading"
                    >
                        {{ config.loginHeading }}
                    </div>


                    <div
                        class="login-registration-description"
                    >
                        {{ config.loginDescription }}
                    </div>

                </div>


                <!-- =============================================
                     LOGIN BUTTON
                ============================================== -->

                <button
                    type="button"
                    class="login-registration-button"
                    (click)="onBackToLogin()"
                >

                    {{ config.loginButtonText }}

                </button>


            </div>


            <!-- =================================================
                 BOTTOM META
                 -------------------------------------------------
                 Registration panel only
            ================================================== -->

            <div
                class="registration-card-bottom-meta"
            >

                <span>
                    SIMPLE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SECURE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SCALABLE
                </span>

            </div>


        </div>


    </div>


</div>

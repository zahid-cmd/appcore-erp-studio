<div class="activity-selector act-grid">

    <!--========================================================
        ALL (single, vertically centred)
    =========================================================-->

    <div class="act-all">
        @if (hasActivities)
        {
            <app-checkbox
                [readOnly]="readOnly"
                [value]="allChecked"
                (valueChange)="onAllChanged($event)">
            </app-checkbox>

            <span class="act-text act-text-all">All</span>
        }
    </div>

    <!--========================================================
        COMMON ACTIVITIES (3 columns, two lines)
    =========================================================-->

    <div class="act-common">
        @for (activity of commonActivities; track activity.id)
        {
            <div class="act-item" [attr.title]="activity.text">
                <app-checkbox
                    [readOnly]="readOnly"
                    [(value)]="activity.checked"
                    (valueChange)="onCheckedChanged()">
                </app-checkbox>

                <span class="act-text">{{ activity.text }}</span>
            </div>
        }
    </div>

    <!--========================================================
        PAGE ACTIONS (fixed slots, two lines)
    =========================================================-->

    <div class="act-page" [style.grid-template-columns]="slotColumns">
        @for (slot of pageSlots; track slot.key)
        {
            @if (slotItem(slot); as activity)
            {
                <div class="act-item" [attr.title]="activity.text">
                    <app-checkbox
                        [readOnly]="readOnly"
                        [(value)]="activity.checked"
                        (valueChange)="onCheckedChanged()">
                    </app-checkbox>

                    <span class="act-text act-text-page">{{ activity.text }}</span>
                </div>
            }
            @else
            {
                <div class="act-item act-slot-empty" aria-hidden="true"></div>
            }
        }
    </div>

</div>

@if (
  progressService.isOpen() ||
  previewMode
) {

  <div
    class="progress-overlay"
    [class.preview-mode]="previewMode"
  >

    <div class="progress-dialog">

      <!-- =====================================================
           HEADER
      ====================================================== -->

      <div class="progress-header">

        <div class="progress-title">

          {{
            previewMode
              ? 'Processing Request'
              : progressService.title()
          }}

        </div>

      </div>

      <!-- =====================================================
          BODY
      ===================================================== -->

      <div class="progress-body">

          <div class="progress-message-row">

              <div class="progress-message">

                  {{
                      previewMode
                          ? 'Please wait while the operation is being completed.'
                          : progressService.message()
                  }}

              </div>

              <!-- =================================================
                  ECG LOADER
              ================================================== -->

              <div class="ecg-loader">

                  <svg
                      viewBox="0 0 120 24"
                      class="ecg-svg"
                  >
                      <path
                          class="ecg-line"
                          d="
                              M0 12
                              L18 12
                              L24 12
                              L30 12
                              L36 12
                              L42 12
                              L46 16
                              L50 4
                              L54 22
                              L60 8
                              L66 15
                              L72 10
                              L78 12
                              L120 12
                          "
                      />

                  </svg>

              </div>

          </div>

          <div class="progress-percent">

              {{
                  previewMode
                      ? previewProgress
                      : progressService.progress()
              }}%

          </div>

          <div class="progress-bar">

              <div
                  class="progress-fill"
                  [style.width.%]="
                      previewMode
                          ? previewProgress
                          : progressService.progress()
                  "
              >
              </div>

          </div>

      </div>

    </div>

  </div>

}

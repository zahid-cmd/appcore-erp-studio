<!-- ===========================================================
     LOGIN PAGE FORGET PASSWORD PANEL
     -----------------------------------------------------------
     FINAL PREMIUM FORGET PASSWORD PANEL

     TWO-STAGE PASSWORD RECOVERY:

         STAGE 1
         Login ID
         Continue

         STAGE 2
         Login ID
         Verification Code
         Confirm Verification Code
         New Password
         Confirm New Password
         Reset Password

     VERIFICATION CODE:

         Verification Code:
             Automatically generated by backend.
             Read-only.

         Confirm Verification Code:
             User enters the verification code manually.
             Frontend validates it against the generated
             verification code before submitting the reset.

     FIELD VALIDATION:

         Confirm Verification Code:
             Turns red after leaving the field when the
             entered value is invalid or does not match.

         Confirm New Password:
             Turns red after leaving the field when the
             entered password does not match the
             New Password field.

     SUCCESS:

         Password reset is completed by the backend.
         The parent Login Page receives the
         passwordResetSuccess event and immediately:

             1. Creates a Notification Panel message.
             2. Returns to the Login Panel.

     IMPORTANT:

         Successful reset information is NOT displayed
         inside this panel.
=========================================================== -->


<div
    class="forget-password-page-forget-password-panel"
    *ngIf="config.visible"
>


    <!-- =======================================================
         FORGET PASSWORD PANEL CONTENT
    ======================================================== -->

    <div
        class="forget-password-panel-content"
    >


        <!-- ===================================================
             FORGET PASSWORD CARD
        ==================================================== -->

        <div
            class="forget-password-card"
        >


            <!-- ===============================================
                 CARD HEADER
            ================================================ -->

            <div
                class="forget-password-card-header"
            >


                <!-- ===========================================
                     TOP META
                ============================================ -->

                <div
                    class="forget-password-card-top-meta"
                >

                    <span>
                        SIMPLE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SECURE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SCALABLE
                    </span>

                </div>


                <!-- ===========================================
                     BLUE ACCENT
                ============================================ -->

                <div
                    class="forget-password-card-accent"
                >
                </div>


                <!-- ===========================================
                     HEADING AREA
                ============================================ -->

                <div
                    class="forget-password-card-heading-area"
                >

                    <h2
                        class="forget-password-card-heading"
                    >

                        {{ config.heading }}

                    </h2>


                    <p
                        class="forget-password-card-subtitle"
                    >

                        {{ config.subtitle }}

                    </p>

                </div>


            </div>


            <!-- ===============================================
                 FORGET PASSWORD FORM
            ================================================ -->

            <form
                class="forget-password-form"
                (submit)="onFormSubmit($event)"
                autocomplete="on"
                novalidate
            >


                <!-- ===========================================
                     LOGIN ID
                ============================================ -->

                <div
                    class="forget-password-form-field"
                >

                    <label
                        class="forget-password-form-label"
                        for="forget-password-page-login-id"
                    >

                        {{ config.loginIdLabel }}

                    </label>


                    <div
                        class="forget-password-input-wrapper"
                    >

                        <span
                            class="forget-password-input-icon"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="forget-password-page-login-id"
                            class="forget-password-form-input"
                            type="text"
                            name="loginId"
                            [value]="loginId"
                            [placeholder]="config.loginIdPlaceholder"
                            autocomplete="username"
                            [disabled]="
                                isCheckingLoginId ||
                                isChangingPassword
                            "
                            (input)="
                                onLoginIdChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     VERIFICATION CODE
                     ------------------------------------------------
                     Visible only after the Login ID has been
                     successfully verified.

                     The backend-generated code is automatically
                     populated and intentionally cannot be edited.

                     IMPORTANT:

                         This field does not receive the red
                         validation state because it is the
                         trusted backend-generated value.
                ============================================ -->

                <div
                    class="forget-password-form-field"
                    *ngIf="passwordResetStarted"
                >

                    <label
                        class="forget-password-form-label"
                        for="forget-password-page-verification-code"
                    >

                        Verification Code

                    </label>


                    <div
                        class="forget-password-input-wrapper verification-disabled"
                    >

                        <span
                            class="forget-password-input-icon"
                        >

                            <i
                                class="fas fa-shield-alt"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="forget-password-page-verification-code"
                            class="forget-password-form-input forget-password-verification-input"
                            type="text"
                            name="verificationCode"
                            [value]="verificationCode"
                            autocomplete="off"
                            readonly
                            aria-readonly="true"
                        />

                    </div>

                </div>


                <!-- ===========================================
                     CONFIRM VERIFICATION CODE
                     ------------------------------------------------
                     Visible only after the Login ID has been
                     successfully verified.

                     The user manually enters the verification
                     code shown above.

                     Validation:

                         - Empty
                         - Not exactly 6 digits
                         - Does not match generated code

                     The field becomes visually invalid after
                     the user leaves the field.
                ============================================ -->

                <div
                    class="forget-password-form-field"
                    *ngIf="passwordResetStarted"
                >

                    <label
                        class="forget-password-form-label"
                        for="forget-password-page-confirm-verification-code"
                    >

                        Confirm Verification Code

                    </label>


                    <div
                        class="forget-password-input-wrapper"
                        [class.verification-invalid]="
                            isConfirmVerificationCodeInvalid
                        "
                    >

                        <span
                            class="forget-password-input-icon"
                        >

                            <i
                                class="fas fa-shield-alt"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="forget-password-page-confirm-verification-code"
                            class="forget-password-form-input forget-password-verification-input"
                            type="text"
                            name="confirmVerificationCode"
                            [value]="confirmVerificationCode"
                            placeholder="Enter verification code"
                            autocomplete="off"
                            [disabled]="isChangingPassword"
                            maxlength="6"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            (input)="
                                onConfirmVerificationCodeChange(
                                    $any($event.target).value
                                )
                            "
                            (blur)="
                                onConfirmVerificationCodeBlur()
                            "
                            [attr.aria-invalid]="
                                isConfirmVerificationCodeInvalid
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     NEW PASSWORD
                ============================================ -->

                <div
                    class="forget-password-form-field"
                    *ngIf="passwordResetStarted"
                >

                    <label
                        class="forget-password-form-label"
                        for="forget-password-page-new-password"
                    >

                        {{ config.newPasswordLabel }}

                    </label>


                    <div
                        class="forget-password-input-wrapper"
                    >

                        <span
                            class="forget-password-input-icon"
                        >

                            <i
                                class="fas fa-lock"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="forget-password-page-new-password"
                            class="forget-password-form-input forget-password-password-input"
                            [type]="
                                newPasswordVisible
                                    ? 'text'
                                    : 'password'
                            "
                            name="newPassword"
                            [value]="newPassword"
                            [placeholder]="config.newPasswordPlaceholder"
                            autocomplete="new-password"
                            [disabled]="isChangingPassword"
                            (input)="
                                onNewPasswordChange(
                                    $any($event.target).value
                                )
                            "
                        />


                        <button
                            type="button"
                            class="forget-password-visibility-button"
                            aria-label="Show or hide new password"
                            [disabled]="isChangingPassword"
                            (click)="
                                toggleNewPasswordVisibility()
                            "
                        >

                            <i
                                [class]="
                                    newPasswordVisible
                                        ? 'fas fa-eye'
                                        : 'fas fa-eye-slash'
                                "
                                aria-hidden="true"
                            >
                            </i>

                        </button>

                    </div>

                </div>


                <!-- ===========================================
                     CONFIRM NEW PASSWORD
                     ------------------------------------------------
                     Validation:

                         - Empty
                         - Does not match New Password

                     The field becomes visually invalid after
                     the user leaves the field.
                ============================================ -->

                <div
                    class="forget-password-form-field"
                    *ngIf="passwordResetStarted"
                >

                    <label
                        class="forget-password-form-label"
                        for="forget-password-page-confirm-password"
                    >

                        {{ config.confirmPasswordLabel }}

                    </label>


                    <div
                        class="forget-password-input-wrapper"
                        [class.password-invalid]="
                            isConfirmPasswordInvalid
                        "
                    >

                        <span
                            class="forget-password-input-icon"
                        >

                            <i
                                class="fas fa-lock"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="forget-password-page-confirm-password"
                            class="forget-password-form-input forget-password-password-input"
                            [type]="
                                confirmPasswordVisible
                                    ? 'text'
                                    : 'password'
                            "
                            name="confirmPassword"
                            [value]="confirmPassword"
                            [placeholder]="config.confirmPasswordPlaceholder"
                            autocomplete="new-password"
                            [disabled]="isChangingPassword"
                            (input)="
                                onConfirmPasswordChange(
                                    $any($event.target).value
                                )
                            "
                            (blur)="
                                onConfirmPasswordBlur()
                            "
                            [attr.aria-invalid]="
                                isConfirmPasswordInvalid
                            "
                        />


                        <button
                            type="button"
                            class="forget-password-visibility-button"
                            aria-label="Show or hide confirm password"
                            [disabled]="isChangingPassword"
                            (click)="
                                toggleConfirmPasswordVisibility()
                            "
                        >

                            <i
                                [class]="
                                    confirmPasswordVisible
                                        ? 'fas fa-eye'
                                        : 'fas fa-eye-slash'
                                "
                                aria-hidden="true"
                            >
                            </i>

                        </button>

                    </div>

                </div>


                <!-- ===========================================
                     MESSAGE
                ============================================ -->

                <div
                    class="forget-password-message"
                    *ngIf="message"
                    [class.error]="
                        messageType === 'error'
                    "
                    [class.info]="
                        messageType === 'info'
                    "
                >

                    {{ message }}

                </div>


                <!-- ===========================================
                     PASSWORD ACTION BUTTON
                ============================================ -->

                <button
                    type="submit"
                    class="reset-password-button"
                    [disabled]="
                        isCheckingLoginId ||
                        isChangingPassword
                    "
                >

                    <span
                        class="reset-password-icon"
                    >

                        <i
                            [class]="
                                isCheckingLoginId ||
                                isChangingPassword
                                    ? 'fas fa-spinner fa-spin'
                                    : (
                                        passwordResetStarted
                                            ? config.resetPasswordButtonIcon
                                            : 'fas fa-arrow-right'
                                    )
                            "
                            aria-hidden="true"
                        >
                        </i>

                    </span>


                    <span
                        class="reset-password-text"
                    >

                        {{
                            isCheckingLoginId
                                ? 'Checking...'
                                : isChangingPassword
                                    ? 'Changing Password...'
                                    : passwordResetStarted
                                        ? config.resetPasswordButtonText
                                        : 'Continue'
                        }}

                    </span>


                    <span
                        class="reset-password-arrow"
                    >

                        <i
                            [class]="
                                config.resetPasswordButtonArrowIcon
                            "
                            aria-hidden="true"
                        >
                        </i>

                    </span>

                </button>


            </form>


            <!-- =================================================
                 OR SEPARATOR
            ================================================== -->

            <div
                class="forget-password-or-separator"
            >

                <span
                    class="separator-line"
                >
                </span>


                <span
                    class="separator-text"
                >

                    {{ config.orText }}

                </span>


                <span
                    class="separator-line"
                >
                </span>

            </div>


            <!-- =================================================
                 BACK TO SIGN IN
            ================================================== -->

            <div
                class="sign-in-registration-area"
                *ngIf="config.signInVisible"
            >

                <div
                    class="sign-in-registration-icon"
                >

                    <i
                        [class]="config.signInIcon"
                        aria-hidden="true"
                    >
                    </i>

                </div>


                <div
                    class="sign-in-registration-content"
                >

                    <div
                        class="sign-in-registration-heading"
                    >

                        {{ config.signInHeading }}

                    </div>


                    <div
                        class="sign-in-registration-description"
                    >

                        {{ config.signInDescription }}

                    </div>

                </div>


                <button
                    type="button"
                    class="sign-in-registration-button"
                    (click)="onBackToLogin()"
                >

                    {{ config.signInButtonText }}

                </button>


            </div>


            <!-- =================================================
                 BOTTOM META
            ================================================== -->

            <div
                class="forget-password-card-bottom-meta"
            >

                <span>
                    SIMPLE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SECURE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SCALABLE
                </span>

            </div>


        </div>


    </div>


</div>

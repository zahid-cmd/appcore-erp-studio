<!-- ===========================================================
     LOGIN PAGE LOGIN PANEL
     -----------------------------------------------------------
     FINAL PREMIUM LOGIN PANEL

     MASTER GEOMETRY:

         Width:
             590px

         Height:
             Available panel height
             with 20px top + 20px bottom breathing space.

     IMPORTANT:

         This panel controls ONLY the login form.

         No:
         - Language selector
         - Background artwork
         - Powered By
         - Footer

         Client branding is displayed INSIDE the login panel.
============================================================ -->


<div
    class="login-page-login-panel"
    *ngIf="config.visible"
>


    <!-- =======================================================
         LOGIN PANEL CONTENT
    ======================================================== -->

    <div
        class="login-panel-content"
    >


        <!-- ===================================================
             LOGIN CARD
        ==================================================== -->

        <div
            class="login-card"
        >


            <!-- ===============================================
                 CARD HEADER
            ================================================ -->

            <div
                class="login-card-header"
            >


                <!-- ===========================================
                     TOP META
                ============================================ -->

                <div
                    class="login-card-top-meta"
                >

                    <span>
                        SIMPLE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SECURE
                    </span>

                    <span
                        class="topline-separator"
                    >
                        |
                    </span>

                    <span>
                        SCALABLE
                    </span>

                </div>


                <!-- ===========================================
                     BLUE ACCENT
                ============================================ -->

                <div
                    class="login-card-accent"
                >
                </div>


                <!-- ===========================================
                     CLIENT BRANDING
                     -------------------------------------------
                     Moto Zone
                ============================================ -->

                <div
                    class="login-card-client-branding"
                >


                    <!-- =======================================
                         CLIENT LOGO
                    ======================================== -->

                    <div
                        class="login-client-logo-area"
                    >

                        <img
                            class="login-client-logo"
                            src="/assets/client-logo/MotoZone.png"
                            alt="Moto Zone"
                        >

                    </div>


                    <!-- =======================================
                         CLIENT BRAND SEPARATOR
                    ======================================== -->

                    <div
                        class="login-client-separator"
                    >

                        <span
                            class="login-client-separator-dot"
                        >
                        </span>

                        <span
                            class="login-client-separator-line"
                        >
                        </span>

                        <span
                            class="login-client-separator-dot"
                        >
                        </span>

                    </div>


                    <!-- =======================================
                         CLIENT NAME
                    ======================================== -->

                    <div
                        class="login-client-name-area"
                    >

                        <div
                            class="login-client-name"
                        >
                            Moto Zone
                        </div>


                        <div
                            class="login-client-name-accent"
                        >
                        </div>

                    </div>


                </div>


                <!-- ===========================================
                     HEADING AREA
                ============================================ -->

                <div
                    class="login-card-heading-area"
                >

                    <h2
                        class="login-card-heading"
                    >
                        {{ config.heading }}
                    </h2>


                    <p
                        class="login-card-subtitle"
                    >
                        {{ config.subtitle }}
                    </p>

                </div>


            </div>


            <!-- ===============================================
                 LOGIN FORM
            ================================================ -->

            <form
                class="login-form"
                (ngSubmit)="onSignIn()"
                autocomplete="on"
            >


                <!-- ===========================================
                     LOGIN ID
                ============================================ -->

                <div
                    class="login-form-field"
                >

                    <label
                        class="login-form-label"
                        for="login-page-login-id"
                    >

                        {{ config.loginIdLabel }}

                    </label>


                    <div
                        class="login-input-wrapper"
                    >

                        <span
                            class="login-input-icon"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="login-page-login-id"
                            class="login-form-input"
                            type="text"
                            name="loginId"
                            [value]="loginId"
                            [placeholder]="config.loginIdPlaceholder"
                            autocomplete="username"
                            (input)="
                                onLoginIdChange(
                                    $any($event.target).value
                                )
                            "
                        />

                    </div>

                </div>


                <!-- ===========================================
                     PASSWORD
                ============================================ -->

                <div
                    class="login-form-field"
                >

                    <label
                        class="login-form-label"
                        for="login-page-password"
                    >

                        {{ config.passwordLabel }}

                    </label>


                    <div
                        class="login-input-wrapper"
                    >

                        <span
                            class="login-input-icon"
                        >

                            <i
                                class="fas fa-lock"
                                aria-hidden="true"
                            >
                            </i>

                        </span>


                        <input
                            id="login-page-password"
                            class="login-form-input login-password-input"
                            [type]="
                                passwordVisible
                                    ? 'text'
                                    : 'password'
                            "
                            name="password"
                            [value]="password"
                            [placeholder]="config.passwordPlaceholder"
                            autocomplete="current-password"
                            (input)="
                                onPasswordChange(
                                    $any($event.target).value
                                )
                            "
                        />


                        <button
                            type="button"
                            class="password-visibility-button"
                            aria-label="Show or hide password"
                            (click)="
                                togglePasswordVisibility()
                            "
                        >

                            <i
                                [class]="
                                    passwordVisible
                                        ? 'fas fa-eye'
                                        : 'fas fa-eye-slash'
                                "
                                aria-hidden="true"
                            >
                            </i>

                        </button>

                    </div>

                </div>


                <!-- ===========================================
                     LOGIN OPTIONS
                ============================================ -->

                <div
                    class="login-form-options"
                >


                    <!-- =======================================
                         REMEMBER ME
                    ======================================== -->

                    <label
                        class="remember-me"
                        *ngIf="config.rememberMeVisible"
                    >

                        <input
                            type="checkbox"
                            name="rememberMe"
                            [checked]="rememberMe"
                            (change)="
                                onRememberMeChange(
                                    $any($event.target).checked
                                )
                            "
                        />

                        <span
                            class="remember-checkbox"
                        >
                        </span>

                        <span
                            class="remember-text"
                        >
                            {{ config.rememberMeText }}
                        </span>

                    </label>


                    <!-- =======================================
                         FORGOT PASSWORD
                    ======================================== -->

                    <button
                        type="button"
                        class="forgot-password-button"
                        *ngIf="config.forgotPasswordVisible"
                        (click)="onForgotPassword()"
                    >

                        {{ config.forgotPasswordText }}

                    </button>


                </div>


                <!-- ===========================================
                     SIGN IN BUTTON
                ============================================ -->

                <button
                    type="submit"
                    class="sign-in-button"
                >

                    <span
                        class="sign-in-icon"
                    >

                        <i
                            [class]="config.signInButtonIcon"
                            aria-hidden="true"
                        >
                        </i>

                    </span>


                    <span
                        class="sign-in-text"
                    >
                        {{ config.signInButtonText }}
                    </span>


                    <span
                        class="sign-in-arrow"
                    >

                        <i
                            [class]="config.signInButtonArrowIcon"
                            aria-hidden="true"
                        >
                        </i>

                    </span>

                </button>


            </form>


            <!-- =================================================
                 OR SEPARATOR
            ================================================== -->

            <div
                class="login-or-separator"
            >

                <span
                    class="separator-line"
                >
                </span>


                <span
                    class="separator-text"
                >
                    {{ config.orText }}
                </span>


                <span
                    class="separator-line"
                >
                </span>

            </div>


            <!-- =================================================
                 REGISTRATION
            ================================================== -->

            <div
                class="registration-area"
                *ngIf="config.registrationVisible"
            >


                <!-- =============================================
                     REGISTRATION ICON
                ============================================== -->

                <div
                    class="registration-icon"
                >

                    <i
                        [class]="config.registrationIcon"
                        aria-hidden="true"
                    >
                    </i>

                </div>


                <!-- =============================================
                     REGISTRATION CONTENT
                ============================================== -->

                <div
                    class="registration-content"
                >

                    <div
                        class="registration-heading"
                    >
                        {{ config.registrationHeading }}
                    </div>


                    <div
                        class="registration-description"
                    >
                        {{ config.registrationDescription }}
                    </div>

                </div>


                <!-- =============================================
                     REGISTRATION BUTTON
                ============================================== -->

                <button
                    type="button"
                    class="registration-button"
                    (click)="onRegister()"
                >

                    {{ config.registrationButtonText }}

                </button>


            </div>


            <!-- =================================================
                 BOTTOM META
                 -------------------------------------------------
                 Login panel only
            ================================================== -->

            <div
                class="login-card-bottom-meta"
            >

                <span>
                    SIMPLE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SECURE
                </span>

                <span
                    class="topline-separator"
                >
                    |
                </span>

                <span>
                    SCALABLE
                </span>

            </div>


        </div>


    </div>


</div>

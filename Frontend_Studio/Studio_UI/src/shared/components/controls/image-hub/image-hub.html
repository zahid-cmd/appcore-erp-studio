<div
    class="image-hub"
    [class.disabled]="disabled"
    [class.readonly]="readonly">


    <!-- =====================================================
         LABEL
    ====================================================== -->

    <div class="image-hub-label">

        {{ label }}

    </div>



    <!-- =====================================================
         IMAGE CONTAINER
    ====================================================== -->

    <div class="image-hub-preview">


        <!-- =================================================
             IMAGE
        ================================================== -->

        <img

            *ngIf="imageUrl"

            [src]="imageUrl"

            [alt]="label" />



        <!-- =================================================
             PLACEHOLDER
        ================================================== -->

        <div

            *ngIf="!imageUrl"

            class="image-hub-placeholder">


            <i class="fas fa-image"></i>


            <span>

                {{ placeholder }}

            </span>


        </div>



        <!-- =================================================
             FLOATING ACTIONS
        ================================================== -->

        <div class="image-hub-floating-actions">


            <!-- =============================================
                 UPLOAD
            ============================================== -->

            <button

                type="button"

                class="image-hub-action upload-button"

                title="Upload image"

                aria-label="Upload image"

                [disabled]="disabled || readonly"

                (click)="fileInput.click()">


                <i class="fas fa-upload"></i>


            </button>



            <!-- =============================================
                 REMOVE
            ============================================== -->

            <button

                *ngIf="imageUrl"

                type="button"

                class="image-hub-action remove-button"

                title="Remove image"

                aria-label="Remove image"

                [disabled]="disabled || readonly"

                (click)="removeImage()">


                <i class="fas fa-trash"></i>


            </button>


        </div>


    </div>



    <!-- =====================================================
         HIDDEN FILE INPUT
    ====================================================== -->

    <input

        #fileInput

        type="file"

        accept="image/*"

        hidden

        (change)="onFileSelected($event)" />


</div>

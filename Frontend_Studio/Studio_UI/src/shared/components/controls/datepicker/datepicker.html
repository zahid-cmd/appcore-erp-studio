<!-- =====================================================
     DATEPICKER
===================================================== -->

<div class="datepicker-container">

    <!-- =====================================================
         LABEL (optional, same as app-textbox)
    ====================================================== -->

    <label

        *ngIf="label"

        class="datepicker-label"

        [attr.for]="id || null">

        <span>

            {{ label }}

        </span>

        <span

            *ngIf="required"

            class="datepicker-required">

            *

        </span>

    </label>

    <!-- =====================================================
         FIELD
    ====================================================== -->

    <div

        cdkOverlayOrigin

        #origin="cdkOverlayOrigin"

        class="datepicker"

        [class.disabled]="disabled"

        [class.readonly]="readonly">

        <!-- =================================================
             SELECTOR
        ================================================== -->

        <div

            class="datepicker-selector"

            [class.open]="calendarVisible"

            [class.invalid]="typedInvalid">

            <!-- VALUE : type a date (01-Jul-2025, 1/7/25, 2025-07-01,
                 010725 ...) or pick it on the calendar -->

            <input

                #dateInput

                class="datepicker-input"

                type="text"

                autocomplete="off"

                spellcheck="false"

                [attr.id]="id || null"

                [attr.aria-expanded]="calendarVisible"

                [placeholder]="placeholder"

                [value]="typing ? draftText : displayValue"

                [disabled]="disabled"

                [readOnly]="readonly"

                [title]="typedInvalid ? 'Not a valid date : type e.g. 01-Jul-2025, 1/7/25 or 2025-07-01' : ''"

                (click)="openCalendar()"

                (focus)="onInputFocus($event)"

                (input)="onInput($event)"

                (blur)="commitTyped()"

                (keydown)="onKeyDown($event)">

            <!-- ICON -->

            <div

                class="datepicker-icon"

                role="button"

                aria-label="Open calendar"

                (mousedown)="$event.preventDefault()"

                (click)="toggleCalendar(); dateInput.focus()">

                <i class="far fa-calendar-alt"></i>

            </div>

        </div>

    </div>

</div>

<!-- =====================================================
     OVERLAY
     The calendar always opens at its regular width (380px),
     whatever the width of the date field
===================================================== -->

<app-overlay

    [origin]="origin"

    [(visible)]="calendarVisible"

    [width]="'380px'"

    [matchOriginWidth]="false"

    (closed)="closeCalendar()">

    <app-calendar

        [value]="draftDate ?? value"

        [minDate]="minDate"

        [maxDate]="maxDate"

        (valueChange)="onDateSelected($event)">

    </app-calendar>

</app-overlay>

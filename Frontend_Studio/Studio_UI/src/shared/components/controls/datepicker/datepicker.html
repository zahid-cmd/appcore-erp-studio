<!-- =====================================================
     DATEPICKER
===================================================== -->

<div class="datepicker-container">

    <!-- =====================================================
         LABEL (optional, same as app-textbox)
    ====================================================== -->

    <label

        *ngIf="label"

        class="datepicker-label"

        [attr.for]="id || null">

        <span>

            {{ label }}

        </span>

        <span

            *ngIf="required"

            class="datepicker-required">

            *

        </span>

    </label>

    <!-- =====================================================
         FIELD
    ====================================================== -->

    <div

        cdkOverlayOrigin

        #origin="cdkOverlayOrigin"

        class="datepicker"

        [class.disabled]="disabled"

        [class.readonly]="readonly">

        <!-- =================================================
             SELECTOR
        ================================================== -->

        <div

            class="datepicker-selector"

            role="button"

            [attr.id]="id || null"

            [attr.tabindex]="disabled ? -1 : 0"

            [attr.aria-expanded]="calendarVisible"

            [class.open]="calendarVisible"

            (click)="openCalendar()"

            (keydown)="onKeyDown($event)">

            <!-- VALUE -->

            <div class="datepicker-value">

                <ng-container

                    *ngIf="displayValue; else placeholderTemplate">

                    {{ displayValue }}

                </ng-container>

                <ng-template #placeholderTemplate>

                    <span class="datepicker-placeholder">

                        {{ placeholder }}

                    </span>

                </ng-template>

            </div>

            <!-- ICON -->

            <div class="datepicker-icon">

                <i class="far fa-calendar-alt"></i>

            </div>

        </div>

    </div>

</div>

<!-- =====================================================
     OVERLAY
===================================================== -->

<app-overlay

    [origin]="origin"

    [(visible)]="calendarVisible"

    [width]="'380px'"

    (closed)="closeCalendar()">

    <app-calendar

        [value]="value"

        [minDate]="minDate"

        [maxDate]="maxDate"

        (valueChange)="onDateSelected($event)">

    </app-calendar>

</app-overlay>

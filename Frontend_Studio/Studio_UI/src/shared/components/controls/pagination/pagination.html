<div class="pg">

    <!-- LEFT : the range -->

    <div class="pg-left">

        <span class="pg-range">{{ startRecord }} – {{ endRecord }}</span>

        <span class="pg-of">of <b>{{ totalRecords }}</b> {{ noun }}</span>

    </div>

    <!-- CENTRE : the pages -->

    <div class="pg-center">

        <div class="pg-track">

            <button
                type="button"
                class="pg-btn pg-nav"
                title="First page"
                [disabled]="!hasPrevious"
                (click)="goToPage(1)">
                <i class="fas fa-angles-left"></i>
            </button>

            <button
                type="button"
                class="pg-btn pg-nav"
                title="Previous page"
                [disabled]="!hasPrevious"
                (click)="previous()">
                <i class="fas fa-angle-left"></i>
            </button>

            <span class="pg-sep"></span>

            @for (item of pages; track item)
            {
                @if (isPage(item))
                {
                    <button
                        type="button"
                        class="pg-btn"
                        [class.pg-on]="item === currentPage"
                        (click)="goToPage(item)">
                        {{ item }}
                    </button>
                }
                @else
                {
                    <span class="pg-gap">…</span>
                }
            }

            <span class="pg-sep"></span>

            <button
                type="button"
                class="pg-btn pg-nav"
                title="Next page"
                [disabled]="!hasNext"
                (click)="next()">
                <i class="fas fa-angle-right"></i>
            </button>

            <button
                type="button"
                class="pg-btn pg-nav"
                title="Last page"
                [disabled]="!hasNext"
                (click)="goToPage(totalPages)">
                <i class="fas fa-angles-right"></i>
            </button>

        </div>

    </div>

    <!-- RIGHT : rows per page -->

    <div class="pg-right">

        <span class="pg-rows">Rows</span>

        <div class="pg-sizes">

            @if (autoRows > 0)
            {
                <button
                    type="button"
                    [class.pg-on]="autoActive"
                    title="As many as fit the screen"
                    (click)="choose(0)">
                    Auto ({{ autoRows }})
                </button>
            }

            @for (size of sizes; track size)
            {
                <button
                    type="button"
                    [class.pg-on]="!autoActive && size === pageSize"
                    (click)="choose(size)">
                    {{ size }}
                </button>
            }

        </div>

    </div>

</div>

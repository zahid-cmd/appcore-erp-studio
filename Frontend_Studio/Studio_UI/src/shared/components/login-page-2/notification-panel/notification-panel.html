<!-- ===========================================================
     LOGIN PAGE 1 — NOTIFICATION PANEL
     -----------------------------------------------------------
     PURPOSE:

         Clean and premium multi-notification panel for
         Login Page 1.

     IMPORTANT:

         This component controls ONLY the Notification Panel.

         No:
         - Page layout
         - Background page
         - Login form
         - Promotional content
         - Footer

     NOTIFICATION STRUCTURE:

         Notification 1
         Notification 2
         Notification 3

     Each notification is independently controlled by:

         visible
         heading
         message
         icon
         type
         dismissible

     Each notification can also be dismissed independently.
=========================================================== -->


<div
    class="login-page-notification-panel"
    *ngIf="
        config.visible
        &&
        hasVisibleNotifications
    "
>


    <!-- =======================================================
         NOTIFICATION LIST
    ======================================================== -->

    <div
        class="notification-list"
    >


        <!-- ===================================================
             NOTIFICATION ITEM
        ==================================================== -->

        <div
            class="notification-item"
            *ngFor="
                let notification of visibleNotifications;
                let index = index;
                trackBy: trackNotification
            "
            [ngClass]="
                getNotificationTypeClass(
                    notification
                )
            "
        >


            <!-- ===============================================
                 NOTIFICATION CONTENT
            ================================================ -->

            <div
                class="notification-content"
            >


                <!-- ===========================================
                     NOTIFICATION ICON
                ============================================ -->

                <div
                    class="notification-icon"
                >

                    <i
                        [class]="
                            getNotificationIcon(
                                notification
                            )
                        "
                        aria-hidden="true"
                    >
                    </i>

                </div>


                <!-- ===========================================
                     NOTIFICATION TEXT
                ============================================ -->

                <div
                    class="notification-text"
                >


                    <!-- =======================================
                         NOTIFICATION HEADING
                    ======================================== -->

                    <div
                        class="notification-heading"
                        *ngIf="
                            notification.heading
                        "
                    >
                        {{ notification.heading }}
                    </div>


                    <!-- =======================================
                         NOTIFICATION MESSAGE
                    ======================================== -->

                    <div
                        class="notification-message"
                        *ngIf="
                            notification.message
                        "
                    >
                        {{ notification.message }}
                    </div>


                </div>


                <!-- ===========================================
                     DISMISS BUTTON
                ============================================ -->

                <button
                    *ngIf="
                        notification.dismissible
                    "
                    type="button"
                    class="notification-dismiss"
                    aria-label="Dismiss notification"
                    (click)="
                        dismiss(index)
                    "
                >

                    <i
                        class="fas fa-times"
                        aria-hidden="true"
                    >
                    </i>

                </button>


            </div>


        </div>


    </div>


</div>

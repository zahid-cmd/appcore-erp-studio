<!-- ===========================================================
     LOGIN PAGE BRANDING
     -----------------------------------------------------------
     BLUE / WHITE APPCORE BRANDING
============================================================ -->


<div
    class="login-page-branding"
    *ngIf="config.visible"
>


    <!-- =======================================================
         BRANDING CONTENT
         -------------------------------------------------------
         The branding surface wraps only the actual logo.
    ======================================================== -->

    <div
        class="branding-content"
    >


        <!-- ===================================================
             BLUE / WHITE BRAND LOGO
             ---------------------------------------------------
             The logo source is controlled by:

                 config.logoUrl

             The logo keeps its natural aspect ratio.
        ==================================================== -->

        <img
            class="branding-logo"
            [src]="config.logoUrl"
            [style]="logoStyle"
            alt="AppCore Technologies"
        />


    </div>


</div>

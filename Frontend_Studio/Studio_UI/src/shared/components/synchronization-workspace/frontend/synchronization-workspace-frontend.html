<div class="workspace-columns">

    <!-- =====================================================
         TARGET LOCATION
    ====================================================== -->

    <section class="workspace-section">

        <div class="workspace-section-title">

            <i class="fas fa-location-dot">

            </i>

            <span>

                Target Location

            </span>

        </div>

        <app-textbox

            label="Frontend Solution"

            [readonly]="targetLocationReadonly"

            [(value)]="frontendSolution"

            (valueChange)="frontendSolutionChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Project"

            [readonly]="targetLocationReadonly"

            [(value)]="projectName"

            (valueChange)="projectNameChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Source Folder"

            [readonly]="targetLocationReadonly"

            [(value)]="sourceFolder"

            (valueChange)="sourceFolderChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Feature Folder"

            [readonly]="targetLocationReadonly"

            [(value)]="featureFolder"

            (valueChange)="featureFolderChange.emit($event)">

        </app-textbox>

    </section>

    <!-- =====================================================
         STANDARD MODULE STRUCTURE
    ====================================================== -->

    <section class="workspace-section">

        <div class="workspace-section-title">

            <i class="fas fa-folder-tree">

            </i>

            <span>

                Standard Module Structure

            </span>

        </div>

        <app-textbox

            label="Module Folder"

            [readonly]="standardStructureReadonly"

            [(value)]="moduleFolder"

            (valueChange)="moduleFolderChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Model Folder"

            [readonly]="standardStructureReadonly"

            [(value)]="modelFolder"

            (valueChange)="modelFolderChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Pages Folder"

            [readonly]="standardStructureReadonly"

            [(value)]="pagesFolder"

            (valueChange)="pagesFolderChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Routes Folder"

            [readonly]="standardStructureReadonly"

            [(value)]="routesFolder"

            (valueChange)="routesFolderChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Services Folder"

            [readonly]="standardStructureReadonly"

            [(value)]="servicesFolder"

            (valueChange)="servicesFolderChange.emit($event)">

        </app-textbox>

    </section>

    <!-- =====================================================
         APPLICATION REGISTRATION
    ====================================================== -->

    <section class="workspace-section">

        <div class="workspace-section-title">

            <i class="fas fa-gears">

            </i>

            <span>

                Application Registration

            </span>

        </div>

        <app-textbox

            label="Module Route File"

            [readonly]="applicationRegistrationReadonly"

            [(value)]="routeFile"

            (valueChange)="routeFileChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Parent Route File"

            [readonly]="applicationRegistrationReadonly"

            [(value)]="applicationRouteFile"

            (valueChange)="applicationRouteFileChange.emit($event)">

        </app-textbox>

        <app-textbox

            label="Route Path"

            [readonly]="applicationRegistrationReadonly"

            [(value)]="routePath"

            (valueChange)="routePathChange.emit($event)">

        </app-textbox>

    </section>

</div>

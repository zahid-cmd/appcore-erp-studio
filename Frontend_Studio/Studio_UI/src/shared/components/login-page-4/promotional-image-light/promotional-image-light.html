<!-- ===========================================================
     LOGIN PAGE 2 — PROMOTIONAL IMAGE LIGHT
     -----------------------------------------------------------
     PURPOSE:

         Clean light promotional image container.

     IMPORTANT:

         This component contains ONLY the promotional image.

         No:
         - Border
         - Background
         - Card
         - Shadow
         - Overlay
         - Additional content

         Image sizing and positioning are controlled exclusively
         by promotional-image-light.css.

         The CSS master controls:

             width
             height
             object-fit
             object-position

         Angular does NOT override these values through
         inline styles.
=========================================================== -->


<div
    class="login-page-promotional-image-light"
    *ngIf="config.visible"
>


    <!-- =======================================================
         PROMOTIONAL IMAGE
    ======================================================== -->

    <img
        *ngIf="config.imageUrl"
        class="promotional-image-light"
        [src]="config.imageUrl"
        [style]="imageStyle"
        [alt]="config.altText"
    >


    <!-- =======================================================
         EMPTY IMAGE STATE
    ======================================================== -->

    <div
        *ngIf="!config.imageUrl"
        class="promotional-image-light-empty"
    >
    </div>


</div>

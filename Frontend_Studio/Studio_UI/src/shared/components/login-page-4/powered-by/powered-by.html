<!-- =========================================================
     POWERED BY
     ---------------------------------------------------------
     Six fixed logo positions.

     Rules:
     - No platform.
     - No platform depth.
     - No platform shadow.
     - Empty logo slots remain completely invisible.
     - If all six logo URLs are empty, the entire child
       renders completely blank.

     Layout:
     - Powered By text appears ABOVE the logos.
     - Six logos remain horizontally aligned.
========================================================== -->

<div
    class="login-page-powered-by"
    *ngIf="
        config.visible &&
        hasRenderableLogos
    "
>


    <!-- =====================================================
         POWERED BY LABEL
         -----------------------------------------------------
         Positioned ABOVE the logo area.
         
         Horizontal alignment and spacing are controlled
         by powered-by.css.
    ====================================================== -->


    <!-- =====================================================
         LOGO AREA
         -----------------------------------------------------
         Six fixed horizontal logo positions.
    ====================================================== -->

    <div
        class="powered-by-logo-area"
    >


        <!-- =================================================
             LOGO SLOT 1
        ================================================== -->

        <div
            class="powered-by-logo-slot powered-by-logo-slot-1"
            *ngIf="
                config.logos[0]?.visible &&
                config.logos[0]?.logoUrl?.trim()
            "
        >

            <div
                class="powered-by-logo
                       {{ getLogoSlotClass(config.logos[0]) }}"
                [style]="getLogoStyle(config.logos[0])"
            >

                <img
                    [src]="config.logos[0].logoUrl"
                    [alt]="config.logos[0].altText"
                />

            </div>

        </div>


        <!-- =================================================
             LOGO SLOT 2
        ================================================== -->

        <div
            class="powered-by-logo-slot powered-by-logo-slot-2"

<!-- ===========================================================
     DASHBOARD CUSTOMIZED
=========================================================== -->

<div
    class="dashboard-customized">


    <!-- =======================================================
         DASHBOARD HEADER
         -------------------------------------------------------
         FIXED — NEVER SCROLLS
    ======================================================== -->

    <app-page-header

        title="Dashboard"

        subtitle="Welcome back. Here's what's happening across your ERP."

        icon="fas fa-gauge-high">


        <!-- ===================================================
             DASHBOARD ACTIONS
        ==================================================== -->

        <div pageHeaderRight>

            <app-command-center

                command1Text="Customize"

                command1Icon="fas fa-sliders"

                command2Text="Refresh"

                command2Icon="fas fa-rotate-right"

                rightCommandIcon="fas fa-arrow-left"

                (command2Click)="
                    refreshDashboard()
                "

                (rightCommandClick)="
                    back()
                ">

            </app-command-center>

        </div>


    </app-page-header>



    <!-- =======================================================
         DASHBOARD SCROLL VIEWPORT
         -------------------------------------------------------
         ONLY THIS AREA SCROLLS
    ======================================================== -->

    <div
        class="
            dashboard-customized-scroll-wrapper
            appcore-scrollbar
        ">


        <!-- ===================================================
             DASHBOARD CONTENT
        ==================================================== -->

        <div
            class="dashboard-customized-content">


            <!-- ===============================================
                 ORBIT LOADER
                 -----------------------------------------------
                 APPCORE STANDARD LOADER
            ================================================= -->

            <app-orbit-loader

                *ngIf="loading"

                title="Loading Dashboard"

                message="Preparing your dashboard widgets."

                size="medium"

                [showMessage]="true"

                [overlay]="false">

            </app-orbit-loader>



            <!-- ===============================================
                 LOAD FAILURE
                 -----------------------------------------------
                 GENUINE CONFIGURATION / SERVER ERROR
            ================================================= -->

            <div

                class="
                    dashboard-empty-state
                    dashboard-load-failed
                "

                *ngIf="
                    !loading &&
                    loadFailed
                ">


                <div
                    class="dashboard-empty-icon">

                    <i
                        class="fas fa-triangle-exclamation">
                    </i>

                </div>


                <div
                    class="dashboard-empty-title">

                    Dashboard Could Not Be Loaded

                </div>


                <div
                    class="dashboard-empty-message">

                    The dashboard configuration could not be loaded.

                </div>


                <button

                    type="button"

                    class="dashboard-state-button"

                    (click)="
                        refreshDashboard()
                    ">

                    <i
                        class="fas fa-rotate-right">
                    </i>

                    Retry

                </button>


            </div>



            <!-- ===============================================
                 DASHBOARD CONTENT
            ================================================= -->

            <ng-container

                *ngIf="
                    !loading &&
                    !loadFailed
                ">


                <!-- ===========================================
                     EMPTY DASHBOARD
                     -------------------------------------------
                     SHARED APPCORE EMPTY STATE
                ============================================ -->

                <app-empty-state

                    *ngIf="
                        dashboardWidgets.length === 0
                    "

                    icon="fas fa-table-columns"

                    title="No Widgets Configured"

                    subtitle="
                        No active widgets are currently configured
                        for this dashboard.
                    ">

                </app-empty-state>



                <!-- ===========================================
                     WIDGET GRID
                     -------------------------------------------
                     SAME 12-COLUMN CONFIGURATION SYSTEM
                     AS DEFAULT DASHBOARD
                ============================================ -->

                <div

                    class="dashboard-widget-grid"

                    *ngIf="
                        dashboardWidgets.length > 0
                    ">


                    <!-- =======================================
                         CONFIGURED DASHBOARD WIDGETS
                    ======================================== -->

                    <ng-container

                        *ngFor="
                            let widget of dashboardWidgets;
                            trackBy: trackByWidgetId
                        ">


                        <!-- ===================================
                             DASHBOARD WIDGET
                             -----------------------------------
                             ColumnSpan:
                             Controls widget width.

                             DisplayOrder:
                             Controls widget position.
                        ==================================== -->

                        <div

                            class="dashboard-widget"

                            [style.grid-column]="
                                'span ' +
                                widget.columnSpan
                            ">


                            <!-- ===============================
                                 WIDGET CONTENT
                            ================================ -->

                            <div
                                class="
                                    dashboard-widget-content
                                ">


                                <app-component-renderer

                                    [componentKey]="
                                        widget.componentPath
                                    ">

                                </app-component-renderer>


                            </div>


                        </div>


                    </ng-container>


                </div>


            </ng-container>


        </div>


    </div>


</div>
